name: Vigilante del BOE

on:
  schedule:
    - cron: "17 6,17 * * *"   # todos los días, 06:17 y 17:17 UTC (el BOE publica de madrugada; extraordinarios por la tarde)
  workflow_dispatch:

concurrency: boe

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # La memoria (qué normas ya avisó) se guarda en la caché de GitHub: sin commits ni IA.
      - name: Recuperar estado
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: alertas/estado_boe.json
          key: estado-boe-${{ github.run_id }}
          restore-keys: estado-boe-

      - name: Vigilar el BOE
        run: python scripts/vigilante_boe.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado
        if: always() && hashFiles('alertas/estado_boe.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: alertas/estado_boe.json
          key: estado-boe-${{ github.run_id }}
