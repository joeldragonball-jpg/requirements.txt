name: Vigilante de notas del Poder Judicial (C143)

# SIN ACTIVAR: de momento solo se lanza a mano (workflow_dispatch). Para activar el aviso automático,
# quita la almohadilla de las dos líneas del cron (decisión de Joel). Sin IA ni claves de Anthropic.
on:
  # schedule:
  #   - cron: "23 7,11,15,19 * * 1-5"   # días laborables, cuatro veces al día (UTC)
  workflow_dispatch:

concurrency: poder-judicial

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # La memoria (qué notas ya avisó) se guarda en la caché de GitHub: sin commits ni IA.
      - name: Recuperar estado
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: alertas/estado_poder_judicial.json
          key: estado-poder-judicial-${{ github.run_id }}
          restore-keys: estado-poder-judicial-

      - name: Vigilar notas del Poder Judicial
        run: python scripts/vigilante_poder_judicial.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado
        if: always() && hashFiles('alertas/estado_poder_judicial.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: alertas/estado_poder_judicial.json
          key: estado-poder-judicial-${{ github.run_id }}
