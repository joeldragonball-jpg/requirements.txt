name: Precios casi en vivo

# Sin IA y sin claves propias (C142): baja CoinGecko, DefiLlama, alternative.me y Yahoo Finance cada hora y guarda
# precios/precios_vivos.json en la rama «datos» (la misma de las noticias; así no llena «main» de commits).
# La Órbita y el móvil lo leen al abrirse y repintan las cifras sin esperar a la foto diaria de paneles.yml.

on:
  schedule:
    - cron: "7 * * * *"       # cada hora, al minuto 7 (evita la hora en punto, cuando GitHub va más cargado)
  workflow_dispatch:          # botón "Run workflow"

permissions:
  contents: write             # para guardar el archivo en la rama «datos»

concurrency: precios

jobs:
  precios:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # La rama «datos» se baja en otra carpeta para escribir ahí sin tocar «main»
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: datos
          path: rama-datos

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Solo biblioteca estándar. Si una fuente falla queda anotada en «fallos» del propio archivo.
      - name: Descargar los precios
        run: python scripts/precios_vivos.py rama-datos/precios

      - name: Comprobar el archivo
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("rama-datos/precios/precios_vivos.json", encoding="utf-8"))
          assert d.get("cripto") or d.get("mercado"), "archivo sin datos"
          print("precios_vivos.json correcto:", ", ".join(sorted(k for k in d if k != "fallos")), "· fallos:", len(d.get("fallos", [])))
          EOF

      - name: Guardar en la rama datos si hay cambios
        working-directory: rama-datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios/precios_vivos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Precios casi en vivo (sin IA)"
          git pull --rebase origin datos
          git push origin HEAD:datos
