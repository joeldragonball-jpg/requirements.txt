name: Despertador de la app

on:
  schedule:
    - cron: "41 4,10,16,22 * * *"   # 6:41 de la mañana en España y luego cada 6 horas (hora UTC)
  workflow_dispatch:                # botón "Run workflow" para lanzarlo a mano

concurrency: despertador

permissions:
  contents: read                    # solo lee el repo (C101)

jobs:
  despertar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Abrir la app para que esté despierta
        run: python despertador/despertar.py
