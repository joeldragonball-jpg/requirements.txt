name: Revisión semanal del cerebro

on:
  schedule:
    - cron: "17 19 * * 0"      # domingos 19:17 UTC (21:17 en España), después del resumen semanal
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano
    inputs:
      sin_telegram:
        description: "No enviar el resumen por Telegram (solo guardar el informe)"
        type: boolean
        default: false

permissions:
  contents: write              # para guardar el informe en informes/ y el consumo en la rama 'datos'

concurrency: revision

jobs:
  revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests anthropic

      # UNA llamada a Claude por semana (≈ 0,07 $). Solo informa: no modifica nada del cerebro.
      - name: Revisar el cerebro
        run: python revision/revision.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIN_TELEGRAM: ${{ github.event.inputs.sin_telegram }}
