name: Actualizar paneles de datos

# Sin IA y sin claves: solo descarga datos abiertos (Tesoro de EE. UU., BCE, MoF Japón, Banco de Inglaterra,
# Fed de Nueva York, Banco de Brasil, Banco de Canadá, DefiLlama, CoinGecko, Yahoo Finance) y reescribe explorador/paneles.json. Los datos del FMI están en explorador/deuda-fmi.json (a mano).

on:
  schedule:
    - cron: "30 21 * * 1-5"   # lunes a viernes 21:30 UTC (23:30 en España en verano), tras el cierre de EE. UU.
  workflow_dispatch:          # botón "Run workflow"

permissions:
  contents: write             # para guardar explorador/paneles.json

concurrency: paneles

jobs:
  paneles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # El script solo usa la biblioteca estándar. Si una fuente falla conserva el dato anterior y sale con 1.
      # C201: rellena sin IA ni claves el paro/IPC/PIB de EE. UU. (FRED) y el tipo de Suecia (Riksbank); si falla, conserva lo anterior.
      - name: Automatizar datos manuales
        continue-on-error: true
        run: python scripts/automatizar_manuales.py

      - name: Descargar los datos
        id: datos
        continue-on-error: true
        timeout-minutes: 8   # si una fuente se cuelga, se corta aquí y se guarda lo que haya (antes se perdían los 15 min del trabajo entero)
        run: python scripts/actualizar_paneles.py

      # Histórico de precios diarios para «Ver reacción» de la línea de tiempo. Solo stdlib, sin IA ni claves; si un símbolo falla conserva la serie anterior.
      - name: Actualizar el histórico de precios
        id: precios_historico
        continue-on-error: true
        run: python scripts/actualizar_precios_historico.py

      # Series históricas de Países (C135): Eurostat y Banco Mundial, sin IA ni claves; si falla conserva el archivo anterior.
      # Las series de deuda/déficit del FMI se leen a mano tras cada WEO (explorador/indicadores-historia-fmi.json).
      - name: Actualizar la historia de indicadores
        id: historia
        timeout-minutes: 10   # tope propio: si una API se cuelga se corta aquí y el resto del trabajo sigue
        continue-on-error: true
        run: python scripts/indicadores_historia.py

      # Cuadro de valoración sectorial (C26): precio de Yahoo + SEC companyfacts, 18 valores. Sin IA ni claves; si falla conserva el anterior.
      - name: Actualizar la valoración sectorial
        id: valoracion
        continue-on-error: true
        run: python scripts/valoracion_sectorial.py

      # Fondos y bolsa (22-nov): índices con rentabilidades, OPV y altas del S&P 500 (Yahoo, Renaissance Capital, Wikipedia). Sin IA ni claves; si falla conserva lo anterior.
      - name: Actualizar bolsas
        id: bolsas
        continue-on-error: true
        run: python scripts/leer_bolsas.py

      # Versión móvil (docs/movil): resume los datos públicos y el petróleo en docs/movil/data.json. Sin IA y sin claves.
      - name: Traer la rama de noticias (solo lectura)
        run: git fetch origin datos:refs/remotes/origin/datos --depth=1

      # Noticias del bot (nota ≥ 7, últimas 72 h) como movimientos de la Órbita con caducidad (C35). Sin IA ni red.
      - name: Colgar las noticias en la Órbita
        continue-on-error: true
        run: python scripts/noticias_a_orbita.py

      # C355: valor tokenizado por red (RWA.xyz, DefiLlama, Horizon). Sin IA ni claves; si falla conserva lo anterior.
      - name: Leer lo tokenizado por red
        id: tokenizado
        continue-on-error: true
        run: python scripts/leer_tokenizado.py

      # 25-nov: tráfico diario en Ormuz (IMF PortWatch). Sin IA ni claves; si falla conserva lo anterior.
      - name: Leer tráfico de Ormuz (PortWatch)
        continue-on-error: true
        run: python scripts/leer_portwatch.py

      # 25-nov: lectores que ya existían pero no corrían solos (auditoría de automatizaciones). Sin IA ni claves; cada uno con tope
      # de tiempo y continue-on-error: si una fuente falla, conserva el archivo anterior y el resto del trabajo sigue.
      - name: Leer rendimientos DeFi, incidentes, on-chain y validadores
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python scripts/leer_rendimientos.py || true
          python scripts/leer_incidentes.py || true
          python scripts/leer_onchain.py || true
          python scripts/leer_validadores.py || true

      - name: Leer liquidez global (Fed, BCE, BoJ, PBoC)
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/leer_liquidez.py

      # 26-nov: más lectores oficiales que existían sin automatizar (calendario oficial, Congreso, Eurostat, ESMA, gobernanza de cadenas,
      # liquidez de tokens, energía/vivienda y mortalidad de España). Probados uno a uno en local (2-48 s); sin IA ni claves.
      - name: Leer calendario oficial, Congreso, Eurostat, ESMA, gobernanza, tokens, energía y mortalidad
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python scripts/leer_calendario_oficial.py || true
          python scripts/leer_votaciones_congreso.py || true
          python scripts/leer_congreso.py || true
          python scripts/leer_seguridad_eurostat.py || true
          python scripts/leer_esma_mica.py || true
          python scripts/leer_gobernanza.py || true
          python scripts/leer_liquidez_tokens.py || true
          python scripts/leer_espana_energia.py || true
          python scripts/leer_mortalidad_ine.py || true

      - name: Leer comparativa de liquidación, profundidad de mercado y pagos públicos de España
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python scripts/leer_comparativa.py || true
          python scripts/leer_profundidad.py || true
          python scripts/leer_pagos_espana.py || true

      - name: Leer OCDE y BIS (indicadores de países)
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/leer_ocde_bis.py

      - name: Construir los datos de la versión móvil
        id: movil
        continue-on-error: true
        run: python scripts/construir_movil.py

      # Seguimiento (PC y móvil): lee las colas, informes, predicciones y el estado de los bots. Sin IA ni claves propias.
      - name: Construir los datos de Seguimiento
        id: seguimiento
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/construir_seguimiento.py

      # Órbita para la tablet (C141): el Explorador completo como página suelta en docs/orbita/. Sin IA ni claves; sin nada de privado/.
      - name: Construir la Órbita para la tablet
        id: orbita
        continue-on-error: true
        run: python scripts/construir_orbita.py

      - name: Comprobar el archivo
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("explorador/paneles.json", encoding="utf-8"))
          for k in ("tic", "stablecoins", "mercado", "deuda"):
              assert k in d, f"falta {k}"
          print("paneles.json correcto:", ", ".join(sorted(d)))
          EOF

      - name: Guardar si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorador/tokenizado.json explorador/indicadores-manual.json explorador/tipos-manual.json explorador/paneles.json explorador/indicadores-historia.json explorador/precios_historico.json explorador/valoracion.json explorador/bolsas.json explorador/ormuz-portwatch.json explorador/rendimientos-defillama.json explorador/cadenas-incidentes.json explorador/cadenas-onchain.json explorador/cadenas-validadores.json explorador/cadenas-validadores-historial.jsonl explorador/ocde-bis.json explorador/liquidez-manual.json explorador/calendario-oficial.json explorador/espana-votaciones.json explorador/espana-politica.json explorador/seguridad-eurostat.json explorador/mica-registro.json explorador/cadenas-gobernanza.json explorador/cadenas-token.json explorador/espana-energia-vivienda.json explorador/espana-mortalidad.json explorador/comparativa-liquidacion.json explorador/profundidad-multidivisa.json explorador/profundidad-historial.jsonl explorador/espana-pagos.json explorador/datos.json explorador/noticias-archivo.json docs/movil/data.json docs/movil/seguimiento.json docs/orbita/index.html research/PLANNING.md
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Paneles de datos: actualización automática (sin IA)"
          git checkout -- .   # descarta restos generados que no se guardan (evita «unstaged changes» al hacer pull --rebase)
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Avisar si alguna fuente falló
        if: steps.datos.outcome == 'failure' || steps.movil.outcome == 'failure' || steps.valoracion.outcome == 'failure' || steps.seguimiento.outcome == 'failure'
        run: |
          echo "::warning::Alguna fuente falló; se conservó el dato anterior de esa parte. Revisa el registro del paso «Descargar los datos»."
