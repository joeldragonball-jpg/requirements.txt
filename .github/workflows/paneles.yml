name: Actualizar paneles de datos

# Sin IA y sin claves: solo descarga datos abiertos (Tesoro de EE. UU., BCE, MoF Japón, Banco de Inglaterra,
# Fed de Nueva York, Banco de Brasil, Banco de Canadá, DefiLlama, CoinGecko, Yahoo Finance) y reescribe explorador/paneles.json. Los datos del FMI están en explorador/deuda-fmi.json (a mano).

on:
  schedule:
    - cron: "30 21 * * 1-5"   # lunes a viernes 21:30 UTC (23:30 en España en verano), tras el cierre de EE. UU.
  workflow_dispatch:          # botón "Run workflow"

permissions:
  contents: write             # para guardar explorador/paneles.json

concurrency: paneles

jobs:
  paneles:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El script solo usa la biblioteca estándar. Si una fuente falla conserva el dato anterior y sale con 1.
      - name: Descargar los datos
        id: datos
        continue-on-error: true
        run: python scripts/actualizar_paneles.py

      # Versión móvil (docs/movil): resume los datos públicos y el petróleo en docs/movil/data.json. Sin IA y sin claves.
      - name: Traer la rama de noticias (solo lectura)
        run: git fetch origin datos:refs/remotes/origin/datos --depth=1

      - name: Construir los datos de la versión móvil
        id: movil
        continue-on-error: true
        run: python scripts/construir_movil.py

      # Seguimiento (PC y móvil): lee las colas, informes, predicciones y el estado de los bots. Sin IA ni claves propias.
      - name: Construir los datos de Seguimiento
        id: seguimiento
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/construir_seguimiento.py

      - name: Comprobar el archivo
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("explorador/paneles.json", encoding="utf-8"))
          for k in ("tic", "stablecoins", "mercado", "deuda"):
              assert k in d, f"falta {k}"
          print("paneles.json correcto:", ", ".join(sorted(d)))
          EOF

      - name: Guardar si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explorador/paneles.json docs/movil/data.json docs/movil/seguimiento.json research/PLANNING.md
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Paneles de datos: actualización automática (sin IA)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Avisar si alguna fuente falló
        if: steps.datos.outcome == 'failure' || steps.movil.outcome == 'failure' || steps.seguimiento.outcome == 'failure'
        run: |
          echo "::warning::Alguna fuente falló; se conservó el dato anterior de esa parte. Revisa el registro del paso «Descargar los datos»."
