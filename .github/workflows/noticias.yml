name: Noticias con IA

on:
  schedule:
    - cron: "23 * * * *"    # cada hora: recoge tus 👍/👎 y, a las horas de envío, manda noticias
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano
    inputs:
      prueba:
        description: "Enviar ahora unas noticias de prueba"
        type: boolean
        default: true

permissions:
  contents: write            # para guardar las noticias en la rama 'datos'

concurrency: noticias

jobs:
  noticias:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install requests feedparser anthropic

      - name: Noticias
        run: python noticias/noticias.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOJA_ID: ${{ secrets.HOJA_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PRUEBA: ${{ github.event.inputs.prueba }}
