name: Aviso de eventos

on:
  schedule:
    - cron: "47 5 * * *"   # una vez al día (07:47 en verano, 06:47 en invierno, hora de Madrid); si no hay evento hoy o mañana, no envía nada
  workflow_dispatch:        # botón "Run workflow"
    inputs:
      prueba:
        description: "Incluir también el resumen de los próximos 7 días"
        type: boolean
        default: true

concurrency: eventos

permissions:
  contents: read                    # solo lee el repo (C101)

jobs:
  eventos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Avisar de eventos
        run: python eventos/avisos.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ github.event.inputs.prueba }}

      # C206: alertas de los datos del tablero (datos en rojo, tipos oficiales, noticias [P]). Sin IA.
      # La memoria (qué se avisó ya) va en la caché de GitHub, como en alertas.yml: sin commits.
      - name: Recuperar estado de las alertas de datos
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: alertas/estado-datos.json
          key: estado-datos-${{ github.run_id }}
          restore-keys: estado-datos-

      - name: Alertas de datos del tablero
        continue-on-error: true          # si falla, el aviso del calendario ya salió y no se marca todo en rojo
        run: python alertas/datos.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado de las alertas de datos
        if: always() && hashFiles('alertas/estado-datos.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: alertas/estado-datos.json
          key: estado-datos-${{ github.run_id }}
