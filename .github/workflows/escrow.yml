name: Vigilancia escrow de Ripple

on:
  schedule:
    - cron: "12 6 * * *"   # una vez al día; avisa si el total en escrow cambia y el día 1 de cada mes
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar el estado aunque no haya cambios"
        type: boolean
        default: true

concurrency: escrow

permissions:
  contents: read                    # solo lee el repo (C101)

jobs:
  escrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # La memoria (total de la última vez) se guarda en la caché de GitHub, sin commits
      - name: Recuperar estado
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: eventos/estado-escrow.json
          key: estado-escrow-${{ github.run_id }}
          restore-keys: estado-escrow-
      - name: Comprobar el escrow y avisar
        run: python eventos/escrow.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ github.event.inputs.prueba }}
      - name: Guardar estado
        if: always() && hashFiles('eventos/estado-escrow.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: eventos/estado-escrow.json
          key: estado-escrow-${{ github.run_id }}
