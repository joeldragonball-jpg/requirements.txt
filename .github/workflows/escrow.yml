name: Vigilancia escrow de Ripple

on:
  schedule:
    - cron: "12 6 * * *"   # una vez al día; avisa si el total en escrow cambia y el día 1 de cada mes
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar el estado aunque no haya cambios"
        type: boolean
        default: true

concurrency: escrow

jobs:
  escrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # La memoria (total de la última vez) se guarda en la caché de GitHub, sin commits
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: eventos/estado-escrow.json
          key: estado-escrow-${{ github.run_id }}
          restore-keys: estado-escrow-
      - name: Comprobar el escrow y avisar
        run: python eventos/escrow.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ github.event.inputs.prueba }}
      - name: Guardar estado
        if: always() && hashFiles('eventos/estado-escrow.json') != ''
        uses: actions/cache/save@v4
        with:
          path: eventos/estado-escrow.json
          key: estado-escrow-${{ github.run_id }}
