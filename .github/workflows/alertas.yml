name: Alertas de precio

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min, lejos de las horas en punto (GitHub descarta más ejecuciones a :00 y :30)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      prueba:
        description: "Enviar mensaje de prueba con el resumen"
        type: boolean
        default: true

concurrency: alertas

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # La "memoria" del bot (qué niveles ya avisó) se guarda en la caché de GitHub,
      # así no se hacen commits cada media hora ni se reinicia la app de Streamlit.
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: alertas/estado.json
          key: estado-alertas-${{ github.run_id }}
          restore-keys: estado-alertas-

      - name: Comprobar precios y avisar
        run: python alertas/alertas.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOJA_ID: ${{ secrets.HOJA_ID }}
          PRUEBA: ${{ github.event.inputs.prueba }}

      - name: Guardar estado
        if: always() && hashFiles('alertas/estado.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alertas/estado.json
          key: estado-alertas-${{ github.run_id }}
