name: Verificar apuntes

on:
  workflow_dispatch:          # solo a mano (botón "Run workflow"): gasta API de Anthropic; las [VERIFICAR] se cierran en W05 con la suscripción

permissions:
  contents: write             # para guardar el resultado en la rama 'datos'

concurrency: verificar

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install requests anthropic

      - name: Verificar datos dudosos de los apuntes
        run: python verificacion/verificar.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
