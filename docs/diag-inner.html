<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;background:#0b0f17;color:#e5e7eb;font:12px/1.3 Consolas,monospace}
#r{position:fixed;inset:0;border:4px solid #ff3b30;box-sizing:border-box}
#v{position:fixed;left:0;right:0;top:0;height:100vh;border:2px dashed #22d3ee;box-sizing:border-box}
#p{position:fixed;left:0;right:0;top:0;height:100%;border:2px dashed #4ade80;box-sizing:border-box}
#t{position:relative;padding:8px 10px;white-space:pre-wrap}
#f{position:fixed;left:0;right:0;bottom:6px;text-align:center;color:#ff3b30;font-weight:700;background:#000a}
#sonda{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style></head><body>
<div id="r"></div><div id="v"></div><div id="p"></div><div id="sonda"></div><div id="t"></div><div id="f">ROJO = borde inferior del contenido del marco</div>
<script>
var s=getComputedStyle(document.getElementById("sonda"));
document.getElementById("t").textContent="DENTRO DEL MARCO\ninnerHeight: "+innerHeight+"\nclientHeight: "+document.documentElement.clientHeight+"\nsafe top/bottom: "+s.paddingTop+" / "+s.paddingBottom+"\nrojo=inset:0  cian=100vh  verde=100%";
</script></body></html>
