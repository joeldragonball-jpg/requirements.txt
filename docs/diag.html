<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diag">
<title>Diagnostico pantalla</title>
<style>
  html, body { margin: 0; background: #0b0f17; color: #e5e7eb; font: 13px/1.35 -apple-system, Arial, sans-serif; }
  .caja { position: fixed; left: 0; right: 0; top: 0; box-sizing: border-box; pointer-events: none; }
  .caja span { position: absolute; right: 4px; bottom: 2px; font-size: 11px; font-weight: 700; background: #000a; padding: 0 3px; }
  #c1 { bottom: 0; border: 3px solid #ff3b30; }
  #c2 { height: 100vh;  border: 2px dashed #22d3ee; }
  #c3 { height: 100dvh; border: 2px dashed #facc15; }
  #c4 { height: 100lvh; border: 2px dashed #4ade80; }
  #c5 { height: 100svh; border: 2px dashed #f472b6; }
  #c1 span { color: #ff3b30; bottom: 20px } #c2 span { color: #22d3ee; bottom: 38px } #c3 span { color: #facc15; bottom: 56px }
  #c4 span { color: #4ade80; bottom: 74px } #c5 span { color: #f472b6; bottom: 92px }
  #datos { position: relative; padding: 70px 14px 0; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px; }
  #sonda { position: absolute; visibility: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
           padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
</style>
</head>
<body>
<div class="caja" id="c1"><span>fixed bottom:0</span></div>
<div class="caja" id="c2"><span>100vh</span></div>
<div class="caja" id="c3"><span>100dvh</span></div>
<div class="caja" id="c4"><span>100lvh</span></div>
<div class="caja" id="c5"><span>100svh</span></div>
<div id="sonda"></div>
<div id="datos">midiendo...</div>
<script>
function medir() {
  var s = getComputedStyle(document.getElementById("sonda"));
  var vv = window.visualViewport;
  var l = [
    "DIAGNOSTICO (haz una captura de TODA la pantalla)",
    "standalone (apple): " + (navigator.standalone === undefined ? "n/d" : navigator.standalone),
    "display-mode standalone: " + (window.matchMedia("(display-mode: standalone)").matches),
    "innerWidth x innerHeight: " + innerWidth + " x " + innerHeight,
    "outerHeight: " + outerHeight,
    "screen: " + screen.width + " x " + screen.height + "  dpr " + devicePixelRatio,
    "visualViewport h: " + (vv ? vv.height + " (offsetTop " + vv.offsetTop + ")" : "n/d"),
    "documentElement.clientHeight: " + document.documentElement.clientHeight,
    "safe-area top/bottom: " + s.paddingTop + " / " + s.paddingBottom,
    "safe-area left/right: " + s.paddingLeft + " / " + s.paddingRight,
    "",
    "Cajas: rojo=fixed bottom:0, cian=100vh, amarillo=100dvh,",
    "verde=100lvh, rosa=100svh. Fíjate cual llega al borde",
    "inferior de la pantalla y cual se queda corta."
  ];
  document.getElementById("datos").textContent = l.join("\n");
}
medir(); addEventListener("resize", medir); setTimeout(medir, 600);
</script>
</body>
</html>
