<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--alto:820px;--bg:#050816;--panel:rgba(9,14,30,.88);--linea:rgba(148,163,184,.16);--texto:#e6ebf5;--suave:#a8b5cd;--oro:#d4a84b}
*{box-sizing:border-box}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:rgba(148,163,184,.08);border-radius:2px}
::-webkit-scrollbar-thumb{background:rgba(226,232,240,.5);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:rgba(241,213,138,.85)}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:rgba(226,232,240,.45) rgba(148,163,184,.08)}}
html,body{margin:0;overflow:hidden;background:transparent;color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:minmax(0,1fr);padding:2px 6px 6px;height:var(--alto);--pw:520px}
#izq{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.vidrio{background:rgba(9,14,30,.5);border:1px solid rgba(148,163,184,.12);border-radius:10px;backdrop-filter:blur(8px)}
#barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px}
#barra button,#barra input[type=text]{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:6px 11px;font:inherit;font-size:13px;transition:.15s}
#barra button{cursor:pointer}#barra button:hover{border-color:var(--oro);color:#fff}
#barra label{color:var(--suave);display:flex;gap:6px;align-items:center;font-size:12.5px}
#tiempo{flex:1 1 280px;display:flex;gap:10px;align-items:center}
#pista{flex:1;position:relative}
#pista input[type=range]{width:100%;accent-color:var(--oro);margin:0;display:block;height:16px}
#marcas{position:relative;height:16px;margin-top:1px}
#marcas i{position:absolute;bottom:0;width:2px;opacity:.95}
#marcas span{position:absolute;top:0;font-size:10px;color:var(--suave);transform:translateX(-50%);letter-spacing:.04em}
#fecha{min-width:92px;color:#f1d58a;font-weight:700;letter-spacing:.03em}
#calBarra{display:flex;gap:12px;align-items:center;padding:6px 10px}
#calTit{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);white-space:nowrap}
#calPista{position:relative;flex:1;height:30px;min-width:200px}
#calPista .hoy{position:absolute;top:2px;bottom:2px;width:1px;background:rgba(241,213,138,.7)}
#calPista .mes{position:absolute;bottom:-2px;font-size:9.5px;color:var(--suave);transform:translateX(-50%)}
#calPista .ev{position:absolute;top:4px;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);border:1px solid rgba(255,255,255,.75);cursor:pointer}
#calPista .ev.alto{width:14px;height:14px;top:2px;box-shadow:0 0 10px currentColor}
#calTemas{display:flex;flex-wrap:wrap;gap:4px 10px}
.tema{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--suave);cursor:pointer;user-select:none;padding:1px 6px;border-radius:4px;border:1px solid transparent}
.tema i{width:9px;height:9px;transform:rotate(45deg);display:inline-block;flex:none}
.tema.off{opacity:.35}.tema:hover{border-color:var(--linea)}
#lienzo{flex:1;min-height:0;position:relative;overflow:hidden;background:none;border:none}
#vistaIzq{display:none;position:absolute;inset:0 var(--pwa,0px) 0 0;z-index:2;pointer-events:none;grid-template-columns:minmax(0,1fr) var(--hw,420px) minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--hh,400px) minmax(0,1fr);gap:8px;padding:6px}
#app.sel #vistaIzq{display:grid}
.zona{display:flex;flex-wrap:wrap;gap:12px 14px;justify-content:center;overflow:hidden;min-height:0;padding:12px 8px;pointer-events:none}
#vistaIzq.quieto .zona{overflow-y:auto}
.zona.top{grid-column:1/4;grid-row:1;align-content:safe flex-end;align-items:flex-start}   /* cada post-it mide lo que ocupa su texto, no la altura del más alto de la fila */
.zona.bajo{grid-column:1/4;grid-row:3;align-content:flex-start}
.zona.izq,.zona.der{flex-direction:column;flex-wrap:nowrap;justify-content:center;align-content:stretch}
.zona.bajo{flex-wrap:nowrap;align-items:flex-start}
.zona.bajo .pi{flex:1 1 0;min-width:0;max-width:340px}
.zona.izq .pi,.zona.der .pi{font-size:var(--pfl,15.5px);line-height:1.38;padding:14px 16px 11px}
.zona.izq{grid-column:1;grid-row:2}
.zona.der{grid-column:3;grid-row:2}
.pi{position:relative;pointer-events:auto;flex:1 1 220px;max-width:400px;min-width:180px;padding:16px 18px 13px;font-size:var(--pf,16.5px);line-height:1.42;color:#e4e9f6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;border-radius:3px 3px 9px 3px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,#0d1430),color-mix(in srgb,var(--c) 11%,#090e24));box-shadow:0 10px 22px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07) inset;opacity:0;transform:translate(var(--fx,0px),var(--fy,0px)) scale(.12) rotate(0deg);transition:transform .75s cubic-bezier(.2,.9,.25,1) var(--d,0ms),opacity .4s ease var(--d,0ms)}
.pi::before{content:'';position:absolute;top:-7px;left:50%;width:48px;height:13px;margin-left:-24px;background:rgba(255,255,255,.17);transform:rotate(-2.5deg);border-radius:2px}
.zona.izq .pi,.zona.der .pi{flex:0 0 auto;max-width:none;min-width:0}
.pi.ancha{flex:1.7 1 340px;max-width:560px}
#vistaIzq.abierto .pi{opacity:1;transform:none}
#vistaIzq.abierto .pi:hover{transform:scale(1.03);z-index:3}
#vistaIzq.plegando .pi{transition:transform .6s cubic-bezier(.55,0,.9,.35) var(--dc,0ms),opacity .3s ease calc(var(--dc,0ms) + .3s)}
.pi .pt{font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 65%,#fff);font-weight:700;margin-bottom:4px}
.pi h2{font-size:1.4em;margin:0 0 4px}
.pi .ficha-ul{font-size:inherit}.pi ul{margin:0;padding-left:18px}.pi li{margin:4px 0}
.pi .big{display:block;font-size:2em;font-weight:700;line-height:1.1;margin-bottom:2px}
.pi .sub{color:#a9b6cf;font-size:.88em;margin-top:3px}
.pi .pts{letter-spacing:.18em;font-size:1.1em}
.zona.bajo .pi .clamp{-webkit-line-clamp:4}
.zona.bajo .pi .sub.clamp{-webkit-line-clamp:1}
.pi .clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.pi .chips{margin:4px 0 0}
.onda{position:absolute;border-radius:50%;border:2px solid #f1d58a;opacity:0;pointer-events:none;z-index:1;animation:onda 1.1s cubic-bezier(.2,.7,.3,1) both}
@keyframes onda{0%{transform:scale(.9);opacity:.95}100%{transform:scale(3.6);opacity:0}}
svg{width:100%;height:100%;display:block}
#cab{display:flex;flex-wrap:wrap;align-items:center;gap:2px 18px;padding:0 6px;pointer-events:none}
#marca{display:flex;align-items:baseline;gap:12px}
#marca b{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c8d3ea;font-weight:600}
#marca div{color:var(--suave);font-size:12px}
#leyendaMapa{display:flex;flex-wrap:wrap;gap:2px 14px;pointer-events:none}
#leyendaMapa span{font-size:11px;color:var(--suave);display:flex;gap:6px;align-items:center;letter-spacing:.02em}
#tip{position:absolute;pointer-events:none;background:rgba(6,10,24,.96);border:1px solid var(--linea);border-left:3px solid var(--oro);border-radius:6px;padding:8px 11px;font-size:12px;max-width:270px;opacity:0;transition:opacity .15s;z-index:3;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.planeta{cursor:pointer;outline:none}
.planeta .nombre{pointer-events:none;fill:#d6deef;font-size:10px;text-anchor:middle;paint-order:stroke;stroke:#050816;stroke-width:3.5px;stroke-linejoin:round;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.planeta .cuenta{pointer-events:none;font-size:8.5px;font-weight:800;fill:#fff;text-anchor:middle}
.planeta .rotulo{pointer-events:none;fill:#e6ebf5;font-size:8.5px;paint-order:stroke;stroke:#050816;stroke-width:3px;stroke-linejoin:round;letter-spacing:.02em}
.planeta:focus-visible .disco{stroke:#fff;stroke-width:2}
.orbita{fill:none;stroke-width:1}
.estrella{animation:tw 5s ease-in-out infinite}
.barrido{transform-origin:0 0;animation:girar 70s linear infinite}
.luna{transition:opacity .5s}
.anillo-sel{fill:none;stroke-width:1.4;stroke-dasharray:3 4;transform-box:fill-box;transform-origin:center;animation:girar 14s linear infinite}
.pulso{fill:none;stroke-width:1.6;animation:p 1.3s ease-out forwards}
.cerca{transform-box:fill-box;transform-origin:center;animation:latido 1.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes p{from{r:14;opacity:.9}to{r:56;opacity:0}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes entra{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.estrella,.barrido,.anillo-sel,.cerca{animation:none}#app{transition:none}}
#panel{position:absolute;z-index:4;top:0;right:0;bottom:0;width:var(--pw);padding:14px 16px;overflow:auto;min-height:0;background:rgba(7,11,26,.95);box-shadow:none;visibility:hidden;transform:translateX(calc(100% + 60px));transition:transform .6s cubic-bezier(.22,.8,.25,1),box-shadow .3s ease,visibility 0s .6s;}
#panel:not(.abierto){overflow:hidden}
#panel.abierto{transform:none;visibility:visible;box-shadow:-18px 0 40px rgba(0,0,0,.45);transition:transform .6s cubic-bezier(.22,.8,.25,1),box-shadow .5s ease,visibility 0s 0s}
#panel .entra{animation:entra .35s ease backwards}   /* 'backwards': al terminar no queda ninguna capa de animación y el texto se dibuja nítido */
@media (min-width:901px){#panel{zoom:1.2;width:calc(var(--pw) / 1.2)}}   /* letra del panel un 20 % mayor, sin pérdida de nitidez */
h2{margin:0 0 6px;font-size:17px;font-weight:650;letter-spacing:.01em;display:flex;gap:10px;align-items:center}
h3{margin:18px 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--suave);font-weight:600;border-bottom:1px solid var(--linea);padding-bottom:5px}
.nota{color:var(--suave);font-size:12px}
.cabecera{border-radius:8px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--linea);border-left-width:4px;background:rgba(15,23,42,.6)}
.barra-apilada{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}.leyenda span{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--suave)}
.punto{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.item{border-top:1px solid var(--linea);padding:10px 0}.item b{color:#fff;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{font-size:11px;border:1px solid var(--linea);border-radius:4px;padding:1px 8px;color:var(--suave);display:flex;gap:6px;align-items:center;background:rgba(15,23,42,.7)}
.fuente{font-size:11px;color:var(--suave)}
.chip.clic{cursor:pointer}.chip.clic:hover{border-color:var(--oro);color:#fff}
details.doc .chips{margin:2px 0 6px}
.hecho-t{flex:1}
.radar-grid{display:grid;gap:4px;margin:8px 0}
.radar-th{writing-mode:vertical-rl;transform:rotate(180deg);height:116px;white-space:nowrap;font-size:11px;color:var(--suave);justify-self:center;align-self:end;text-align:left}
.radar-jur{appearance:none;background:none;border:1px solid transparent;border-radius:5px;color:var(--texto);font:inherit;font-size:12px;text-align:left;padding:3px 6px;cursor:pointer}
.radar-jur:hover,.radar-jur.on{border-color:var(--oro)}
.radar-cel{appearance:none;height:30px;border-radius:5px;border:1px solid;font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:3px;padding:0}
.radar-cel small{font-size:8.5px;font-weight:600;opacity:.85}
.radar-cel{position:relative}
.radar-cel.rv::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#f0a830;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.radar-comp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.radar-comp>div{min-width:0}
.radar-comp h4{margin:0 0 6px;font-size:14px;color:var(--oro)}
.radar-cel.nd{border-style:dashed;background:transparent !important;color:var(--suave);font-weight:400}
.radar-cel:hover{filter:brightness(1.25)}.radar-cel.on{outline:2px solid var(--oro);outline-offset:1px}
.contraste{border:1px solid rgba(212,168,75,.45);background:rgba(212,168,75,.06);border-radius:8px;padding:2px 10px 8px;margin:10px 0}
.contraste h3{border-bottom-color:rgba(212,168,75,.35);color:#f1d58a}
.contraste details.doc{background:rgba(15,23,42,.7)}
details.sec{border:1px solid var(--linea);border-radius:8px;margin:8px 0;background:rgba(15,23,42,.35)}
details.sec>summary{cursor:pointer;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--suave);font-weight:600;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸ ';color:var(--oro)}
details.sec[open]>summary::before{content:'▾ '}
details.sec[open]>summary{border-bottom:1px solid var(--linea)}
details.sec>.sec-c{padding:4px 10px 8px}
.pn{border:1px solid rgba(95,208,160,.35);background:rgba(95,208,160,.05);border-radius:8px;padding:2px 10px 8px;margin:10px 0}
.pn h3{border-bottom-color:rgba(95,208,160,.3);color:#9fe0c3}
.pn-k{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pn-k button,.pn-k div{flex:1 1 120px;text-align:left;border:1px solid var(--linea);border-radius:6px;background:rgba(15,23,42,.7);color:var(--texto);padding:5px 9px;font:inherit}
.pn-k button{cursor:pointer}.pn-k button:hover{border-color:var(--oro)}
.pn-k .v{font-size:16px;font-weight:700;color:#f1d58a}.pn-k .e{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
table.pn-t{width:100%;border-collapse:collapse;font-size:12px}
.pn-t th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);text-align:right;padding:3px 5px;border-bottom:1px solid var(--linea);font-weight:600}
.pn-t th:first-child,.pn-t td:first-child{text-align:left}
.pn-t td{padding:3px 5px;border-bottom:1px solid rgba(148,163,184,.08);text-align:right;white-space:nowrap}
.pn-t tr.xrp td{color:#f1d58a;font-weight:600}
.pn-s{color:#5fd0a0}.pn-b{color:#f08a7a}.pn-n{color:var(--suave)}
.hitos{margin:6px 0 0;padding:0;list-style:none;border-left:2px solid var(--linea)}.hitos li{position:relative;padding:2px 0 6px 12px;font-size:12.5px;color:#cdd6ea}
.hitos li::before{content:'';position:absolute;left:-5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--oro)}
.hitos .cuando{color:#f1d58a;margin-right:6px}
.ficha-ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:#cdd6ea}.ficha-ul li{margin:2px 0}
.ficha-fila{display:flex;gap:10px;align-items:baseline;margin:3px 0;font-size:12.5px}
.ficha-fila .etq-f{flex:none;min-width:92px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--suave)}
.ficha-pts{letter-spacing:.18em;font-size:15px}
.ficha-dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:900px){.ficha-dos{grid-template-columns:1fr}}
@media (max-width:700px){.radar-comp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;-webkit-overflow-scrolling:touch}.radar-comp>div{flex:0 0 88%;scroll-snap-align:start}}
.bloque{background:rgba(15,23,42,.6);border:1px solid var(--linea);border-radius:6px;padding:8px 11px;margin:7px 0;border-left-width:3px}
.volver{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:5px 11px;cursor:pointer;margin-bottom:10px;font:inherit;font-size:12.5px}
.volver:hover{border-color:var(--oro)}
.capa-fila{display:flex;align-items:center;gap:10px;width:100%;background:rgba(15,23,42,.55);border:1px solid var(--linea);border-radius:6px;padding:7px 11px;margin:5px 0;color:var(--texto);cursor:pointer;font:inherit;font-size:13px;text-align:left;transition:.15s}
.capa-fila:hover{border-color:var(--oro);background:rgba(30,41,70,.55)}
.capa-fila .n{margin-left:auto;font-weight:700;color:#f1d58a}
.capa-fila .sub{color:var(--suave);font-size:11px}
.ico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
details.doc{background:rgba(15,23,42,.55);border:1px solid var(--linea);border-radius:6px;margin:6px 0;padding:0}
details.doc summary{cursor:pointer;padding:8px 11px;list-style:none;display:flex;gap:8px;align-items:baseline}
details.doc summary::-webkit-details-marker{display:none}
details.doc[open]{border-color:rgba(212,168,75,.55)}
details.doc .cuerpo{padding:0 11px 10px;color:#cdd6ea;font-size:12.5px}
.etq{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:1px 6px;border-radius:3px;border:1px solid;flex:none}
.cifras{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px;margin:6px 0}
.cifra{background:rgba(15,23,42,.62);border:1px solid var(--linea);border-top-width:3px;border-radius:7px;padding:9px 11px}
.cifra b{display:block;font-size:19px;line-height:1.15;letter-spacing:-.01em}
.cifra span{display:block;font-size:12px;color:#c5cee2;margin-top:3px}
.cifra small{display:block;font-size:10.5px;color:var(--suave);margin-top:5px}
.fila-ev summary{align-items:center}
.fila-ev .rombo{width:10px;height:10px;transform:rotate(45deg);flex:none;border:1px solid rgba(255,255,255,.6)}
.fila-ev .cuando{font-size:11.5px;color:#f1d58a;white-space:nowrap;min-width:78px}
.estrella-ev{color:#ffd166}
/* Móvil y ventanas estrechas: solo reordena y compacta; en pantallas anchas no cambia nada */
@media (max-width:900px){
  #lienzo{flex:none;height:auto;aspect-ratio:1/1.05;min-height:0}
  #barra{gap:6px;padding:6px 8px}
  #barra button,#barra input[type=text]{padding:5px 9px;font-size:12.5px}
  #tiempo{flex:1 1 100%}
  #barra input[type=text]{flex:1 1 100%}
  #calBarra{flex-wrap:wrap;gap:4px 10px;padding:6px 8px}
  #calTit{width:100%}
  #calPista{flex:1 1 100%;min-width:0}
  #calTemas{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:3px;-webkit-overflow-scrolling:touch}
  .tema{white-space:nowrap;flex:none}
  #vistaIzq,#app.sel #vistaIzq{display:none}
  #panel,#izq{min-width:0}
  .pn{overflow-x:auto}
  .cifras{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style></head><body>
<div id="app">
  <div id="izq">
    <div id="cab"><div id="marca"><b>Sistema de raíles</b><div id="subtitulo"></div></div><div id="leyendaMapa"></div></div>
    <div id="barra" class="vidrio">
      <button id="btnOrbitas" title="Pausar o reanudar el giro">⏸ Órbitas</button>
      <div id="tiempo"><button id="btnPlay" title="Reproducir los hechos por fecha">▶ Tiempo</button>
        <div id="pista"><input type="range" id="slider" min="0" max="100" value="100" aria-label="Fecha"><div id="marcas"></div></div>
        <span id="fecha"></span></div>
      <input type="text" id="buscar" placeholder="Buscar (Pontes, OCC, DTCC…)" aria-label="Buscar">
      <label><input type="checkbox" id="soloToken"> Solo los que nombran XRP o XLM</label>
      <button id="btnPanel" title="Abrir o cerrar el panel de información">☰ Panel</button>
      <button id="btnVolver" title="Volver a la vista general">⌂ Vista general</button>
    </div>
    <div id="calBarra" class="vidrio"><span id="calTit">Calendario<br>próximos 120 días</span><div id="calPista"></div><div id="calTemas"></div></div>
    <div id="lienzo">
      <svg id="svg" viewBox="-520 -360 1040 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa de raíles financieros"></svg>
      <aside id="panel" class="vidrio"></aside>
      <div id="vistaIzq"></div>
      <div id="tip"></div>

const pwEfectivo = () => (sel && (panelVisible || cerrando)) ? panelAncho : 0;
function ajustarLados(){
  const lw = $('lienzo').clientWidth || 1000, lh = $('lienzo').clientHeight || 700, izq = $('vistaIzq');
  panelAncho = Math.max(440, Math.min(Math.round(lw * .31), 640)); app.style.setProperty('--pw', panelAncho + 'px');
  const pw = pwEfectivo(), ow = lw - pw;
  const hw = Math.max(300, Math.min(Math.round(ow * .35), 440)), hh = Math.max(300, Math.min(Math.round(lh * .40), 400));
  izq.style.setProperty('--pwa', pw + 'px'); izq.style.setProperty('--hw', hw + 'px'); izq.style.setProperty('--hh', hh + 'px');
  ajustarLetra(izq, Math.min(20, ow / 70));
  const esc = Math.min(hw / 280, hh / 320);

// Letra de los post-its: empieza lo más grande que permite la pantalla y baja de medio en medio punto hasta que ningún post-it se corte (mínimo 13,5 px; si aun así una columna no cabe, se desplaza).
// Se mide por posición de layout (offsetTop), a la que no afectan las transformaciones de la animación.
function ajustarLetra(izq, maxPx){
  const zonas = [...izq.querySelectorAll('.zona')];
  const cabe = () => zonas.every(z => [...z.querySelectorAll('.pi')].every(n => n.offsetTop >= z.offsetTop - 1 && n.offsetTop + n.offsetHeight <= z.offsetTop + z.clientHeight + 2));
  let pf = Math.max(13.5, maxPx);
  for (; pf > 13.5; pf -= .5){
    izq.style.setProperty('--pf', pf.toFixed(1) + 'px'); izq.style.setProperty('--pfl', (pf * .94).toFixed(1) + 'px');
    if (cabe()) return;
  }
  izq.style.setProperty("--pf", "13.5px"); izq.style.setProperty("--pfl", "13px");
}
function actualizarPanel(){ panel.classList.toggle('abierto', panelVisible); }
function posicionarNotas(){
  const iz = $('vistaIzq'), W = iz.clientWidth, Hh = iz.clientHeight;
  iz.querySelectorAll('.pi').forEach(e => { e.style.setProperty('--fx', (W / 2 - (e.offsetLeft + e.offsetWidth / 2)) + 'px'); e.style.setProperty('--fy', (Hh / 2 - (e.offsetTop + e.offsetHeight / 2)) + 'px'); });
}

function seleccionar(c){

    setTimeout(() => { aplicarSeleccion(null); iz.classList.remove('plegando'); }, 1960);   // y solo entonces la vista se aleja y se centra
    return;
  }

function ondasEsfera(c){     // pulsos de luz que salen de la propia esfera del tema, donde esté en pantalla
  const lz = $('lienzo'), lr = lz.getBoundingClientRect(), r = c.disco.getBoundingClientRect();
  const d = Math.max(30, Math.round(r.width * 1.15)), cx = r.left + r.width / 2 - lr.left, cy = r.top + r.height / 2 - lr.top;
  [0, 120, 240].forEach(ms => { const o = H('div', 'onda', lz); o.style.cssText = `left:${cx - d / 2}px;top:${cy - d / 2}px;width:${d}px;height:${d}px;border-color:${mezcla(c.color, '#fff', .35)};animation-duration:.7s;animation-delay:${ms}ms`;
    setTimeout(() => o.remove(), 1000); });
}
