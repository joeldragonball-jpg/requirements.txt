<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;--linea:rgba(148,163,184,.16);--texto:#e6ebf5;--suave:#a8b5cd;--oro:#d4a84b}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:transparent;color:var(--texto);font:clamp(12.5px,.8vw + 8px,14px)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#pest{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px 0}
#pest button{font:inherit;font-size:clamp(11.5px,.5vw + 8px,13px);color:var(--suave);background:rgba(15,23,42,.8);border:1px solid var(--linea);border-bottom:none;border-radius:8px 8px 0 0;padding:clamp(4px,.5vw,6px) clamp(8px,1vw,13px);cursor:pointer;transition:.15s}
#pest button:hover{color:#fff;border-color:var(--oro)}
#pest button.on{background:var(--oro);color:#1a1405;font-weight:600;border-color:var(--oro)}
.marco{margin:0 6px;border:1px solid var(--linea);border-radius:0 8px 8px 8px;overflow:hidden;background:#0e1420}
.marco[hidden]{display:none}
.marco iframe{display:block;width:100%;height:100%;border:0;background:#0e1420}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav id="pest" aria-label="Vistas de la Órbita"></nav>
<div class="marco" id="vistasWrap"><iframe id="vistasMarco" title="Vistas de datos de la Órbita"></iframe></div>
<div class="marco" id="mundoWrap" hidden><iframe id="mundoMarco" title="Eventos y noticias por tema, país y verificación"></iframe></div>
<script id="vistasHtml" type="application/json">__VISTAS__</script>
<script id="mundoHtml" type="application/json">__MUNDO__</script>
<script id="datos" type="application/json">__DATOS__</script>
<script>
// La Órbita es esta carcasa de pestañas; cada pestaña vive en un marco con su propio CSS y JS (sin mezclarse).
// Las vistas (vistas.html) y el mapa mundi (mundo.html) leen los mismos datos, solo lectura, desde window.DATOS.
const $ = id => document.getElementById(id);
window.DATOS = JSON.parse($('datos').textContent);
const pest = $('pest');
const VISTAS = [['resumen', 'Resumen'], ['capas', 'Capas'], ['tiempo', 'Línea de tiempo'], ['calendario', 'Calendario'],
  ['matriz', 'Matriz país × tema'], ['mundo', 'Eventos y noticias'], ['noticias', 'Noticias'], ['voces', 'Voces'], ['paneles', 'Paneles de datos']];
const MARCOS = {vistas: [$('vistasWrap'), $('vistasMarco'), 'vistasHtml'], mundo: [$('mundoWrap'), $('mundoMarco'), 'mundoHtml']};
let actual = 'resumen';
VISTAS.forEach(([id, nombre]) => { const b = document.createElement('button'); b.textContent = nombre; b.dataset.v = id; b.addEventListener('click', () => irVista(id)); pest.appendChild(b); });
function tamano(){
  // Una sola barra de desplazamiento: el marco ocupa justo lo que queda entre su posición y la barra inferior fija de la página
  let ih = 800, arriba = 0, abajo = 6; try { ih = window.parent.innerHeight || 800; } catch (e) {}
  try {
    const fe0 = window.frameElement; if (fe0) arriba = Math.max(0, fe0.getBoundingClientRect().top);
    const bar = window.parent.document.querySelector('.st-key-seccion'); if (bar) abajo = bar.getBoundingClientRect().height + 22;
  } catch (e) { abajo = 84; }
  const h = Math.max(420, Math.min(ih - arriba - abajo, 1300)), hb = pest.offsetHeight;
  Object.values(MARCOS).forEach(m => { m[0].style.height = (h - hb - 4) + 'px'; });
  try { const fe = window.frameElement; if (fe){ fe.style.height = h + 'px'; const p = fe.parentElement; if (p){ p.style.height = h + 'px'; p.style.minHeight = h + 'px'; } } } catch (e) {}
}
function irVista(id){
  actual = id;
  pest.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === id));
  const clave = id === 'mundo' ? 'mundo' : 'vistas';
  for (const k in MARCOS) MARCOS[k][0].hidden = k !== clave;
  tamano();
  const [, marco, fuente] = MARCOS[clave];
  const pasar = () => { if (clave === 'vistas') { try { marco.contentWindow.ir(id); } catch (e) {} } };
  if (!marco.getAttribute('srcdoc')){
    marco.addEventListener('load', pasar, {once: true});
    marco.srcdoc = JSON.parse($(fuente).textContent);
  } else pasar();
}
try { window.parent.addEventListener('resize', tamano); } catch (e) {}
irVista('resumen');
</script></body></html>
