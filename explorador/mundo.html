<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--linea:rgba(148,163,184,.16);--texto:#e6ebf5;--suave:#93a1bd;--oro:#d4a84b;--ok:#2fe08f;--amb:#e8b64a;--mal:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--texto);font:clamp(13px,.5vw + 8px,15px)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
/* Barra de filtros fija arriba: se cambia de país o tema sin volver a subir */
#barra{position:sticky;top:0;z-index:5;background:rgba(8,12,26,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea);padding:8px clamp(8px,1vw,16px) 6px;display:flex;flex-direction:column;gap:6px}
#cont{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
#cont h1{margin:0 8px 0 0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#c8d3ea;font-weight:600}
.cuenta{border:1px solid var(--linea);border-radius:8px;padding:3px 10px;font-size:13px;background:rgba(15,23,42,.9);cursor:pointer;color:var(--texto);font-family:inherit}
.cuenta b{font-size:15px}.cuenta.mal b{color:var(--mal)}.cuenta.amb b{color:var(--amb)}.cuenta.ok b{color:var(--ok)}
.cuenta:hover,.cuenta.on{border-color:var(--oro)}
.fila{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.et{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);min-width:62px}
.chip{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--oro);color:#fff}
.chip.on{border-color:var(--oro);background:rgba(212,168,75,.16);color:#f1d58a}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
select,input[type=search]{background:rgba(15,23,42,.95);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:3px 8px;font:inherit;font-size:12.5px}
input[type=search]{min-width:200px}
#lista{padding:10px clamp(8px,1vw,16px) 30px;display:flex;flex-direction:column;gap:6px;max-width:1500px}
.sec{margin:12px 2px 2px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.ev{--c:#888;border:1px solid rgba(148,163,184,.14);border-left:5px solid var(--c);border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 60%),rgba(9,14,30,.62);padding:7px 12px}
.ev:hover{box-shadow:0 0 12px color-mix(in srgb,var(--c) 28%,transparent)}
.ev .cab{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:baseline;cursor:pointer}
.ev .f{font-weight:700;color:#f1d58a;white-space:nowrap;min-width:92px}
.ev .t{flex:1 1 320px;font-weight:600}
.ev .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--suave);margin-top:3px}
.ev .tm{font-weight:700;color:var(--c)}
.tipo{padding:0 7px;border-radius:4px;font-size:11.5px;border:1px solid var(--linea);color:var(--suave)}
.ver{padding:0 7px;border-radius:4px;font-weight:700;font-size:11.5px;border:1px solid}
.ver.confirmado{color:var(--ok);border-color:var(--ok);background:rgba(47,224,143,.13)}
.ver.sin_contrastar{color:var(--amb);border-color:var(--amb);background:rgba(232,182,74,.13)}
.ver.dudoso,.ver.desmentido{color:var(--mal);border-color:var(--mal);background:rgba(255,107,107,.13)}
.venc{color:#1a0a0a;background:var(--mal);border-radius:4px;padding:0 7px;font-weight:700;font-size:11.5px}
.prox{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#1a1405;background:#f1d58a;border-radius:4px;padding:0 6px;font-weight:700}
.imp{font-size:11px;border:1px solid var(--linea);border-radius:10px;padding:0 7px}.imp.alta{color:#ffb15c;border-color:#ffb15c}
.det{display:none;margin-top:7px;padding-top:7px;border-top:1px dashed var(--linea);font-size:13.5px;color:#cdd6ea}
.ev.abre .det{display:block}.ev.abre{border-color:rgba(212,168,75,.5)}
.det p{margin:0 0 5px}.det .k{color:var(--suave)}
.vacio,.aviso{color:var(--suave);font-size:13px;margin:8px 2px}
#mas{align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="barra">
 <div id="cont"><h1>Eventos y noticias</h1><span id="cuentas" class="fila"></span></div>
 <div class="fila"><span class="et">Tema</span><span id="fTema" class="fila"></span></div>
 <div class="fila"><span class="et">Filtros</span>
  <select id="sPais" aria-label="País"></select>
  <span id="fPeriodo" class="fila"></span><span id="fVerif" class="fila"></span><span id="fImp" class="fila"></span>
  <select id="sOrigen" aria-label="Origen"></select>
  <select id="sTipo" aria-label="Tipo de fuente"><option value="">Toda fuente</option><option value="P">Fuente primaria</option><option value="S">Prensa / secundaria</option></select>
  <input id="q" type="search" placeholder="Buscar en eventos…" aria-label="Buscar">
 </div>
</div>
<div id="lista"></div>
<script id="datos" type="application/json">__DATOS__</script>
<script>
const D = JSON.parse(document.getElementById('datos').textContent) || (window.parent && window.parent.DATOS && window.parent.DATOS.mundo);   // dentro de la Órbita los datos llegan por window.parent.DATOS.mundo
const $ = id => document.getElementById(id);
function el(tag, props, padre, texto){ const e = document.createElement(tag); for (const k in (props||{})) e.setAttribute(k, props[k]); if (texto !== undefined) e.textContent = texto; if (padre) padre.appendChild(e); return e; }
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmt = s => { const p = (s||'').split('-'); return p.length === 3 ? (+p[2]) + ' ' + MESES[+p[1]-1] + ' ' + p[0] : (s||''); };
const TIPO = {P:'fuente primaria', S:'prensa / fuente secundaria', VERIFICAR:'fuente sin confirmar'};
const VER = {confirmado:'✔ Confirmado', sin_contrastar:'◐ Sin contrastar', dudoso:'✖ Dudoso', desmentido:'✖ Desmentido'};
const VENCE = 7;      // días: un hecho ya ocurrido que sigue sin verificar pasado este plazo se marca en rojo
const f = {tema:new Set(Object.keys(D.temas)), pais:'', periodo:'prox', verif:'todas', imp:'mediaalta', origen:'', tipo:'', q:'', limite:40, abierto:null};
const pend = e => e.ver === 'sin_contrastar' && e.imp !== 'baja';
const venc = e => e.edad !== null && e.edad > VENCE;

function visibles(ignora){
  const lim = new Date(D.hoy + 'T00:00:00'); lim.setDate(lim.getDate() - 60); const l = lim.toISOString().slice(0,10);
  const q = f.q.trim().toLowerCase();
  return D.eventos.filter(e => (ignora === 'verif' || f.verif === 'todas' || (f.verif === 'ver' && e.ver === 'confirmado') || (f.verif === 'pend' && e.ver === 'sin_contrastar') || (f.verif === 'venc' && venc(e)) || (f.verif === 'dud' && (e.ver === 'dudoso' || e.ver === 'desmentido')))
    && f.tema.has(e.tema) && (!f.pais || e.paises.includes(f.pais)) && (!f.origen || e.origen === f.origen) && (!f.tipo || e.nivel === f.tipo)
    && (f.imp === 'todas' || (f.imp === 'alta' ? e.imp === 'alta' : e.imp !== 'baja'))
    && (f.periodo === 'todo' || (f.periodo === 'prox' && e.futuro) || (f.periodo === 'rec' && !e.futuro && e.fecha >= l))
    && (!q || (e.tit + ' ' + e.que + ' ' + e.quien + ' ' + e.contexto).toLowerCase().includes(q)));
}

function chips(cont, items, activo, onClick){
  cont.textContent = '';
  items.forEach(it => { const b = el('button', {class:'chip' + (activo(it) ? ' on' : ''), type:'button'}, cont);
    if (it.color){ const i = el('i', {}, b); i.style.background = it.color; } b.appendChild(document.createTextNode(it.nombre)); b.onclick = () => onClick(it); });
}

function pintarBarra(){
  const base = D.eventos.filter(e => (!f.pais || e.paises.includes(f.pais)) && f.tema.has(e.tema));
  const nPend = base.filter(e => pend(e) && !e.futuro).length, nVenc = base.filter(venc).length, nProx = base.filter(e => e.futuro).length;
  const c = $('cuentas'); c.textContent = '';
  const cu = (cls, n, txt, on, fn) => { const b = el('button', {class:'cuenta ' + cls + (on ? ' on' : ''), type:'button'}, c); el('b', {}, b, n); b.appendChild(document.createTextNode(' ' + txt)); b.onclick = fn; };
  cu('mal', nVenc, 'sin contrastar hace más de ' + VENCE + ' días (importancia alta o media)', f.verif === 'venc', () => { f.verif = f.verif === 'venc' ? 'todas' : 'venc'; f.periodo = 'todo'; f.imp = 'todas'; todo(); });
  cu('amb', nPend, 'ocurridos y sin contrastar (alta o media)', f.verif === 'pend', () => { f.verif = f.verif === 'pend' ? 'todas' : 'pend'; f.periodo = 'todo'; f.imp = 'todas'; todo(); });
  cu('ok', nProx, 'próximos', f.periodo === 'prox' && f.verif === 'todas', () => { f.periodo = 'prox'; f.verif = 'todas'; todo(); });
  const temas = Object.keys(D.temas).map(k => ({id:k, nombre:D.temas[k].nombre, color:D.temas[k].color}));
  chips($('fTema'), temas, i => f.tema.has(i.id), i => { if (f.tema.size === temas.length) f.tema = new Set([i.id]); else if (f.tema.has(i.id)) { f.tema.delete(i.id); if (!f.tema.size) f.tema = new Set(temas.map(x => x.id)); } else f.tema.add(i.id); f.limite = 40; todo(); });
  chips($('fPeriodo'), [{id:'prox',nombre:'Próximos'},{id:'rec',nombre:'Últimos 60 días'},{id:'todo',nombre:'Todo'}], i => f.periodo === i.id, i => { f.periodo = i.id; f.limite = 40; todo(); });
  chips($('fVerif'), [{id:'todas',nombre:'Toda verificación'},{id:'ver',nombre:'✔ Confirmados'},{id:'pend',nombre:'◐ Sin contrastar'},{id:'venc',nombre:'Vencidos'},{id:'dud',nombre:'✖ Dudosos'}], i => f.verif === i.id, i => { f.verif = i.id; f.limite = 40; todo(); });
  chips($('fImp'), [{id:'alta',nombre:'Solo alta'},{id:'mediaalta',nombre:'Alta y media'},{id:'todas',nombre:'Todas (con baja)'}], i => f.imp === i.id, i => { f.imp = i.id; f.limite = 40; todo(); });
}

function pintarSelects(){
  const sp = $('sPais'); sp.textContent = ''; el('option', {value:''}, sp, 'Todos los países');
  Object.keys(D.paises).forEach(k => { const o = el('option', {value:k}, sp, D.paises[k]); if (f.pais === k) o.selected = true; });
  sp.onchange = () => { f.pais = sp.value; f.limite = 40; todo(); };
  const so = $('sOrigen'); so.textContent = ''; el('option', {value:''}, so, 'Todo origen');
  [...new Set(D.eventos.map(e => e.origen))].forEach(k => { const o = el('option', {value:k}, so, k); if (f.origen === k) o.selected = true; });
  so.onchange = () => { f.origen = so.value; f.limite = 40; todo(); };
  const st = $('sTipo'); st.value = f.tipo; st.onchange = () => { f.tipo = st.value; f.limite = 40; todo(); };
  $('q').oninput = () => { f.q = $('q').value; f.limite = 40; pintarLista(); };
}

function tarjeta(e, L){
  const a = el('div', {class:'ev' + (f.abierto === e.id ? ' abre' : '')}, L); a.style.setProperty('--c', (D.temas[e.tema] || {}).color || '#8a97b0');
  const cab = el('div', {class:'cab', role:'button', tabindex:'0'}, a);
  el('span', {class:'f'}, cab, fmt(e.fecha) + (e.hasta && e.hasta !== e.fecha ? ' – ' + fmt(e.hasta) : ''));
  el('span', {class:'t'}, cab, e.tit);
  const meta = el('div', {class:'meta'}, a);
  el('span', {class:'ver ' + e.ver, title:'Verificación: ' + VER[e.ver]}, meta, VER[e.ver] + (e.ver === 'confirmado' && e.ver_con ? ' con ' + e.ver_con : ''));
  el('span', {class:'tipo', title:'Tipo de fuente (no dice si el hecho es cierto)'}, meta, TIPO[e.nivel]);
  if (venc(e)) el('span', {class:'venc'}, meta, 'sin contrastar hace ' + e.edad + ' días');
  if (e.imp === 'alta') el('span', {class:'imp alta'}, meta, 'importancia alta');
  el('span', {class:'tm'}, meta, (D.temas[e.tema] || {}).nombre || e.tema);
  el('span', {}, meta, e.paises.map(p => D.paises[p]).join(', '));
  if (e.quien) el('span', {}, meta, 'Quién: ' + e.quien);
  el('span', {}, meta, 'Origen: ' + e.origen);
  const det = el('div', {class:'det'}, a);
  const fila = (k, t) => { if (!t) return; const p = el('p', {}, det); el('span', {class:'k'}, p, k + ': '); p.appendChild(document.createTextNode(t)); };
  fila('Qué pasó', e.que); fila('Contexto', e.contexto); fila('Impacto', e.impacto); fila('Fuente', e.fuente + ' · ' + TIPO[e.nivel]); fila('Verificación', VER[e.ver] + (e.ver_con ? ' · con ' + e.ver_con : '') + (e.ver_fecha ? ' · ' + fmt(e.ver_fecha) : ''));
  const alt = () => { f.abierto = f.abierto === e.id ? null : e.id; document.querySelectorAll('.ev.abre').forEach(n => { if (n !== a) n.classList.remove('abre'); }); a.classList.toggle('abre', f.abierto === e.id); };
  cab.addEventListener('click', alt);
  cab.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); alt(); } });
}

function pintarLista(){
  const L = $('lista'); L.textContent = '';
  const v = visibles();
  el('p', {class:'aviso'}, L, v.length + ' eventos con estos filtros' + (f.imp !== 'todas' ? ' (la importancia baja está plegada: «Todas (con baja)» la muestra)' : '') + '. Tipo de fuente y verificación son cosas distintas: una noticia de prensa puede ser cierta; solo queda «sin contrastar» hasta que se anota con qué se contrastó. La importancia sale del calendario (alto/medio/bajo); en el radar y los movimientos es una estimación: media si la fuente es primaria o nombra a XRP/XLM, baja si no.');
  if (!v.length) el('p', {class:'vacio'}, L, 'No hay eventos con estos filtros.');
  let sec = null;
  v.slice(0, f.limite).forEach(e => { const s = e.futuro ? 'Próximos' : 'Ya ocurridos'; if (s !== sec){ sec = s; el('div', {class:'sec'}, L, s); } tarjeta(e, L); });
  if (v.length > f.limite){ const b = el('button', {class:'chip', id:'mas', type:'button'}, L, 'Ver más (' + (v.length - f.limite) + ' restantes)'); b.onclick = () => { f.limite += 40; pintarLista(); }; }
}

function todo(){ pintarBarra(); pintarSelects(); pintarLista(); }
todo();
</script></body></html>
