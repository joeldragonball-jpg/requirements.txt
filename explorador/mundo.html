<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--linea:rgba(148,163,184,.16);--texto:#e6ebf5;--suave:#93a1bd;--oro:#d4a84b}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--texto);font:clamp(12.5px,.5vw + 7.4px,14px)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{padding:4px clamp(4px,.6vw,8px) 10px;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,30vw,560px);gap:clamp(5px,.6vw,8px) clamp(6px,.9vw,12px);align-items:start}
#izqM{display:flex;flex-direction:column;gap:clamp(4px,.6vw,8px);min-width:0}
#lado{position:sticky;top:6px;max-height:calc(100vh - 14px);overflow:auto;padding:clamp(6px,.8vw,10px);display:flex;flex-direction:column;gap:clamp(4px,.6vw,8px);min-width:0}
#lado h2{margin:0;font-size:15px}
#lado h3{margin:6px 0 2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.et-fila{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 8px;align-items:start;font-size:12.5px;padding:3px 0;border-bottom:1px solid rgba(148,163,184,.1)}
.et-fila i{width:12px;height:12px;border-radius:3px;margin-top:3px}
.et-fila small{grid-column:2;color:var(--suave);font-size:11.5px}
.leyetapa{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:var(--suave);padding:2px 6px}
.leyetapa i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cuad{stroke:rgba(255,255,255,.35);stroke-width:.6;animation:ent .7s ease-out both}.cuad.nod{fill:rgba(148,163,184,.14);stroke:rgba(148,163,184,.25)}.cuad.noP{stroke-dasharray:2 1.5;stroke:#fff}
.vidrio{background:rgba(9,14,30,.5);border:1px solid rgba(148,163,184,.12);border-radius:10px;backdrop-filter:blur(8px)}
h1{margin:2px 4px 0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c8d3ea;font-weight:600}
#sub{margin:0 4px;color:var(--suave);font-size:12px}
.fila{display:flex;flex-wrap:wrap;gap:clamp(3px,.4vw,6px) clamp(4px,.6vw,8px);align-items:center;padding:clamp(4px,.5vw,7px) clamp(6px,.8vw,10px)}
.fila .et{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);margin-right:2px}
.chip{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:clamp(2px,.3vw,4px) clamp(6px,.8vw,10px);font:inherit;font-size:clamp(11px,.35vw + 7.6px,12.5px);cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:border-color .15s,background-color .15s}
.chip:hover{border-color:var(--oro);color:#fff}
.chip.on{border-color:var(--oro);background:rgba(212,168,75,.14);color:#f1d58a}
.chip i{width:9px;height:9px;transform:rotate(45deg);display:inline-block}
#mapa{padding:6px}
#mapa svg{width:100%;height:auto;display:block}
.casilla{cursor:pointer}
.casilla>rect{fill:rgba(15,23,42,.8);stroke:rgba(148,163,184,.22);transition:.15s}
.casilla:hover>rect{stroke:var(--oro)}
.casilla.sel>rect{stroke:var(--oro);stroke-width:2;fill:rgba(212,168,75,.12)}
.casilla.vacia>rect,.casilla.vacia text{opacity:.55}
.casilla text{fill:#cdd6ea;font-family:system-ui,sans-serif;pointer-events:none}
.casilla .n{fill:#f1d58a;font-weight:700}
.casilla .nom{fill:#93a1bd}
#estado{padding:2px 6px;color:var(--suave);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
#estado b{color:#f1d58a}
#lista{display:flex;flex-direction:column;gap:6px}
.ev{--c:#888;border:1px solid rgba(148,163,184,.14);border-left:5px solid var(--c);border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 65%),rgba(9,14,30,.62);padding:clamp(5px,.6vw,8px) clamp(7px,.9vw,12px);transition:transform .15s,box-shadow .15s;animation:sube .4s ease-out both}
.ev:hover{transform:translateY(-1px);box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.ev.prox{box-shadow:0 0 12px color-mix(in srgb,var(--c) 22%,transparent)}
.ev .tm{font-weight:700;color:var(--c)}
.ev.abre{border-color:rgba(212,168,75,.55);border-left-width:4px}
.ev .cab{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;cursor:pointer}
.ev .f{font-weight:700;color:#f1d58a;font-size:12.5px;white-space:nowrap}
.ev .t{flex:1 1 260px;font-weight:600}
.ev .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--suave);margin-top:3px}
.nivel{padding:0 6px;border-radius:4px;font-weight:700;font-size:11px;border:1px solid}
.nivel.P{color:#2fe08f;border-color:#2fe08f;background:rgba(47,224,143,.14)}.nivel.S{color:#e8b64a;border-color:#e8b64a;background:rgba(232,182,74,.14)}.nivel.VERIFICAR{color:#ff6b6b;border-color:#ff6b6b;background:rgba(255,107,107,.14)}
.proximo{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#1a1405;background:#f1d58a;border-radius:4px;padding:0 6px;font-weight:700}
.det{display:none;margin-top:7px;padding-top:7px;border-top:1px dashed var(--linea);font-size:clamp(11.5px,.4vw + 7.4px,13px);color:#cdd6ea}
.ev.abre .det{display:block}
.det p{margin:0 0 5px}.det .k{color:var(--suave)}
#mas{align-self:center}
.aviso{color:var(--suave);font-size:11.5px;margin:2px 6px}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ent{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:700px){#app{display:flex;flex-direction:column}#lado{position:static;max-height:none}#app{padding:2px 2px 8px}.fila{padding:6px 7px}.chip{padding:5px 9px}}
</style></head><body>
<div id="app">
<div id="izqM">
<h1>Mapamundi de actualidad</h1>
<p id="sub"></p>
<div class="vidrio fila" id="fPeriodo"></div>
<div class="vidrio fila" id="fTema"></div>
<div class="vidrio fila" id="fNivel"></div>
<div class="vidrio" id="mapa"></div>
<div class="leyetapa" id="leyetapa"></div>
<p class="aviso" id="aviso"></p>
</div>
<aside class="vidrio" id="lado">
<div id="ficha"></div>
<div id="estado"></div>
<div id="lista"></div>
<button class="chip" id="mas" hidden></button>
</aside>
</div>
<script id="datos" type="application/json">__DATOS__</script>
<script>
const D = JSON.parse(document.getElementById('datos').textContent) || (window.parent && window.parent.DATOS && window.parent.DATOS.mundo);   // dentro de la Órbita los datos llegan por window.parent.DATOS.mundo
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, props, padre, texto){ const e = document.createElement(tag); for (const k in (props||{})) e.setAttribute(k, props[k]); if (texto !== undefined) e.textContent = texto; if (padre) padre.appendChild(e); return e; }
function sv(tag, attrs, padre, texto){ const e = document.createElementNS(NS, tag); for (const k in (attrs||{})) e.setAttribute(k, attrs[k]); if (texto !== undefined) e.textContent = texto; if (padre) padre.appendChild(e); return e; }
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmt = s => { const p = (s||'').split('-'); return p.length === 3 ? (+p[2]) + ' ' + MESES[+p[1]-1] + ' ' + p[0] : (s||''); };
const NIVELES = {P:'[P] fuente primaria', S:'[S] fuente secundaria', VERIFICAR:'[VERIFICAR] sin confirmar'};
const COLOR = t => (D.temas[t] || {}).color || '#8a97b0';
const ETAPA_COL = ['#e06c6c', '#d9904a', '#d4a84b', '#8bb86a', '#3fb68b', '#2ee6a6'];
function etapasDe(p){ const m = {}; (D.etapas[p] || []).forEach(x => m[x.tema] = x); return (D.temas_reg || []).map(t => ({nombre:t.nombre, id:t.id, x:m[t.id] || null})); }
const f = {pais:null, tema:new Set(Object.keys(D.temas)), nivel:null, periodo:'todo', abierto:null, limite:25};

// Posición (columna, fila) de cada casilla: aproximación geográfica en ordenador, cuadrícula en móvil
const GEO = {ca:[1,0], uk:[4,0], ru:[7,0], us:[1,1], eu:[4,1], ch:[5,1], ir:[6,1], cn:[8,1], kr:[9,1], jp:[10,1],
  eg:[4,2], sa:[5,2], ae:[6,2], in:[8,2], hk:[9,2], br:[2,3], et:[5,3], sg:[9,3], id:[10,3], za:[5,4], int:[0,4]};
const ORDEN = ['us','eu','uk','ch','sg','hk','cn','jp','kr','in','br','ru','ae','sa','za','id','eg','et','ir','ca','int'];

function visibles(ignorarPais){
  const hoy = D.hoy, lim = new Date(hoy + 'T00:00:00'); lim.setDate(lim.getDate() - 60);
  const l = lim.toISOString().slice(0,10);
  return D.eventos.filter(e => (ignorarPais || !f.pais || e.paises.includes(f.pais)) && f.tema.has(e.tema) && (!f.nivel || e.nivel === f.nivel)
    && (f.periodo === 'todo' || (f.periodo === 'prox' && e.futuro) || (f.periodo === 'rec' && !e.futuro && e.fecha >= l)));
}

function chips(cont, etiqueta, items, activo, onClick){
  cont.textContent = ''; el('span', {class:'et'}, cont, etiqueta);
  items.forEach(it => { const b = el('button', {class:'chip' + (activo(it) ? ' on' : ''), type:'button'}, cont);
    if (it.color){ const i = el('i', {}, b); i.style.background = it.color; } b.appendChild(document.createTextNode(it.nombre));
    b.onclick = () => onClick(it); });
}

function pintarFiltros(){
  chips($('fPeriodo'), 'Periodo', [{id:'todo',nombre:'Todo'},{id:'prox',nombre:'Próximos'},{id:'rec',nombre:'Últimos 60 días'}], i => f.periodo === i.id, i => { f.periodo = i.id; f.limite = 25; todo(); });
  const temas = Object.keys(D.temas).map(k => ({id:k, nombre:D.temas[k].nombre, color:D.temas[k].color}));
  chips($('fTema'), 'Tema', temas, i => f.tema.has(i.id), i => { if (f.tema.has(i.id)) { if (f.tema.size > 1) f.tema.delete(i.id); } else f.tema.add(i.id); f.limite = 25; todo(); });
  chips($('fNivel'), 'Fuente', [{id:null,nombre:'Todas'},{id:'P',nombre:'[P] primaria'},{id:'S',nombre:'[S] secundaria'},{id:'VERIFICAR',nombre:'[VERIFICAR]'}], i => f.nivel === i.id, i => { f.nivel = i.id; f.limite = 25; todo(); });
}

function pintarMapa(){
  const m = $('mapa'); m.textContent = '';
  const movil = (window.innerWidth || 1000) <= 700;
  const por = {}; ORDEN.forEach(p => por[p] = []);
  visibles(true).forEach(e => e.paises.forEach(p => { if (por[p]) por[p].push(e); }));
  const W = movil ? 4 : 11, anc = movil ? 88 : 96, alt = movil ? 74 : 84, sep = movil ? 5 : 6;
  const filas = movil ? Math.ceil(ORDEN.length / W) : 5;
  const s = sv('svg', {viewBox:'0 0 ' + (W*(anc+sep)) + ' ' + (filas*(alt+sep)), role:'img', 'aria-label':'Mapa de casillas del mundo con un punto por noticia'}, m);
  ORDEN.forEach((p, i) => {
    const [c, r] = movil ? [i % W, Math.floor(i / W)] : GEO[p];
    const x = c*(anc+sep), y = r*(alt+sep), lista = por[p];
    const g = sv('g', {class:'casilla' + (f.pais === p ? ' sel' : '') + (lista.length ? '' : ' vacia'), tabindex:'0', role:'button', 'aria-label':D.paises[p] + ': ' + lista.length + ' eventos'}, s);
    sv('rect', {x, y, width:anc, height:alt, rx:8}, g);
    sv('text', {x:x+7, y:y+15, 'font-size':11, 'font-weight':600}, g, p === 'int' ? 'BIS' : p.toUpperCase());
    const et = etapasDe(p), conDato = et.filter(q => q.x).length;
    sv('text', {x:x+anc-7, y:y+15, 'font-size':10.5, 'text-anchor':'end', class:'n'}, g, conDato ? conDato + '/' + et.length + ' temas' : 'sin dato');
    sv('text', {x:x+7, y:y+28, 'font-size':9.5, class:'nom'}, g, D.paises[p].length > 17 ? D.paises[p].slice(0,16) + '…' : D.paises[p]);
    // una casilla por tema del radar regulatorio, coloreada por su etapa (0-5); gris = sin research; borde discontinuo = no [P]
    const cols = 4, tam = movil ? 17 : 19, hueco = 3, ox = x + (anc - (cols*tam + (cols-1)*hueco)) / 2;
    et.forEach((q, k) => {
      const cx = ox + (k % cols) * (tam + hueco), cy = y + 36 + Math.floor(k / cols) * (tam + hueco);
      const r = sv('rect', {x:cx, y:cy, width:tam, height:tam, rx:3, class:'cuad' + (q.x ? (q.x.nivel === 'P' ? '' : ' noP') : ' nod')}, g);
      if (q.x) r.style.fill = ETAPA_COL[q.x.etapa] || '#888';       // por estilo: la regla .casilla rect lo pisaría como atributo
      sv('title', {}, r, D.paises[p] + ' · ' + q.nombre + ': ' + (q.x ? 'etapa ' + q.x.etapa + ' · ' + (D.escala[q.x.etapa] || '') : 'sin dato'));
    });
    const alterna = () => { f.pais = f.pais === p ? null : p; f.limite = 25; f.abierto = null; todo(); };
    g.addEventListener('click', alterna);
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); alterna(); } });
  });
}

function pintarFicha(){
  const F = $('ficha'); F.textContent = '';
  el('h2', {}, F, f.pais ? D.paises[f.pais] : 'Todos los países');
  if (!f.pais){ el('p', {class:'aviso'}, F, 'Haz clic en una casilla para ver la etapa de cada tema y los eventos de ese país. Cada cuadradito es un tema del radar regulatorio (pasa el ratón para el detalle).'); return; }
  el('h3', {}, F, 'Etapa regulatoria por tema');
  const et = etapasDe(f.pais);
  if (!et.some(q => q.x)) el('p', {class:'aviso'}, F, 'Sin research de regulación para este país en el radar.');
  et.forEach(q => { const a = el('div', {class:'et-fila'}, F), i = el('i', {}, a); i.style.background = q.x ? ETAPA_COL[q.x.etapa] : 'rgba(148,163,184,.25)';
    const t = el('span', {}, a); el('b', {}, t, q.nombre); t.appendChild(document.createTextNode(q.x ? ' · etapa ' + q.x.etapa + ': ' + (D.escala[q.x.etapa] || '') + ' · ' + '' : ' · sin dato'));
    if (q.x) { const nv = el('span', {class:'nivel ' + q.x.nivel}, t, q.x.nivel === 'VERIFICAR' ? '[VERIFICAR]' : '[' + q.x.nivel + ']'); nv.style.marginLeft = '6px'; }
    if (q.x) el('small', {}, a, (q.x.revisado ? 'Revisado ' + fmt(q.x.revisado) + '. ' : '') + q.x.estado); });
  el('h3', {}, F, 'Eventos de este país');
}

function pintarLista(irA){
  const L = $('lista'); L.textContent = '';
  const v = visibles(false), est = $('estado'); est.textContent = '';
  el('span', {}, est, (f.pais ? D.paises[f.pais] : 'Todos los países') + ': ');
  el('b', {}, est, v.length + ' eventos');
  if (f.pais){ const b = el('button', {class:'chip', type:'button'}, est, 'Quitar filtro de país'); b.onclick = () => { f.pais = null; f.abierto = null; todo(); }; }
  const frag = v.slice(0, f.limite);
  if (!frag.length) el('p', {class:'aviso'}, L, 'No hay eventos con estos filtros.');
  frag.forEach(e => {
    const a = el('div', {class:'ev' + (f.abierto === e.id ? ' abre' : '') + (e.futuro ? ' prox' : ''), id:'ev' + e.id}, L); a.style.setProperty('--c', COLOR(e.tema));
    const cab = el('div', {class:'cab', role:'button', tabindex:'0'}, a);
    el('span', {class:'f'}, cab, fmt(e.fecha) + (e.hasta && e.hasta !== e.fecha ? ' – ' + fmt(e.hasta) : ''));
    el('span', {class:'t'}, cab, e.tit);
    const meta = el('div', {class:'meta'}, a);
    if (e.futuro) el('span', {class:'proximo'}, meta, 'Próximo');
    el('span', {class:'nivel ' + e.nivel}, meta, e.nivel === 'VERIFICAR' ? '[VERIFICAR]' : '[' + e.nivel + ']');
    el('span', {}, meta, e.paises.map(p => D.paises[p]).join(', '));
    el('span', {class:'tm'}, meta, (D.temas[e.tema] || {}).nombre || e.tema);
    el('span', {}, meta, 'Quién: ' + e.quien);
    const det = el('div', {class:'det'}, a);
    const fila = (k, t) => { if (!t) return; const p = el('p', {}, det); el('span', {class:'k'}, p, k + ': '); p.appendChild(document.createTextNode(t)); };
    fila('Qué pasó', e.que); fila('Contexto', e.contexto); fila('Impacto', e.impacto); fila('Fuente', e.fuente + ' · ' + NIVELES[e.nivel]); fila('Origen del dato', e.origen);
    const alt = () => { f.abierto = f.abierto === e.id ? null : e.id; a.classList.toggle('abre', f.abierto === e.id); document.querySelectorAll('.ev.abre').forEach(n => { if (n !== a) n.classList.remove('abre'); }); };
    cab.addEventListener('click', alt);
    cab.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); alt(); } });
  });
  const mas = $('mas');
  if (v.length > f.limite){ mas.hidden = false; mas.textContent = 'Ver más (' + (v.length - f.limite) + ' restantes)'; mas.onclick = () => { f.limite += 25; pintarLista(); }; } else mas.hidden = true;
  if (irA && f.abierto !== null){ const n = $('ev' + f.abierto); if (n) n.scrollIntoView({block:'center'}); }
}

function pintarLey(){ const l = $('leyetapa'); l.textContent = ''; el('span', {}, l, 'Etapa:');
  Object.keys(D.escala).forEach(k => { const s = el('span', {}, l); const i = el('i', {}, s); i.style.background = ETAPA_COL[k]; s.appendChild(document.createTextNode(k + ' ' + D.escala[k])); });
  const s = el('span', {}, l); const i = el('i', {}, s); i.style.background = 'rgba(148,163,184,.25)'; s.appendChild(document.createTextNode('sin dato · borde discontinuo = fuente no primaria')); }
function todo(irA){ pintarFiltros(); pintarMapa(); pintarFicha(); pintarLista(irA); }
pintarLey();
$('sub').textContent = 'Situación a ' + fmt(D.hoy) + ' · ' + D.eventos.length + ' eventos de calendario, radar regulatorio y movimientos. Cada punto es un evento (borde dorado = próximo).';
$('aviso').textContent = 'Informativo: no es recomendación de compra ni venta. País asignado por palabras clave o por la jurisdicción de la celda; lo no ubicable va a «Internacional / BIS». [P] fuente primaria · [S] secundaria · [VERIFICAR] sin confirmar.';
let ancho = window.innerWidth;
window.addEventListener('resize', () => { if ((ancho <= 700) !== (window.innerWidth <= 700)) { ancho = window.innerWidth; pintarMapa(); } });
todo();
</script></body></html>
