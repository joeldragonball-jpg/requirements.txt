<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--linea:rgba(148,163,184,.16);--texto:#e6ebf5;--suave:#93a1bd;--oro:#d4a84b;--sube:#5fd0a0;--baja:#f08a7a}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{padding:4px 6px 14px;display:flex;flex-direction:column;gap:10px}
.vidrio{background:rgba(9,14,30,.5);border:1px solid rgba(148,163,184,.12);border-radius:10px;backdrop-filter:blur(8px)}
h1{margin:2px 4px 0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c8d3ea;font-weight:600}
#sub{margin:0 4px;color:var(--suave);font-size:12px}
.pestanas{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px}
.chip{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--oro);color:#fff}
.chip.on{border-color:var(--oro);background:rgba(212,168,75,.14);color:#f1d58a}
.panel{padding:12px 14px}
.panel h2{margin:0 0 2px;font-size:16px;color:#f1d58a}
.panel .que{margin:0 0 8px;color:var(--suave);font-size:12.5px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.kpi{border:1px solid var(--linea);border-radius:8px;padding:6px 12px;background:rgba(15,23,42,.6);min-width:150px}
.kpi .v{font-size:19px;font-weight:700;color:#f1d58a}
.kpi .e{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.aviso{border:1px solid rgba(212,168,75,.4);background:rgba(212,168,75,.08);border-radius:8px;padding:8px 12px;font-size:12.5px;color:#e9d9ad;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);text-align:right;padding:5px 8px;border-bottom:1px solid var(--linea);font-weight:600;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:5px 8px;border-bottom:1px solid rgba(148,163,184,.08);text-align:right;white-space:nowrap}
tr:hover td{background:rgba(212,168,75,.06)}
td.n{font-variant-numeric:tabular-nums}
.sube{color:var(--sube)}.baja{color:var(--baja)}.neutro{color:var(--suave)}
.barra{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(90deg,#d4a84b,#f1d58a);vertical-align:middle}
.nivel{padding:0 6px;border-radius:4px;font-weight:700;font-size:11px;border:1px solid;display:inline-block}
.nivel.P{color:#5fd0a0;border-color:#5fd0a0}.nivel.S{color:#f1d58a;border-color:#d4a84b}
.pie{margin-top:8px;color:var(--suave);font-size:11.5px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.dos{grid-template-columns:1fr}.panel{padding:10px}table{font-size:12px}th,td{padding:4px 5px}.hm{display:none}}
.sel{background:rgba(212,168,75,.1)}
td.tag{color:var(--suave);font-size:11.5px;text-align:left}
.mini{font-size:11.5px;color:var(--suave)}
svg.spark{vertical-align:middle}
.fila-xrp td{color:#f1d58a;font-weight:600}
.gl-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.gl-barra input{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:6px 10px;font:inherit;min-width:220px}
.gl-barra select{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:6px 8px;font:inherit}
.gl{border-bottom:1px solid rgba(148,163,184,.1);padding:7px 2px}
.gl summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.gl summary b{color:#f1d58a}
.gl p{margin:6px 0 2px;color:var(--texto);font-size:13px}
.etq{font-size:10.5px;padding:0 6px;border-radius:4px;border:1px solid var(--linea);color:var(--suave)}
.etq.v{color:#f08a7a;border-color:#f08a7a}
</style></head><body>
<div id="app">
 <h1>Paneles de datos</h1>
 <p id="sub"></p>
 <div class="pestanas vidrio" id="pest"></div>
 <div id="cont"></div>
</div>
<script type="application/json" id="datos">__DATOS__</script>
<script>
const D = JSON.parse(document.getElementById('datos').textContent);
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fm = (v,d=1)=> v==null? '—' : v.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});
const mesTxt = m => { const [a,b]=m.split('-'); return MES[+b-1]+'-'+a; };
const fUSD = v => v>=2e9? '$'+fm(v/1e9,1)+' mil M' : v>=1e6? '$'+fm(v/1e6,0)+' M' : '$'+fm(v/1e3,0)+' mil';
function pct(a,b){ return (a==null||b==null||!b)? null : (a/b-1)*100; }
function cambio(p){
  if(p==null) return '<span class="neutro">—</span>';
  const c = Math.abs(p)<0.05? 'neutro' : p>0? 'sube':'baja';
  return `<span class="${c}">${p>0?'+':''}${fm(p,1)} %</span>`;
}
function spark(serie, w=110, h=22){        // serie del más antiguo al más reciente
  const mn=Math.min(...serie), mx=Math.max(...serie), r=(mx-mn)||1;
  const pts=serie.map((v,i)=>`${(i/(serie.length-1)*(w-4)+2).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' ');
  const ult=serie[serie.length-1], pri=serie[0], col=ult>=pri?'#5fd0a0':'#f08a7a';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts}"/></svg>`;
}
document.getElementById('sub').textContent = 'Datos abiertos leídos el '+D.leido+'. Cada cifra lleva su fuente, su fecha y su nivel: [P] primaria, [S] secundaria.';

function panelTIC(){
  const t=D.tic; if(!t) return '<div class="aviso">No hay datos de la tabla TIC. Ejecuta scripts/actualizar_paneles.py.</div>';
  const n=t.meses.length, ult=t.meses[0], hace12=t.meses[12]??null, hace6=t.meses[6]??null, hace1=t.meses[1];
  const maxV=Math.max(...t.paises.map(p=>p.serie[0]));
  const filas=t.paises.map((p,i)=>{
    const s=p.serie;
    return `<tr><td>${i+1}. ${p.nombre}</td><td class="n">${fm(s[0])}</td><td class="n">${fm(s[0]/t.total[0]*100,1)} %</td>
    <td class="hm"><span class="barra" style="width:${(s[0]/maxV*90).toFixed(0)}px"></span></td>
    <td class="n">${cambio(pct(s[0],s[1]))}</td><td class="n">${cambio(pct(s[0],s[6]))}</td><td class="n">${cambio(pct(s[0],s[12]))}</td>
    <td class="hm">${spark(s.slice().reverse())}</td></tr>`;
  }).join('');
  const of=t.oficial;
  return `<div class="panel vidrio"><h2>¿Quién tiene deuda de EE. UU.?</h2>
  <p class="que">Mayores tenedores extranjeros de bonos y letras del Tesoro de EE. UU. Fuente: Tesoro de EE. UU., sistema TIC, tabla 5 · último mes: <b>${mesTxt(ult)}</b> · <span class="nivel P">P</span> fuente primaria</p>
  <div class="kpis">
   <div class="kpi"><div class="v">$${fm(t.total[0],0)} mil M</div><div class="e">Total extranjero · ${mesTxt(ult)}</div></div>
   <div class="kpi"><div class="v">${of?'$'+fm(of[0],0)+' mil M':'—'}</div><div class="e">De ellos, oficiales (bancos centrales y Estados)</div></div>
   <div class="kpi"><div class="v">${cambio(pct(t.total[0],t.total[12]))}</div><div class="e">Total frente a ${mesTxt(hace12||ult)}</div></div>
  </div>
  <div class="aviso"><b>Cómo leerlo:</b> ${t.nota}</div>
  <table><thead><tr><th>País (donde está la custodia)</th><th>${mesTxt(ult)} ($ mil M)</th><th>% del total</th><th class="hm"></th><th>vs mes ant.</th><th>vs 6 meses</th><th>vs 12 meses</th><th class="hm">13 meses</th></tr></thead><tbody>${filas}
  <tr><td class="neutro">Resto de países</td><td class="n neutro">${fm(t.otros[0])}</td><td class="n neutro">${fm(t.otros[0]/t.total[0]*100,1)} %</td><td class="hm"></td><td class="n">${cambio(pct(t.otros[0],t.otros[1]))}</td><td class="n">${cambio(pct(t.otros[0],t.otros[6]))}</td><td class="n">${cambio(pct(t.otros[0],t.otros[12]))}</td><td class="hm">${spark(t.otros.slice().reverse())}</td></tr></tbody></table>
  <p class="pie">Fuente: <a style="color:#f1d58a" href="${t.fuente}" target="_blank" rel="noopener">${t.fuente}</a>. Los valores están en miles de millones de dólares y se publican con unas 6-7 semanas de retraso. Una variación mezcla compras o ventas con cambios de valor de mercado: no es un flujo.</p></div>`;
}

const MEC={'fiat-backed':'Respaldo en dinero y letras','crypto-backed':'Respaldo en cripto','algorithmic':'Algorítmica','':'—'};
function panelStable(){
  const s=D.stablecoins; if(!s) return '<div class="aviso">No hay datos de stablecoins. Ejecuta scripts/actualizar_paneles.py.</div>';
  const filas=s.top.map((x,i)=>`<tr class="${x.simbolo==='RLUSD'?'fila-xrp':''}"><td>${i+1}. <b>${x.simbolo}</b> <span class="mini">${x.nombre}</span></td>
   <td class="n">${fUSD(x.usd)}</td><td class="n">${fm(x.usd/s.total*100,1)} %</td><td class="n">${cambio(x.cambio_7d)}</td><td class="n">${cambio(x.cambio_30d)}</td>
   <td class="tag hm">${x.ligada==='USD'?'Dólar':x.ligada}</td><td class="tag hm">${MEC[x.mecanismo]||x.mecanismo}</td><td class="n hm">${x.n_cadenas}</td></tr>`).join('');
  const cad=(c,nombre)=>`<div class="panel vidrio"><h2>En ${nombre}</h2><p class="que">${c.n} stablecoins con saldo · total ${fUSD(c.total)}</p>
   <table><thead><tr><th>Stablecoin</th><th>Circulación</th><th>% de la cadena</th></tr></thead><tbody>${c.top.map(f=>`<tr class="${f.simbolo==='RLUSD'?'fila-xrp':''}"><td><b>${f.simbolo}</b> <span class="mini">${f.nombre}</span></td><td class="n">${fUSD(f.usd)}</td><td class="n">${fm(f.usd/c.total*100,1)} %</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="panel vidrio"><h2>Stablecoins: quién emite y cuánto circula</h2>
  <p class="que">Los 15 mayores por circulación. DefiLlama · <span class="nivel S">S</span> agregador (cifras estimadas)</p>
  <div class="kpis"><div class="kpi"><div class="v">${fUSD(s.total)}</div><div class="e">Circulación total (${s.n_activos} activos)</div></div>
   <div class="kpi"><div class="v">${fm(s.top[0].usd/s.total*100,0)} %</div><div class="e">Cuota de ${s.top[0].simbolo}</div></div>
   <div class="kpi"><div class="v">${fm((s.top[0].usd+s.top[1].usd)/s.total*100,0)} %</div><div class="e">Cuota de ${s.top[0].simbolo} + ${s.top[1].simbolo}</div></div></div>
  <table><thead><tr><th>Stablecoin</th><th>Circulación</th><th>% del total</th><th>7 días</th><th>30 días</th><th class="hm">Ligada a</th><th class="hm">Respaldo</th><th class="hm">Cadenas</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="pie">Fuente: <a style="color:#f1d58a" href="${s.fuente}" target="_blank" rel="noopener">${s.fuente}</a>. ${s.nota}</p></div>
  <div class="dos">${cad(s.xrpl,'el XRP Ledger (XRPL)')}${cad(s.stellar,'Stellar')}</div>
  <div class="aviso">Contraste: el dossier de stablecoins del 9-oct leyó en el propio XRPL unos $1.140 M de RLUSD (ledger, 17-oct); DefiLlama muestra hoy ${fUSD((s.xrpl.top.find(f=>f.simbolo==='RLUSD')||{usd:0}).usd)} en XRPL. Difieren por fecha y método: no se mezclan.</div>`;
}

const DSIM={sube:['▲','#d9904a','subió'],mantiene:['▬','#8a97b0','mantuvo'],baja:['▼','#5aa9e6','bajó'],'n/d':['•','#64748b','sin dato']};
function fechaCorta(iso){ if(!iso) return '—'; const p=iso.split('-'); return p.length>=3? p[2]+'-'+MES[+p[1]-1]+'-'+p[0].slice(2) : (p[1]? MES[+p[1]-1]+'-'+p[0] : iso); }
function diasHasta(iso){ if(!iso||iso.length<10) return null; return Math.round((new Date(iso)-new Date(D.hoy))/86400000); }
function panelTipos(){
  const t=D.tipos||[]; if(!t.length) return '<div class="aviso">No hay datos de tipos.</div>';
  const sub=t.filter(x=>x.dir==='sube').length, baj=t.filter(x=>x.dir==='baja').length, man=t.filter(x=>x.dir==='mantiene').length;
  const prox=t.filter(x=>diasHasta(x.proxima)!=null&&diasHasta(x.proxima)>=0).sort((a,b)=>diasHasta(a.proxima)-diasHasta(b.proxima))[0];
  const filas=t.map(x=>{ const s=DSIM[x.dir]||DSIM['n/d'], d=diasHasta(x.proxima);
    return `<tr title="${x.estado.replace(/"/g,'&quot;')}"><td>${x.pais}</td><td class="n"><b>${x.valor}</b></td><td style="color:${s[1]}">${s[0]} ${s[2]}</td>
    <td class="n">${fechaCorta(x.fecha)}</td><td class="n">${x.proxima? fechaCorta(x.proxima)+(d!=null&&d>=0?` <span class="mini">(en ${d} d)</span>`:''):'—'}</td>
    <td><span class="nivel ${x.nivel==='P'?'P':'S'}">${x.nivel==='P'?'P':'S'}</span></td><td class="tag hm" style="white-space:normal;max-width:420px">${x.estado.length>150? x.estado.slice(0,150)+'…':x.estado}</td></tr>`; }).join('');
  return `<div class="panel vidrio"><h2>Tipos de interés de los bancos centrales</h2>
  <p class="que">Último tipo oficial y último movimiento (▲ subió · ▬ mantuvo · ▼ bajó) · vienen de la columna «política monetaria» del radar regulatorio, ya verificada allí</p>
  <div class="kpis"><div class="kpi"><div class="v">${sub} de ${t.length}</div><div class="e">Subieron tipos en su último movimiento</div></div>
   <div class="kpi"><div class="v">${man}</div><div class="e">Mantuvieron</div></div><div class="kpi"><div class="v">${baj}</div><div class="e">Bajaron</div></div>
   ${prox?`<div class="kpi"><div class="v">${prox.pais}</div><div class="e">Próxima reunión: ${fechaCorta(prox.proxima)} (en ${diasHasta(prox.proxima)} d)</div></div>`:''}</div>
  <div class="aviso">Los tipos no son comparables entre sí sin la inflación de cada país: este panel muestra el nivel y el movimiento, no si el tipo es «alto» o «bajo». Singapur gestiona una banda de tipo de cambio (no un tipo) y China publica el LPR. Pasa el ratón por una fila para ver el detalle completo.</div>
  <table><thead><tr><th>País</th><th>Tipo</th><th>Último mov.</th><th title="Fecha de la información en el radar, no la del movimiento: la del movimiento está en «Qué pasó»">Dato de</th><th>Próxima reunión</th><th></th><th class="hm">Qué pasó</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="pie">Fuente: radar regulatorio (explorador/regulacion.json), con sus informes y su etiqueta [P]/[S] por país. Fechas de reunión según el calendario del repo y las notas de cada banco; algunas son aproximadas [VERIFICAR].</p></div>`;
}

const fPrecio = v => v>=1000? '$'+fm(v,0) : v>=1? '$'+fm(v,2) : '$'+fm(v,4);
function panelMercadoRWA(){
  const m=D.mercado, r=D.rwa; if(!m&&!r) return '<div class="aviso">No hay datos. Ejecuta scripts/actualizar_paneles.py.</div>';
  const mer = m? `<div class="panel vidrio"><h2>Mercado de XRP y XLM</h2><p class="que">Precio, capitalización y variación en 24 h · CoinGecko · <span class="nivel S">S</span> agregador</p>
   <table><thead><tr><th>Activo</th><th>Precio</th><th>Capitalización</th><th>24 h</th></tr></thead><tbody>${m.activos.map(a=>`<tr class="${a.simbolo!=='BTC'?'fila-xrp':''}"><td><b>${a.simbolo}</b> <span class="mini">${a.nombre}</span></td><td class="n">${fPrecio(a.precio)}</td><td class="n">${fUSD(a.capitalizacion)}</td><td class="n">${cambio(a.cambio_24h)}</td></tr>`).join('')}</tbody></table>
   <p class="pie">Leído el ${D.leido}. Fuente: <a style="color:#f1d58a" href="${m.fuente}" target="_blank" rel="noopener">CoinGecko</a>.</p></div>` : '';
  const rw = r? `<div class="panel vidrio"><h2>Protocolos RWA en DeFi</h2><p class="que">Valor bloqueado (TVL) en protocolos que DefiLlama clasifica como RWA · <span class="nivel S">S</span> agregador</p>
   <div class="kpis"><div class="kpi"><div class="v">${fUSD(r.total)}</div><div class="e">En ${r.n} protocolos</div></div><div class="kpi"><div class="v">${fUSD(r.stellar)}</div><div class="e">De ellos, en Stellar</div></div><div class="kpi"><div class="v">${fUSD(r.xrpl)}</div><div class="e">De ellos, en el XRPL</div></div></div>
   <div class="aviso"><b>Cómo leerlo:</b> ${r.nota}</div>
   <table><thead><tr><th>Protocolo</th><th>Valor bloqueado</th><th>7 días</th><th class="hm">Cadenas</th></tr></thead><tbody>${r.top.map(x=>`<tr><td>${x.nombre}</td><td class="n">${fUSD(x.usd)}</td><td class="n">${cambio(x.cambio_7d)}</td><td class="tag hm">${(x.cadenas||[]).join(', ')}</td></tr>`).join('')}</tbody></table>
   <p class="pie">Fuente: <a style="color:#f1d58a" href="${r.fuente}" target="_blank" rel="noopener">DefiLlama</a>, leído el ${D.leido}.</p></div>` : '';
  return mer+rw;
}
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let glQ='', glC='';
function panelGlosario(){
  const g=D.glosario||[]; if(!g.length) return '<div class="aviso">No hay glosario cargado.</div>';
  const nom={}; (D.capas||[]).forEach(c=>nom[c.id]=c.nombre);
  const plano=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const q=plano(glQ);
  const lista=g.filter(x=>(!q||plano(x.t+' '+x.d).includes(q))&&(!glC||x.capas.includes(glC)));
  const filas=lista.map(x=>`<details class="gl"><summary><b>${esc(x.t)}</b>${x.capas.map(c=>`<span class="etq">${esc(nom[c]||c)}</span>`).join('')}${x.ver?'<span class="etq v">VERIFICAR</span>':''}</summary>
   <p>${esc(x.d)}</p><p class="mini">Fuente: ${esc(x.f)||'—'}${x.e?' · Estado: '+esc(x.e):''}</p></details>`).join('');
  return `<div class="panel vidrio"><h2>Glosario</h2>
  <p class="que">${g.length} términos de los informes R16, con la capa del mapa de órbitas donde encajan (por palabras clave). Pulsa un término para ver su definición, fuente y estado.</p>
  <div class="gl-barra"><input id="glq" type="search" placeholder="Buscar término o palabra…" value="${esc(glQ)}">
   <select id="glc"><option value="">Todas las capas</option>${(D.capas||[]).map(c=>`<option value="${esc(c.id)}"${c.id===glC?' selected':''}>${esc(c.nombre)}</option>`).join('')}</select>
   <span class="mini">${lista.length} de ${g.length}</span></div>
  ${filas||'<p class="mini">Ningún término coincide.</p>'}
  <p class="pie">Fuente: informes/research/*R16-glosario*.md. Las definiciones apoyadas solo en fuentes secundarias llevan la marca VERIFICAR. Informativo, sin recomendaciones.</p></div>`;
}
function panelDeuda(){
  const d=D.deuda; if(!d) return '<div class="aviso">No hay datos de deuda. Ejecuta scripts/actualizar_paneles.py.</div>';
  const ix=a=>d.anios.indexOf(a), i25=ix('2025'), i26=ix('2026'), i30=ix('2030'), i23=ix('2023');
  const RE={USA:'USA',JPN:'JPN',GBR:'GBR',DEU:'EUR',FRA:'EUR',ITA:'EUR',ESP:'EUR'};
  const orden=d.paises.slice().sort((a,b)=>b.deuda[i26]-a.deuda[i26]);
  const mx=Math.max(...d.paises.map(p=>p.deuda[i26]));
  const dsal=v=>v==null?'—':`<span class="${v<0?'baja':'sube'}">${v>0?'+':''}${fm(v,1)} %</span>`;
  const filas=orden.map(p=>{ const r=d.rendimientos&&d.rendimientos[RE[p.id]];
    const rt=r? `<b>${fm(r.valor,2)} %</b> <span class="nivel ${r.nivel}" title="${esc(r.fuente)}">${r.nivel}</span> <span class="mini">${fechaCorta(r.fecha)}${RE[p.id]==='EUR'?' · zona euro':''}</span>` : '<span class="neutro">sin fuente abierta leída</span>';
    return `<tr><td>${esc(p.nombre)}</td><td class="n"><b>${fm(p.deuda[i26])} %</b></td><td class="hm"><span class="barra" style="width:${(p.deuda[i26]/mx*90).toFixed(0)}px"></span></td>
     <td class="n">${(p.deuda[i26]-p.deuda[i23]>0?'+':'')+fm(p.deuda[i26]-p.deuda[i23],1)} pp</td><td class="n">${fm(p.deuda[i30])} %</td><td class="n">${dsal(p.saldo[i25])}</td><td class="n">${dsal(p.saldo[i26])}</td><td class="n">${rt}</td></tr>`;}).join('');
  const rend=Object.entries(d.rendimientos||{}).map(([k,v])=>`<li>${esc(v.fuente)} · ${fechaCorta(v.fecha)} · <span class="nivel ${v.nivel}">${v.nivel}</span></li>`).join('');
  return `<div class="panel vidrio"><h2>Deuda pública por país</h2>
  <p class="que">Deuda bruta del conjunto de las administraciones, déficit (−) o superávit (+) y rendimiento de los bonos a 10 años · ${esc(d.edicion)} · <span class="nivel P">P</span> FMI</p>
  <div class="kpis"><div class="kpi"><div class="v">${esc(orden[0].nombre)}</div><div class="e">Mayor deuda/PIB en 2026: ${fm(orden[0].deuda[i26])} %</div></div>
   <div class="kpi"><div class="v">${fm(d.paises.find(p=>p.id==='USA').deuda[i26])} %</div><div class="e">EE. UU. 2026 · saldo ${fm(d.paises.find(p=>p.id==='USA').saldo[i26])} % del PIB</div></div>
   <div class="kpi"><div class="v">${fm(d.rendimientos&&d.rendimientos.USA?d.rendimientos.USA.valor:null,2)} %</div><div class="e">Bono de EE. UU. a 10 años · ${d.rendimientos&&d.rendimientos.USA?fechaCorta(d.rendimientos.USA.fecha):'—'}</div></div></div>
  <div class="aviso"><b>Cómo leerlo:</b> las cifras de 2025 en adelante son estimaciones y proyecciones del FMI, no datos cerrados. «Deuda bruta» no resta los activos que tiene el Estado: en Japón y Singapur es muy alta, pero ambos tienen grandes activos públicos, y la de Singapur es, según el MOF y la MAS, en su mayor parte deuda emitida con fines distintos de gastar (las emisiones se invierten y no se pueden gastar) [P]; que toda la deuda bruta esté cubierta por activos no consta en esas fuentes. Un rendimiento alto no dice por sí solo si la deuda es «mala»: depende de la inflación, el crecimiento y la moneda. Los rendimientos de la zona euro son de la curva del BCE (emisores AAA), no de cada país. Informativo, sin recomendaciones.</div>
  <table><thead><tr><th>País</th><th>Deuda/PIB 2026</th><th class="hm"></th><th title="Cambio de la deuda/PIB entre 2023 y 2026, en puntos porcentuales">vs 2023</th><th>2030 (proyec.)</th><th>Saldo 2025</th><th>Saldo 2026</th><th>Rendimiento a 10 años</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="pie">Deuda y saldo: <a style="color:#f1d58a" href="${d.fuente}" target="_blank" rel="noopener">FMI, Perspectivas de la Economía Mundial</a>, leído el ${esc(d.leido)} (${esc(d.como)}). Rendimientos, leídos el ${esc(D.leido)}:</p><ul class="pie">${rend}</ul>
  <p class="pie">España y las demás zonas con rendimiento «sin fuente abierta leída» no tienen aún una fuente oficial gratuita comprobada; se añadirán solo con fuente primaria.</p></div>`;
}
const PEST=[['tic','Deuda de EE. UU.',panelTIC],['deuda','Deuda pública',panelDeuda],['stable','Stablecoins',panelStable],['tipos','Tipos de interés',panelTipos],['rwa','Mercado y RWA',panelMercadoRWA],['glo','Glosario',panelGlosario]];
let act=PEST[0][0];
function pinta(){
  document.getElementById('pest').innerHTML=PEST.map(p=>`<button class="chip ${p[0]===act?'on':''}" data-k="${p[0]}">${p[1]}</button>`).join('')+'<span class="mini" style="align-self:center;margin-left:8px">Próximos: deuda por país · CBDC y redes</span>';
  document.getElementById('cont').innerHTML=PEST.find(p=>p[0]===act)[2]();
  const q=document.getElementById('glq'), c=document.getElementById('glc');
  if(q){ q.oninput=()=>{glQ=q.value; const pos=q.selectionStart; pinta(); const n=document.getElementById('glq'); n.focus(); n.setSelectionRange(pos,pos);}; }
  if(c){ c.onchange=()=>{glC=c.value; pinta();}; }
  document.querySelectorAll('#pest .chip').forEach(b=>b.onclick=()=>{act=b.dataset.k;pinta();});
}
pinta();
</script></body></html>
