<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--linea:rgba(148,163,184,.16);--texto:#e6ebf5;--suave:#93a1bd;--oro:#d4a84b;--sube:#5fd0a0;--baja:#f08a7a}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{padding:4px 6px 14px;display:flex;flex-direction:column;gap:10px}
.vidrio{background:rgba(9,14,30,.5);border:1px solid rgba(148,163,184,.12);border-radius:10px;backdrop-filter:blur(8px)}
h1{margin:2px 4px 0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c8d3ea;font-weight:600}
#sub{margin:0 4px;color:var(--suave);font-size:12px}
.pestanas{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px}
.chip{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--oro);color:#fff}
.chip.on{border-color:var(--oro);background:rgba(212,168,75,.14);color:#f1d58a}
.panel{padding:12px 14px}
.panel h2{margin:0 0 2px;font-size:16px;color:#f1d58a}
.panel .que{margin:0 0 8px;color:var(--suave);font-size:12.5px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.kpi{border:1px solid var(--linea);border-radius:8px;padding:6px 12px;background:rgba(15,23,42,.6);min-width:150px}
.kpi .v{font-size:19px;font-weight:700;color:#f1d58a}
.kpi .e{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.aviso{border:1px solid rgba(212,168,75,.4);background:rgba(212,168,75,.08);border-radius:8px;padding:8px 12px;font-size:12.5px;color:#e9d9ad;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);text-align:right;padding:5px 8px;border-bottom:1px solid var(--linea);font-weight:600;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:5px 8px;border-bottom:1px solid rgba(148,163,184,.08);text-align:right;white-space:nowrap}
tr:hover td{background:rgba(212,168,75,.06)}
td.n{font-variant-numeric:tabular-nums}
.sube{color:var(--sube)}.baja{color:var(--baja)}.neutro{color:var(--suave)}
.barra{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(90deg,#d4a84b,#f1d58a);vertical-align:middle}
.nivel{padding:0 6px;border-radius:4px;font-weight:700;font-size:11px;border:1px solid;display:inline-block}
.nivel.P{color:#5fd0a0;border-color:#5fd0a0}.nivel.S{color:#f1d58a;border-color:#d4a84b}
.pie{margin-top:8px;color:var(--suave);font-size:11.5px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.dos{grid-template-columns:1fr}.panel{padding:10px;overflow-x:auto}.dos>.panel{min-width:0}table{font-size:12px}th,td{padding:4px 5px}.hm{display:none}}
.sel{background:rgba(212,168,75,.1)}
td.tag{color:var(--suave);font-size:11.5px;text-align:left}
.mini{font-size:11.5px;color:var(--suave)}
svg.spark{vertical-align:middle}
.fila-xrp td{color:#f1d58a;font-weight:600}
.pto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.gl-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.gl-barra input{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:6px 10px;font:inherit;min-width:220px}
.gl-barra select{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:6px 8px;font:inherit}
.gl{border-bottom:1px solid rgba(148,163,184,.1);padding:7px 2px}
.gl summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.gl summary b{color:#f1d58a}
.gl p{margin:6px 0 2px;color:var(--texto);font-size:13px}
.etq{font-size:10.5px;padding:0 6px;border-radius:4px;border:1px solid var(--linea);color:var(--suave)}
.etq.v{color:#f08a7a;border-color:#f08a7a}
</style></head><body>
<div id="app">
 <h1>Paneles de datos</h1>
 <p id="sub"></p>
 <div class="pestanas vidrio" id="pest"></div>
 <div id="cont"></div>
</div>
<script type="application/json" id="datos">__DATOS__</script>
<script>
const D = JSON.parse(document.getElementById('datos').textContent);
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fm = (v,d=1)=> v==null? '—' : v.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});
const mesTxt = m => { const [a,b]=m.split('-'); return MES[+b-1]+'-'+a; };
const fUSD = v => v>=2e9? '$'+fm(v/1e9,1)+' mil M' : v>=1e6? '$'+fm(v/1e6,0)+' M' : '$'+fm(v/1e3,0)+' mil';
function pct(a,b){ return (a==null||b==null||!b)? null : (a/b-1)*100; }
function cambio(p){
  if(p==null) return '<span class="neutro">—</span>';
  const c = Math.abs(p)<0.05? 'neutro' : p>0? 'sube':'baja';
  return `<span class="${c}">${p>0?'+':''}${fm(p,1)} %</span>`;
}
function spark(serie, w=110, h=22){        // serie del más antiguo al más reciente
  const mn=Math.min(...serie), mx=Math.max(...serie), r=(mx-mn)||1;
  const pts=serie.map((v,i)=>`${(i/(serie.length-1)*(w-4)+2).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' ');
  const ult=serie[serie.length-1], pri=serie[0], col=ult>=pri?'#5fd0a0':'#f08a7a';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts}"/></svg>`;
}
document.getElementById('sub').textContent = 'Datos abiertos leídos el '+D.leido+'. Cada cifra lleva su fuente, su fecha y su nivel: [P] primaria, [S] secundaria.';

function panelTIC(){
  const t=D.tic; if(!t) return '<div class="aviso">No hay datos de la tabla TIC. Ejecuta scripts/actualizar_paneles.py.</div>';
  const n=t.meses.length, ult=t.meses[0], hace12=t.meses[12]??null, hace6=t.meses[6]??null, hace1=t.meses[1];
  const maxV=Math.max(...t.paises.map(p=>p.serie[0]));
  const filas=t.paises.map((p,i)=>{
    const s=p.serie;
    return `<tr><td>${i+1}. ${p.nombre}</td><td class="n">${fm(s[0])}</td><td class="n">${fm(s[0]/t.total[0]*100,1)} %</td>
    <td class="hm"><span class="barra" style="width:${(s[0]/maxV*90).toFixed(0)}px"></span></td>
    <td class="n">${cambio(pct(s[0],s[1]))}</td><td class="n">${cambio(pct(s[0],s[6]))}</td><td class="n">${cambio(pct(s[0],s[12]))}</td>
    <td class="hm">${spark(s.slice().reverse())}</td></tr>`;
  }).join('');
  const of=t.oficial;
  return `<div class="panel vidrio"><h2>¿Quién tiene deuda de EE. UU.?</h2>
  <p class="que">Mayores tenedores extranjeros de bonos y letras del Tesoro de EE. UU. Fuente: Tesoro de EE. UU., sistema TIC, tabla 5 · último mes: <b>${mesTxt(ult)}</b> · <span class="nivel P">P</span> fuente primaria</p>
  <div class="kpis">
   <div class="kpi"><div class="v">$${fm(t.total[0],0)} mil M</div><div class="e">Total extranjero · ${mesTxt(ult)}</div></div>
   <div class="kpi"><div class="v">${of?'$'+fm(of[0],0)+' mil M':'—'}</div><div class="e">De ellos, oficiales (bancos centrales y Estados)</div></div>
   <div class="kpi"><div class="v">${cambio(pct(t.total[0],t.total[12]))}</div><div class="e">Total frente a ${mesTxt(hace12||ult)}</div></div>
  </div>
  <div class="aviso"><b>Cómo leerlo:</b> ${t.nota}</div>
  <table><thead><tr><th>País (donde está la custodia)</th><th>${mesTxt(ult)} ($ mil M)</th><th>% del total</th><th class="hm"></th><th>vs mes ant.</th><th>vs 6 meses</th><th>vs 12 meses</th><th class="hm">13 meses</th></tr></thead><tbody>${filas}
  <tr><td class="neutro">Resto de países</td><td class="n neutro">${fm(t.otros[0])}</td><td class="n neutro">${fm(t.otros[0]/t.total[0]*100,1)} %</td><td class="hm"></td><td class="n">${cambio(pct(t.otros[0],t.otros[1]))}</td><td class="n">${cambio(pct(t.otros[0],t.otros[6]))}</td><td class="n">${cambio(pct(t.otros[0],t.otros[12]))}</td><td class="hm">${spark(t.otros.slice().reverse())}</td></tr></tbody></table>
  <p class="pie">Fuente: <a style="color:#f1d58a" href="${t.fuente}" target="_blank" rel="noopener">${t.fuente}</a>. Los valores están en miles de millones de dólares y se publican con unas 6-7 semanas de retraso. Una variación mezcla compras o ventas con cambios de valor de mercado: no es un flujo.</p></div>`;
}

const MEC={'fiat-backed':'Respaldo en dinero y letras','crypto-backed':'Respaldo en cripto','algorithmic':'Algorítmica','':'—'};
function primarias(s){
  const q=D.stablecoins_primarias; if(!q||!q.monedas) return '';
  const filas=q.monedas.map(m=>{
    const lista=(m.cadena==='XRPL'?s.xrpl:s.stellar).top.find(f=>f.simbolo===m.id);
    const ll=lista?lista.usd:null, eur=m.id.startsWith('EUR');
    const prim=m.cantidad==null?'<span class="mini">sin dato</span>':(eur?fm(m.cantidad/1e6,2)+' M€':fUSD(m.cantidad));
    const dif=(ll==null||m.cantidad==null||eur)?'<span class="mini">'+(eur?'moneda en euros: no comparable directo':'—')+'</span>':cambio((ll-m.cantidad)/m.cantidad*100);
    return `<tr><td><b>${m.id}</b> en ${m.cadena}<div class="mini">emisor ${m.emisor.slice(0,6)}…${m.emisor.slice(-4)} · <a style="color:#f1d58a" href="${m.fuente_direccion}" target="_blank" rel="noopener">dirección oficial</a></div></td>
     <td class="n">${prim} <span class="nivel P">P</span></td><td class="n">${ll==null?'—':fUSD(ll)} <span class="nivel S">S</span></td><td class="n">${dif}</td></tr>`}).join('');
  const rl=(q.contraste_emisor||{}).RLUSD;
  return `<div class="panel vidrio"><h2>Cifra en cadena frente a DefiLlama</h2>
  <p class="que">Leído en el propio ledger (XRPL <code>gateway_balances</code>, Stellar Horizon) con la dirección del emisor tomada de su web oficial · ${q.leido}. La diferencia es DefiLlama respecto a la cadena.</p>
  <table><thead><tr><th>Stablecoin</th><th>En cadena</th><th>DefiLlama</th><th>Diferencia</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="pie">${rl?`Atestación de Ripple (${rl.fecha}): ${fm(rl.total_todas_cadenas/1e6,1)} M$ de RLUSD en TODAS las cadenas, con reservas de ${fm(rl.reservas/1e6,1)} M$; no es comparable con la cifra del XRPL. <a style="color:#f1d58a" href="${rl.fuente}" target="_blank" rel="noopener">fuente</a>. `:''}${q.pendiente_verificar}</p></div>`;
}
function panelStable(){
  const s=D.stablecoins; if(!s) return '<div class="aviso">No hay datos de stablecoins. Ejecuta scripts/actualizar_paneles.py.</div>';
  const filas=s.top.map((x,i)=>`<tr class="${x.simbolo==='RLUSD'?'fila-xrp':''}"><td>${i+1}. <b>${x.simbolo}</b> <span class="mini">${x.nombre}</span></td>
   <td class="n">${fUSD(x.usd)}</td><td class="n">${fm(x.usd/s.total*100,1)} %</td><td class="n">${cambio(x.cambio_7d)}</td><td class="n">${cambio(x.cambio_30d)}</td>
   <td class="tag hm">${x.ligada==='USD'?'Dólar':x.ligada}</td><td class="tag hm">${MEC[x.mecanismo]||x.mecanismo}</td><td class="n hm">${x.n_cadenas}</td></tr>`).join('');
  const cad=(c,nombre)=>`<div class="panel vidrio"><h2>En ${nombre}</h2><p class="que">${c.n} stablecoins con saldo · total ${fUSD(c.total)}</p>
   <table><thead><tr><th>Stablecoin</th><th>Circulación</th><th>% de la cadena</th></tr></thead><tbody>${c.top.map(f=>`<tr class="${f.simbolo==='RLUSD'?'fila-xrp':''}"><td><b>${f.simbolo}</b> <span class="mini">${f.nombre}</span></td><td class="n">${fUSD(f.usd)}</td><td class="n">${fm(f.usd/c.total*100,1)} %</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="panel vidrio"><h2>Stablecoins: quién emite y cuánto circula</h2>
  <p class="que">Los 15 mayores por circulación. DefiLlama · <span class="nivel S">S</span> agregador (cifras estimadas)</p>
  <div class="kpis"><div class="kpi"><div class="v">${fUSD(s.total)}</div><div class="e">Circulación total (${s.n_activos} activos)</div></div>
   <div class="kpi"><div class="v">${fm(s.top[0].usd/s.total*100,0)} %</div><div class="e">Cuota de ${s.top[0].simbolo}</div></div>
   <div class="kpi"><div class="v">${fm((s.top[0].usd+s.top[1].usd)/s.total*100,0)} %</div><div class="e">Cuota de ${s.top[0].simbolo} + ${s.top[1].simbolo}</div></div></div>
  <table><thead><tr><th>Stablecoin</th><th>Circulación</th><th>% del total</th><th>7 días</th><th>30 días</th><th class="hm">Ligada a</th><th class="hm">Respaldo</th><th class="hm">Cadenas</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="pie">Fuente: <a style="color:#f1d58a" href="${s.fuente}" target="_blank" rel="noopener">${s.fuente}</a>. ${s.nota}</p></div>
  <div class="dos">${cad(s.xrpl,'el XRP Ledger (XRPL)')}${cad(s.stellar,'Stellar')}</div>
  ${primarias(s)}
  <div class="aviso">Contraste: el dossier de stablecoins del 9-oct leyó en el propio XRPL unos $1.140 M de RLUSD (ledger, 17-oct); DefiLlama muestra hoy ${fUSD((s.xrpl.top.find(f=>f.simbolo==='RLUSD')||{usd:0}).usd)} en XRPL. Difieren por fecha y método: no se mezclan.</div>`;
}

const DSIM={sube:['▲','#d9904a','subió'],mantiene:['▬','#8a97b0','mantuvo'],baja:['▼','#5aa9e6','bajó'],'n/d':['•','#64748b','sin dato']};
function fechaCorta(iso){ if(!iso) return '—'; const p=iso.split('-'); return p.length>=3? p[2]+'-'+MES[+p[1]-1]+'-'+p[0].slice(2) : (p[1]? MES[+p[1]-1]+'-'+p[0] : iso); }
function diasHasta(iso){ if(!iso||iso.length<10) return null; return Math.round((new Date(iso)-new Date(D.hoy))/86400000); }
let s_unidad_pct=true, s_neto=false;
function panelCredito(){
  const C=D.credito&&D.credito.series; if(!C||!C.length) return '';
  const fc=(x)=>s_neto? (x>0?'+':'')+fm(x,1)+' pp' : s_unidad_pct? fm(x,2)+' %' : fm(x,0);
  const fila=s=>{ s_unidad_pct=s.unidad==='%'; s_neto=(s.unidad||'').startsWith('% neto'); return `<tr><td>${esc(s.nombre)}${s.expectativa!=null?`<br><small style="color:#8a97b0">Expectativa de los bancos, próximo trimestre: ${fc(s.expectativa)}</small>`:''}</td><td>${esc(s.pais)}</td><td class="n"><b>${fc(s.valor)}</b></td><td class="n">${s.anterior==null?'—':fc(s.anterior)}</td><td class="n">${s.hace_12m==null?'—':fc(s.hace_12m)}</td><td>${s.serie&&s.serie.length>2?spark(s.serie):''}</td><td class="n">${esc(s.fecha)}</td></tr>`;};
  return `<div class="panel vidrio"><h2>Euríbor, hipotecas y crédito (zona euro, España, EE. UU., Reino Unido y Japón)</h2><p class="que">Lo que pagan hogares y empresas por endeudarse y cuánto crece el crédito · BCE, Freddie Mac, Banco de Inglaterra, Reserva Federal y Banco de Japón · <span class="nivel P">P</span> primaria, mensual</p>
   <div style="overflow-x:auto"><table><thead><tr><th>Serie</th><th>Zona</th><th>Último</th><th>Mes anterior</th><th>Hace 12 meses</th><th>13 meses</th><th>Mes</th></tr></thead><tbody>${C.map(fila).join('')}</tbody></table></div>
   <div class="aviso"><b>Cómo leerlo:</b> las filas «BLS» son la encuesta trimestral del BCE a los bancos (pp = puntos porcentuales netos): un % neto positivo en criterios significa que más bancos endurecen que relajan la concesión de crédito (cuanto mayor, más restrictivo); en demanda, positivo significa que más bancos la ven subir que bajar. Cuenta bancos, no euros prestados, y es una opinión de los bancos, no un saldo. España es un % sin ponderar con pocos bancos: más ruido. La TAE incluye comisiones y gastos obligatorios; el tipo pactado no. El euríbor es una media mensual y las hipotecas nuevas se fijan con meses de retraso sobre él. El crédito es la variación a 12 meses del saldo concedido por bancos. Datos sin ajustar; no son una recomendación.</div>
   <p class="pie">Leído el ${D.leido}. Fuentes: <a style="color:#f1d58a" href="${D.credito.fuente}" target="_blank" rel="noopener">BCE (Data Portal)</a>: tablas FM, MIR y BSI; Freddie Mac (encuesta semanal PMMS); Banco de Inglaterra (series IUMBV34 y LPMVTVX); Reserva Federal, estadística H.8 (copia en FRED, cotejada con federalreserve.gov/releases/h8: saldos desestacionalizados, miles de millones de $); Encuesta de préstamos bancarios del BCE (BLS, dataflow BLS de la API SDMX: claves Q.U2.ALL.[O.E.Z | Z.H.H | Z.H.C].[B3 = últimos 3 meses | F3 = expectativa].[ST.S = criterios | ZZ.D = demanda]; zona euro ponderada WFNET, España sin ponderar FNET; última ronda publicada el 27-oct-2026); Banco de Japón (API oficial, base BS02, préstamos y descuentos de bancos con licencia, miles de millones de ¥, fin de mes). Los saldos de EE. UU. y Japón están en su moneda y no son comparables entre sí. Freddie Mac y las aprobaciones del Banco de Inglaterra no son comparables al decimal con la TAE del BCE: cada una mide algo distinto.</p></div>`;
}
function panelTipos(){
  const t=D.tipos||[]; if(!t.length) return '<div class="aviso">No hay datos de tipos.</div>';
  const sub=t.filter(x=>x.dir==='sube').length, baj=t.filter(x=>x.dir==='baja').length, man=t.filter(x=>x.dir==='mantiene').length;
  const prox=t.filter(x=>diasHasta(x.proxima)!=null&&diasHasta(x.proxima)>=0).sort((a,b)=>diasHasta(a.proxima)-diasHasta(b.proxima))[0];
  const filas=t.map(x=>{ const s=DSIM[x.dir]||DSIM['n/d'], d=diasHasta(x.proxima);
    return `<tr title="${x.estado.replace(/"/g,'&quot;')}"><td>${x.pais}</td><td class="n"><b>${x.valor}</b></td><td style="color:${s[1]}">${s[0]} ${s[2]}</td>
    <td class="n">${fechaCorta(x.fecha)}</td><td class="n">${x.proxima? fechaCorta(x.proxima)+(d!=null&&d>=0?` <span class="mini">(en ${d} d)</span>`:` <span class="mini" style="color:#ffb15c" title="La reunión prevista ya pasó y el radar no se ha actualizado: comprobarla en la fuente del banco central">⚠ pasó: revisar</span>`):'—'}</td>
    <td><span class="nivel ${x.nivel==='P'?'P':'S'}">${x.nivel==='P'?'P':'S'}</span></td><td class="tag hm" style="white-space:normal;max-width:420px">${x.estado.length>150? x.estado.slice(0,150)+'…':x.estado}</td></tr>`; }).join('');
  const V=(D.tipos_vivos&&D.tipos_vivos.paises)||[];
  const vivos=V.length? `<div class="panel vidrio"><h2>Tipos al día (automático)</h2>
   <p class="que">Leídos de la fuente oficial de cada banco central cada día laborable · <span class="nivel P">P</span> primaria · si no coincide con el radar, el radar está desactualizado</p>
   <table><thead><tr><th>País</th><th>Banco</th><th>Tipo</th><th>Último cambio</th><th>Radar</th><th class="hm">Fuente</th></tr></thead><tbody>${V.map(x=>`<tr><td>${x.pais}</td><td>${x.banco}</td><td class="n"><b>${x.valor}</b></td>
   <td class="n">${x.ultimo_cambio? fechaCorta(x.ultimo_cambio)+(x.cambio_pb!=null?` <span class="mini">(${x.cambio_pb>0?'+':''}${x.cambio_pb} pb)</span>`:''):'—'}</td>
   <td>${x.coincide_radar===true?'<span style="color:#7ee0a1">✓ coincide</span>':x.coincide_radar===false?`<span style="color:#ffb15c" title="El radar dice: ${esc(x.radar)}">⚠ el radar dice ${esc(x.radar)}</span>`:'<span class="mini">no está en el radar</span>'}</td>
   <td class="tag hm"><a style="color:#f1d58a" href="${x.url}" target="_blank" rel="noopener">${esc(x.fuente)}</a></td></tr>`).join('')}</tbody></table>
   <p class="pie">Leído el ${D.leido}. ${D.tipos_vivos.nota} Los demás países (Corea, Japón, China, India, Rusia…) no tienen una fuente abierta fácil de leer sin navegador y se mantienen a mano en el radar.</p></div>`:'';

const PL_BONOS=['3M','1A','2A','3A','5A','10A','15A','20A','30A'];
const COL_BONOS={ESP:'#f1d58a',FRA:'#6cb4ff',USA:'#5fd0a0',JPN:'#f08a7a',EUR:'#b8a1ff',GBR:'#aab4c8'};
let bonosOff=new Set(['GBR']);
function curvaBonos(paises){
  const W=640,H=270,ml=44,mr=14,mt=12,mb=30;
  const vis=paises.filter(p=>!bonosOff.has(p.id));
  const vals=vis.flatMap(p=>PL_BONOS.map(k=>p.plazos[k]).filter(v=>v!=null));
  if(!vals.length) return '<p class="mini">Activa algún país.</p>';
  const mn=Math.floor(Math.min(...vals)*2-0.5)/2, mx=Math.ceil(Math.max(...vals)*2+0.5)/2;
  const X=i=>ml+i*(W-ml-mr)/(PL_BONOS.length-1), Y=v=>mt+(1-(v-mn)/(mx-mn))*(H-mt-mb);
  let g='';
  for(let v=mn;v<=mx+1e-9;v+=0.5){ g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(148,163,184,.14)"/><text x="${ml-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#93a1bd">${fm(v,1)}</text>`; }
  PL_BONOS.forEach((k,i)=>{ g+=`<text x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#93a1bd">${k.replace('A',' a.').replace('M',' m')}</text>`; });
  vis.forEach(p=>{
    const pts=PL_BONOS.map((k,i)=>p.plazos[k]!=null?[X(i),Y(p.plazos[k]),k,p.plazos[k]]:null).filter(Boolean);
    const c=COL_BONOS[p.id]||'#fff';
    if(pts.length>1) g+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/>`;
    pts.forEach(q=>{ g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.6" fill="${c}"><title>${esc(p.nombre)} · ${q[2]}: ${fm(q[3],2)} % (${fechaCorta(p.fecha)})</title></circle>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:720px" role="img" aria-label="Curvas de rendimientos por plazo">${g}</svg>`;
}

let grupoPa='UE';

function nfp(v,u){ if(v==null) return '—'; const n=Number(v).toLocaleString('es-ES',{maximumFractionDigits:2}), m=/^([$£€¥])\s*(.*)$/.exec(u||''); return m? m[1]+n+(m[2]?' '+m[2]:'') : n+(u?' '+u:''); }

function panelEnergia(){

  const barras=M.map(m=>`<div style="display:grid;grid-template-columns:70px 1fr 120px;gap:8px;align-items:center;margin:5px 0"><span class="mini">${esc(m.mes)}${m.dias<28?' ('+m.dias+' d)':''}</span><div style="background:#ffffff14;border-radius:5px;height:9px"><div style="background:#e8913a;height:9px;border-radius:5px;width:${Math.max(2,m.total/mx*100)}%"></div></div><span class="n">${fm(m.total)} barcos/día <span class="mini">(${fm(m.petroleros)} petroleros)</span></span></div>`).join('');
  const u=O.ultimo||{};
  const hit=(HP.hitos||[]).slice().reverse().map(h=>`<tr><td class="n">${esc(h.fecha)}</td><td>${esc(h.hecho)}<div class="mini">${esc(h.lectura||'')}</div></td><td class="n">${h.brent?fm(h.brent[0])+' → '+fm(h.brent[1]):'—'}</td><td class="tag"><span class="nivel ${h.nivel}">${h.nivel}</span></td></tr>`).join('');
  return `<p class="que">Tráfico por el estrecho de Ormuz (IMF PortWatch [P]) y los hitos que movieron el petróleo. Febrero de 2026, antes del cierre: ~78 barcos al día.</p>
  <div class="mini" style="border:1px solid #e8913a;border-radius:8px;padding:8px 10px;margin:8px 0">⚠ Los barcos de PortWatch (señal AIS) NO equivalen a barriles. La AIE da <b>10,9 mb/d</b> por el estrecho en septiembre [P, OMR del 14-oct], pero PortWatch cuenta solo ~1,1 petroleros al día: no miden lo mismo (la AIE estima volúmenes; PortWatch cuenta barcos que se ven). Método de la AIE: [VERIFICAR].</div>
  <div class="kpis"><div class="kpi"><div class="v">${fm(O.media_7d)}</div><div class="e">barcos/día, media 7 días a ${esc(u.fecha||'')}</div></div><div class="kpi"><div class="v">${esc(u.total==null?'—':u.total)}</div><div class="e">barcos el ${esc(u.fecha||'')} (${esc(u.petroleros==null?'—':u.petroleros)} petroleros)</div></div></div>
  <h3>Media diaria por mes</h3>${barras}
  <h3>Hitos del petróleo (Brent, $)</h3><div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Qué pasó</th><th>Brent</th><th>Nivel</th></tr></thead><tbody>${hit}</tbody></table></div><p class="mini">${esc(HP.nota||'')}</p>`;
}
function panelElecciones(){
  const E=(D.elecciones||{}).paises||[], hoy=new Date();
  const L=E.slice().sort((a,b)=>(a.fecha||'9999').localeCompare(b.fecha||'9999'));
  const fila=x=>{const d=x.fecha&&/^\d{4}-\d{2}-\d{2}$/.test(x.fecha)?Math.round((new Date(x.fecha)-hoy)/864e5):null;
    return `<tr><td><b>${esc(x.pais)}</b><div class="mini">${esc(x.tipo||'')}</div></td><td class="n">${esc(x.fecha||'sin fecha fija')}<div class="mini">${d==null?'':d>=0?'en '+d+' días':'hace '+(-d)+' días'}</div></td><td>${esc(x.hechos||'')}<div class="mini" style="margin-top:3px"><b>Efecto posible:</b> ${esc(x.efecto||'')}</div></td><td class="tag"><span class="nivel ${x.nivel}">${x.nivel}</span> ${x.fuente?`<a style="color:#f1d58a" href="${esc(x.fuente)}" target="_blank" rel="noopener">fuente</a>`:''}</td></tr>`;};
  return `<p class="que">${esc((D.elecciones||{}).nota||'')} Ordenadas por fecha; las pasadas y las sin fecha fija al final de su fecha. Las lecturas de efecto son [ESPECULACIÓN].</p><div style="overflow-x:auto"><table><thead><tr><th>País</th><th>Fecha</th><th>Situación</th><th>Fuente</th></tr></thead><tbody>${L.map(fila).join('')}</tbody></table></div>`;
}

 rwa:['Activos tokenizados (RWA)','DefiLlama (protocolos)','diaria','Cuánto valor hay en DeFi ligado a activos reales; no es el total tokenizado.'],
 mercado:['Cripto: BTC, ETH, XRP, XLM','CoinGecko','diaria','Precio de tus activos y de las referencias.'],
 deuda:['Deuda pública','FMI (cifras manuales en deuda-fmi.json) y rendimientos del Tesoro, BCE, Japón y Banco de Inglaterra','diaria / anual','Cuánto debe cada país y cuánto paga por ello.'],
 bonos:['Bonos y curvas','Tesoro de EE. UU., BCE, Banco de España, Japón, Banco de Inglaterra y cifras manuales de subastas','diaria','Qué rendimiento exige el mercado por plazo.'],
 indices:['Bolsas','Yahoo Finance','diaria','Cómo cierran las bolsas del mundo y la volatilidad (VIX).'],
 materias:['Materias primas','Yahoo Finance (futuros, no oficial) + EIA (Brent y Henry Hub spot, oficial)','diaria','Oro, cobre, gas y cereales (futuros, [S]) más Brent y Henry Hub spot diarios de la EIA ([P], sin clave; se publican con unos días de retraso y no son comparables con el futuro).'],

 tipos_bis:['Tipos de bancos centrales','BIS (data.bis.org)','mensual','Tipos de más países, de una fuente única.'],

 espana_deuda:['España: deuda por comunidades','Banco de España (PDE be1101 y be1309)','trimestral','Deuda de las Administraciones Públicas y de cada comunidad autónoma; pestaña España.'],
 espana_hipotecas:['España: hipotecas sobre viviendas','INE (API Tempus, HPT)','mensual, ~2,5 meses de retraso','Número, importe y tipo medio de las hipotecas constituidas; pestaña España.'],

 indicadores:['Indicadores por país','Eurostat, Banco Mundial y FMI','mensual / anual','Paro, PIB, deuda, déficit y desigualdad.'],

function panelProcedencia(){
  const filas=Object.keys(PROC).map(k=>{const p=PROC[k], x=D[k]||{}; const n=x.nivel; return `<tr><td><b>${esc(p[0])}</b></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td><td>${n?`<span class="nivel ${n==='P'?'P':'S'}">${n==='P'?'P':'S'}</span>`:'<span class="mini">mixto</span>'}</td><td class="n">${esc(x.leido||'—')}</td><td class="tag" style="white-space:normal">${esc(p[3])}</td></tr>`;}).join('');
  return `<div class="panel vidrio"><h2>De dónde sale cada panel</h2><p class="que">Cada cifra viene de una fuente abierta, sin IA y sin claves. Un proceso automático la descarga (lunes a viernes a las 21:30 UTC, tras el cierre de EE. UU.) con el script <code>scripts/actualizar_paneles.py</code> y la guarda en <code>explorador/paneles.json</code>. Si una fuente falla, se conserva el dato anterior y la fecha de «Leído» lo delata.</p>
   <div style="overflow-x:auto"><table><thead><tr><th>Panel</th><th>Fuente</th><th>Cadencia</th><th>Nivel</th><th>Leído</th><th>Para qué sirve</th></tr></thead><tbody>${filas}</tbody></table></div>
   <div class="aviso"><b>[P]</b> = organismo oficial o dato primario. <b>[S]</b> = agregador o web no oficial: útil, pero hay que contrastarlo. Ningún panel es una recomendación. Lo que sale en rojo en el Seguimiento («Última lectura de datos») es esta tabla con la fecha vieja.</div></div>`;
}
const PEST=[['tic','Deuda de EE. UU.',panelTIC],['deuda','Deuda pública',panelDeuda],['bonos','Bonos y curvas',panelBonos],['bancos','Deuda por banco',panelBancos],['reservas','Reservas y bancos centrales',panelReservas],['stable','Stablecoins',panelStable],['tipos','Tipos de interés',panelTipos],['infl','Inflación',panelInflacion],['rwa','Mercado y RWA',panelMercadoRWA],['paises','Países',panelPaises],['elec','Elecciones',panelElecciones],['ener','Energía y Ormuz',panelEnergia],['proc','De dónde sale',panelProcedencia],['glo','Glosario',panelGlosario]];
let act=PEST[0][0];
function pinta(){
  document.getElementById('pest').innerHTML=PEST.map(p=>`<button class="chip ${p[0]===act?'on':''}" data-k="${p[0]}">${p[1]}</button>`).join('')+'<span class="mini" style="align-self:center;margin-left:8px">Próximos: deuda por país · CBDC y redes</span>';
  document.getElementById('cont').innerHTML=PEST.find(p=>p[0]===act)[2]();
  document.querySelectorAll('[data-grpa]').forEach(b=>b.onclick=()=>{grupoPa=b.dataset.grpa; pinta();});
  document.querySelectorAll('[data-banpais]').forEach(b=>b.onclick=()=>{banPais=b.dataset.banpais; banTodos=false; banSel=null; pinta();});
  document.querySelectorAll('tr[data-lei]').forEach(r=>r.onclick=()=>{banSel=banSel===r.dataset.lei?null:r.dataset.lei; pinta();});
  const bq=document.getElementById('banq'); if(bq) bq.oninput=()=>{banQ=bq.value; banSel=null; const pos=bq.selectionStart; pinta(); const n=document.getElementById('banq'); n.focus(); n.setSelectionRange(pos,pos);};
  const bo=document.getElementById('banord'); if(bo) bo.onchange=()=>{banOrden=bo.value; pinta();};
  const bt=document.getElementById('bantodos'); if(bt) bt.onclick=()=>{banTodos=!banTodos; pinta();};
  document.querySelectorAll('[data-bono]').forEach(b=>b.onclick=()=>{const k=b.dataset.bono; bonosOff.has(k)?bonosOff.delete(k):bonosOff.add(k); pinta();});
  const q=document.getElementById('glq'), c=document.getElementById('glc');
  if(q){ q.oninput=()=>{glQ=q.value; const pos=q.selectionStart; pinta(); const n=document.getElementById('glq'); n.focus(); n.setSelectionRange(pos,pos);}; }
  if(c){ c.onchange=()=>{glC=c.value; pinta();}; }
  document.querySelectorAll('#pest .chip').forEach(b=>b.onclick=()=>{act=b.dataset.k;pinta();});
}
/* desplegables con datos: siempre abiertos al pintar; los de explicación («Cómo se lee», «En qué se basa») siguen plegados */
(function(){const ab=n=>{if(n.nodeType!==1)return;if(n.matches('details:not(.mas)')&&!n.dataset.auto){n.open=true;n.dataset.auto='1'}n.querySelectorAll('details:not(.mas):not([data-auto])').forEach(d=>{d.open=true;d.dataset.auto='1'})};
new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(ab))).observe(document.body,{childList:true,subtree:true});ab(document.body)})();
pinta();
