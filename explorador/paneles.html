<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--linea:rgba(148,163,184,.16);--texto:#e6ebf5;--suave:#93a1bd;--oro:#d4a84b;--sube:#5fd0a0;--baja:#f08a7a}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{padding:4px 6px 14px;display:flex;flex-direction:column;gap:10px}
.vidrio{background:rgba(9,14,30,.5);border:1px solid rgba(148,163,184,.12);border-radius:10px;backdrop-filter:blur(8px)}
h1{margin:2px 4px 0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c8d3ea;font-weight:600}
#sub{margin:0 4px;color:var(--suave);font-size:12px}
.pestanas{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px}
.chip{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--oro);color:#fff}
.chip.on{border-color:var(--oro);background:rgba(212,168,75,.14);color:#f1d58a}
.panel{padding:12px 14px}
.panel h2{margin:0 0 2px;font-size:16px;color:#f1d58a}
.panel .que{margin:0 0 8px;color:var(--suave);font-size:12.5px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.kpi{border:1px solid var(--linea);border-radius:8px;padding:6px 12px;background:rgba(15,23,42,.6);min-width:150px}
.kpi .v{font-size:19px;font-weight:700;color:#f1d58a}
.kpi .e{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.aviso{border:1px solid rgba(212,168,75,.4);background:rgba(212,168,75,.08);border-radius:8px;padding:8px 12px;font-size:12.5px;color:#e9d9ad;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);text-align:right;padding:5px 8px;border-bottom:1px solid var(--linea);font-weight:600;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:5px 8px;border-bottom:1px solid rgba(148,163,184,.08);text-align:right;white-space:nowrap}
tr:hover td{background:rgba(212,168,75,.06)}
td.n{font-variant-numeric:tabular-nums}
.sube{color:var(--sube)}.baja{color:var(--baja)}.neutro{color:var(--suave)}
.barra{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(90deg,#d4a84b,#f1d58a);vertical-align:middle}
.nivel{padding:0 6px;border-radius:4px;font-weight:700;font-size:11px;border:1px solid;display:inline-block}
.nivel.P{color:#5fd0a0;border-color:#5fd0a0}.nivel.S{color:#f1d58a;border-color:#d4a84b}
.pie{margin-top:8px;color:var(--suave);font-size:11.5px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.dos{grid-template-columns:1fr}.panel{padding:10px;overflow-x:auto}.dos>.panel{min-width:0}table{font-size:12px}th,td{padding:4px 5px}.hm{display:none}}
.sel{background:rgba(212,168,75,.1)}
td.tag{color:var(--suave);font-size:11.5px;text-align:left}
.mini{font-size:11.5px;color:var(--suave)}
svg.spark{vertical-align:middle}
.fila-xrp td{color:#f1d58a;font-weight:600}
.pto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.gl-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.gl-barra input{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:6px 10px;font:inherit;min-width:220px}
.gl-barra select{background:rgba(15,23,42,.9);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:6px 8px;font:inherit}
.gl{border-bottom:1px solid rgba(148,163,184,.1);padding:7px 2px}
.gl summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.gl summary b{color:#f1d58a}
.gl p{margin:6px 0 2px;color:var(--texto);font-size:13px}
.etq{font-size:10.5px;padding:0 6px;border-radius:4px;border:1px solid var(--linea);color:var(--suave)}
.etq.v{color:#f08a7a;border-color:#f08a7a}
</style></head><body>
<div id="app">
 <h1>Paneles de datos</h1>
 <p id="sub"></p>
 <div class="pestanas vidrio" id="pest"></div>
 <div id="cont"></div>
</div>
<script type="application/json" id="datos">__DATOS__</script>
<script>
const D = JSON.parse(document.getElementById('datos').textContent);
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fm = (v,d=1)=> v==null? '—' : v.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});
const mesTxt = m => { const [a,b]=m.split('-'); return MES[+b-1]+'-'+a; };
const fUSD = v => v>=2e9? '$'+fm(v/1e9,1)+' mil M' : v>=1e6? '$'+fm(v/1e6,0)+' M' : '$'+fm(v/1e3,0)+' mil';
function pct(a,b){ return (a==null||b==null||!b)? null : (a/b-1)*100; }
function cambio(p){
  if(p==null) return '<span class="neutro">—</span>';
  const c = Math.abs(p)<0.05? 'neutro' : p>0? 'sube':'baja';
  return `<span class="${c}">${p>0?'+':''}${fm(p,1)} %</span>`;
}
function spark(serie, w=110, h=22){        // serie del más antiguo al más reciente
  const mn=Math.min(...serie), mx=Math.max(...serie), r=(mx-mn)||1;
  const pts=serie.map((v,i)=>`${(i/(serie.length-1)*(w-4)+2).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' ');
  const ult=serie[serie.length-1], pri=serie[0], col=ult>=pri?'#5fd0a0':'#f08a7a';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts}"/></svg>`;
}
document.getElementById('sub').textContent = 'Datos abiertos leídos el '+D.leido+'. Cada cifra lleva su fuente, su fecha y su nivel: [P] primaria, [S] secundaria.';

function panelTIC(){
  const t=D.tic; if(!t) return '<div class="aviso">No hay datos de la tabla TIC. Ejecuta scripts/actualizar_paneles.py.</div>';
  const n=t.meses.length, ult=t.meses[0], hace12=t.meses[12]??null, hace6=t.meses[6]??null, hace1=t.meses[1];
  const maxV=Math.max(...t.paises.map(p=>p.serie[0]));
  const filas=t.paises.map((p,i)=>{
    const s=p.serie;
    return `<tr><td>${i+1}. ${p.nombre}</td><td class="n">${fm(s[0])}</td><td class="n">${fm(s[0]/t.total[0]*100,1)} %</td>
    <td class="hm"><span class="barra" style="width:${(s[0]/maxV*90).toFixed(0)}px"></span></td>
    <td class="n">${cambio(pct(s[0],s[1]))}</td><td class="n">${cambio(pct(s[0],s[6]))}</td><td class="n">${cambio(pct(s[0],s[12]))}</td>
    <td class="hm">${spark(s.slice().reverse())}</td></tr>`;
  }).join('');
  const of=t.oficial;
  return `<div class="panel vidrio"><h2>¿Quién tiene deuda de EE. UU.?</h2>
  <p class="que">Mayores tenedores extranjeros de bonos y letras del Tesoro de EE. UU. Fuente: Tesoro de EE. UU., sistema TIC, tabla 5 · último mes: <b>${mesTxt(ult)}</b> · <span class="nivel P">P</span> fuente primaria</p>
  <div class="kpis">
   <div class="kpi"><div class="v">$${fm(t.total[0],0)} mil M</div><div class="e">Total extranjero · ${mesTxt(ult)}</div></div>
   <div class="kpi"><div class="v">${of?'$'+fm(of[0],0)+' mil M':'—'}</div><div class="e">De ellos, oficiales (bancos centrales y Estados)</div></div>
   <div class="kpi"><div class="v">${cambio(pct(t.total[0],t.total[12]))}</div><div class="e">Total frente a ${mesTxt(hace12||ult)}</div></div>
  </div>
  <div class="aviso"><b>Cómo leerlo:</b> ${t.nota}</div>
  <table><thead><tr><th>País (donde está la custodia)</th><th>${mesTxt(ult)} ($ mil M)</th><th>% del total</th><th class="hm"></th><th>vs mes ant.</th><th>vs 6 meses</th><th>vs 12 meses</th><th class="hm">13 meses</th></tr></thead><tbody>${filas}
  <tr><td class="neutro">Resto de países</td><td class="n neutro">${fm(t.otros[0])}</td><td class="n neutro">${fm(t.otros[0]/t.total[0]*100,1)} %</td><td class="hm"></td><td class="n">${cambio(pct(t.otros[0],t.otros[1]))}</td><td class="n">${cambio(pct(t.otros[0],t.otros[6]))}</td><td class="n">${cambio(pct(t.otros[0],t.otros[12]))}</td><td class="hm">${spark(t.otros.slice().reverse())}</td></tr></tbody></table>
  <p class="pie">Fuente: <a style="color:#f1d58a" href="${t.fuente}" target="_blank" rel="noopener">${t.fuente}</a>. Los valores están en miles de millones de dólares y se publican con unas 6-7 semanas de retraso. Una variación mezcla compras o ventas con cambios de valor de mercado: no es un flujo.</p></div>`;
}

const MEC={'fiat-backed':'Respaldo en dinero y letras','crypto-backed':'Respaldo en cripto','algorithmic':'Algorítmica','':'—'};
function panelStable(){
  const s=D.stablecoins; if(!s) return '<div class="aviso">No hay datos de stablecoins. Ejecuta scripts/actualizar_paneles.py.</div>';
  const filas=s.top.map((x,i)=>`<tr class="${x.simbolo==='RLUSD'?'fila-xrp':''}"><td>${i+1}. <b>${x.simbolo}</b> <span class="mini">${x.nombre}</span></td>
   <td class="n">${fUSD(x.usd)}</td><td class="n">${fm(x.usd/s.total*100,1)} %</td><td class="n">${cambio(x.cambio_7d)}</td><td class="n">${cambio(x.cambio_30d)}</td>
   <td class="tag hm">${x.ligada==='USD'?'Dólar':x.ligada}</td><td class="tag hm">${MEC[x.mecanismo]||x.mecanismo}</td><td class="n hm">${x.n_cadenas}</td></tr>`).join('');
  const cad=(c,nombre)=>`<div class="panel vidrio"><h2>En ${nombre}</h2><p class="que">${c.n} stablecoins con saldo · total ${fUSD(c.total)}</p>
   <table><thead><tr><th>Stablecoin</th><th>Circulación</th><th>% de la cadena</th></tr></thead><tbody>${c.top.map(f=>`<tr class="${f.simbolo==='RLUSD'?'fila-xrp':''}"><td><b>${f.simbolo}</b> <span class="mini">${f.nombre}</span></td><td class="n">${fUSD(f.usd)}</td><td class="n">${fm(f.usd/c.total*100,1)} %</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="panel vidrio"><h2>Stablecoins: quién emite y cuánto circula</h2>
  <p class="que">Los 15 mayores por circulación. DefiLlama · <span class="nivel S">S</span> agregador (cifras estimadas)</p>
  <div class="kpis"><div class="kpi"><div class="v">${fUSD(s.total)}</div><div class="e">Circulación total (${s.n_activos} activos)</div></div>
   <div class="kpi"><div class="v">${fm(s.top[0].usd/s.total*100,0)} %</div><div class="e">Cuota de ${s.top[0].simbolo}</div></div>
   <div class="kpi"><div class="v">${fm((s.top[0].usd+s.top[1].usd)/s.total*100,0)} %</div><div class="e">Cuota de ${s.top[0].simbolo} + ${s.top[1].simbolo}</div></div></div>
  <table><thead><tr><th>Stablecoin</th><th>Circulación</th><th>% del total</th><th>7 días</th><th>30 días</th><th class="hm">Ligada a</th><th class="hm">Respaldo</th><th class="hm">Cadenas</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="pie">Fuente: <a style="color:#f1d58a" href="${s.fuente}" target="_blank" rel="noopener">${s.fuente}</a>. ${s.nota}</p></div>
  <div class="dos">${cad(s.xrpl,'el XRP Ledger (XRPL)')}${cad(s.stellar,'Stellar')}</div>
  <div class="aviso">Contraste: el dossier de stablecoins del 9-oct leyó en el propio XRPL unos $1.140 M de RLUSD (ledger, 17-oct); DefiLlama muestra hoy ${fUSD((s.xrpl.top.find(f=>f.simbolo==='RLUSD')||{usd:0}).usd)} en XRPL. Difieren por fecha y método: no se mezclan.</div>`;
}

const DSIM={sube:['▲','#d9904a','subió'],mantiene:['▬','#8a97b0','mantuvo'],baja:['▼','#5aa9e6','bajó'],'n/d':['•','#64748b','sin dato']};
function fechaCorta(iso){ if(!iso) return '—'; const p=iso.split('-'); return p.length>=3? p[2]+'-'+MES[+p[1]-1]+'-'+p[0].slice(2) : (p[1]? MES[+p[1]-1]+'-'+p[0] : iso); }
function diasHasta(iso){ if(!iso||iso.length<10) return null; return Math.round((new Date(iso)-new Date(D.hoy))/86400000); }
function panelTipos(){
  const t=D.tipos||[]; if(!t.length) return '<div class="aviso">No hay datos de tipos.</div>';
  const sub=t.filter(x=>x.dir==='sube').length, baj=t.filter(x=>x.dir==='baja').length, man=t.filter(x=>x.dir==='mantiene').length;
  const prox=t.filter(x=>diasHasta(x.proxima)!=null&&diasHasta(x.proxima)>=0).sort((a,b)=>diasHasta(a.proxima)-diasHasta(b.proxima))[0];
  const filas=t.map(x=>{ const s=DSIM[x.dir]||DSIM['n/d'], d=diasHasta(x.proxima);
    return `<tr title="${x.estado.replace(/"/g,'&quot;')}"><td>${x.pais}</td><td class="n"><b>${x.valor}</b></td><td style="color:${s[1]}">${s[0]} ${s[2]}</td>
    <td class="n">${fechaCorta(x.fecha)}</td><td class="n">${x.proxima? fechaCorta(x.proxima)+(d!=null&&d>=0?` <span class="mini">(en ${d} d)</span>`:` <span class="mini" style="color:#ffb15c" title="La reunión prevista ya pasó y el radar no se ha actualizado: comprobarla en la fuente del banco central">⚠ pasó: revisar</span>`):'—'}</td>
    <td><span class="nivel ${x.nivel==='P'?'P':'S'}">${x.nivel==='P'?'P':'S'}</span></td><td class="tag hm" style="white-space:normal;max-width:420px">${x.estado.length>150? x.estado.slice(0,150)+'…':x.estado}</td></tr>`; }).join('');
  const V=(D.tipos_vivos&&D.tipos_vivos.paises)||[];
  const vivos=V.length? `<div class="panel vidrio"><h2>Tipos al día (automático)</h2>
   <p class="que">Leídos de la fuente oficial de cada banco central cada día laborable · <span class="nivel P">P</span> primaria · si no coincide con el radar, el radar está desactualizado</p>
   <table><thead><tr><th>País</th><th>Banco</th><th>Tipo</th><th>Último cambio</th><th>Radar</th><th class="hm">Fuente</th></tr></thead><tbody>${V.map(x=>`<tr><td>${x.pais}</td><td>${x.banco}</td><td class="n"><b>${x.valor}</b></td>
   <td class="n">${x.ultimo_cambio? fechaCorta(x.ultimo_cambio)+(x.cambio_pb!=null?` <span class="mini">(${x.cambio_pb>0?'+':''}${x.cambio_pb} pb)</span>`:''):'—'}</td>
   <td>${x.coincide_radar===true?'<span style="color:#7ee0a1">✓ coincide</span>':x.coincide_radar===false?`<span style="color:#ffb15c" title="El radar dice: ${esc(x.radar)}">⚠ el radar dice ${esc(x.radar)}</span>`:'<span class="mini">no está en el radar</span>'}</td>
   <td class="tag hm"><a style="color:#f1d58a" href="${x.url}" target="_blank" rel="noopener">${esc(x.fuente)}</a></td></tr>`).join('')}</tbody></table>
   <p class="pie">Leído el ${D.leido}. ${D.tipos_vivos.nota} Los demás países (Corea, Japón, China, India, Rusia…) no tienen una fuente abierta fácil de leer sin navegador y se mantienen a mano en el radar.</p></div>`:'';
  return vivos+`<div class="panel vidrio"><h2>Tipos de interés de los bancos centrales</h2>
  <p class="que">Último tipo oficial y último movimiento (▲ subió · ▬ mantuvo · ▼ bajó) · vienen de la columna «política monetaria» del radar regulatorio, ya verificada allí</p>
  <div class="kpis"><div class="kpi"><div class="v">${sub} de ${t.length}</div><div class="e">Subieron tipos en su último movimiento</div></div>
   <div class="kpi"><div class="v">${man}</div><div class="e">Mantuvieron</div></div><div class="kpi"><div class="v">${baj}</div><div class="e">Bajaron</div></div>
   ${prox?`<div class="kpi"><div class="v">${prox.pais}</div><div class="e">Próxima reunión: ${fechaCorta(prox.proxima)} (en ${diasHasta(prox.proxima)} d)</div></div>`:''}</div>
  <div class="aviso">Los tipos no son comparables entre sí sin la inflación de cada país: este panel muestra el nivel y el movimiento, no si el tipo es «alto» o «bajo». Singapur gestiona una banda de tipo de cambio (no un tipo) y China publica el LPR. Pasa el ratón por una fila para ver el detalle completo.</div>
  <table><thead><tr><th>País</th><th>Tipo</th><th>Último mov.</th><th title="Fecha de la información en el radar, no la del movimiento: la del movimiento está en «Qué pasó»">Dato de</th><th>Próxima reunión</th><th></th><th class="hm">Qué pasó</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="pie">Fuente: radar regulatorio (explorador/regulacion.json), con sus informes y su etiqueta [P]/[S] por país. Fechas de reunión según el calendario del repo y las notas de cada banco; algunas son aproximadas [VERIFICAR].</p></div>`;
}

const fPrecio = v => v>=1000? '$'+fm(v,0) : v>=1? '$'+fm(v,2) : '$'+fm(v,4);
function panelMercadoRWA(){
  const m=D.mercado, r=D.rwa; if(!m&&!r) return '<div class="aviso">No hay datos. Ejecuta scripts/actualizar_paneles.py.</div>';
  const mer = m? `<div class="panel vidrio"><h2>Mercado de digital assets (BTC, ETH, XRP y XLM)</h2><p class="que">Precio, capitalización y variación en 24 h · CoinGecko · <span class="nivel S">S</span> agregador</p>
   <table><thead><tr><th>Activo</th><th>Precio</th><th>Capitalización</th><th>24 h</th></tr></thead><tbody>${m.activos.map(a=>`<tr class="${a.simbolo==='XRP'||a.simbolo==='XLM'?'fila-xrp':''}"><td><b>${a.simbolo}</b> <span class="mini">${a.nombre}</span></td><td class="n">${fPrecio(a.precio)}</td><td class="n">${fUSD(a.capitalizacion)}</td><td class="n">${cambio(a.cambio_24h)}</td></tr>`).join('')}</tbody></table>
   <p class="pie">Leído el ${D.leido}. Fuente: <a style="color:#f1d58a" href="${m.fuente}" target="_blank" rel="noopener">CoinGecko</a>.</p></div>` : '';
  const I=D.indices&&D.indices.indices;
  const ind = I&&I.length? `<div class="panel vidrio"><h2>Bolsas: cuatro índices</h2><p class="que">Último cierre diario y variación frente al cierre anterior · Yahoo Finance · <span class="nivel S">S</span> no oficial; si falla, se conserva el dato anterior</p>
   <table><thead><tr><th>Índice</th><th>Zona</th><th>Cierre</th><th>1 día</th><th>Fecha</th></tr></thead><tbody>${I.map(i=>`<tr><td><b>${i.nombre}</b></td><td>${i.zona}</td><td class="n">${fm(i.valor,0)}</td><td class="n">${cambio(i.cambio_1d)}</td><td class="n">${fechaCorta(i.fecha)}</td></tr>`).join('')}</tbody></table>
   <p class="pie">Leído el ${D.leido}. Los índices están en puntos, no en dólares; los datos de fin de semana y festivos repiten el último cierre. Fuente: <a style="color:#f1d58a" href="${D.indices.fuente}" target="_blank" rel="noopener">Yahoo Finance</a>.</p></div>` : '';
  const rw = r? `<div class="panel vidrio"><h2>Protocolos RWA en DeFi</h2><p class="que">Valor bloqueado (TVL) en protocolos que DefiLlama clasifica como RWA · <span class="nivel S">S</span> agregador</p>
   <div class="kpis"><div class="kpi"><div class="v">${fUSD(r.total)}</div><div class="e">En ${r.n} protocolos</div></div><div class="kpi"><div class="v">${fUSD(r.stellar)}</div><div class="e">De ellos, en Stellar</div></div><div class="kpi"><div class="v">${fUSD(r.xrpl)}</div><div class="e">De ellos, en el XRPL</div></div></div>
   <div class="aviso"><b>Cómo leerlo:</b> ${r.nota}</div>
   <table><thead><tr><th>Protocolo</th><th>Valor bloqueado</th><th>7 días</th><th class="hm">Cadenas</th></tr></thead><tbody>${r.top.map(x=>`<tr><td>${x.nombre}</td><td class="n">${fUSD(x.usd)}</td><td class="n">${cambio(x.cambio_7d)}</td><td class="tag hm">${(x.cadenas||[]).join(', ')}</td></tr>`).join('')}</tbody></table>
   <p class="pie">Fuente: <a style="color:#f1d58a" href="${r.fuente}" target="_blank" rel="noopener">DefiLlama</a>, leído el ${D.leido}.</p></div>` : '';
  return mer+ind+rw;
}
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let glQ='', glC='';
function panelGlosario(){

  const plano=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const q=plano(glQ);
  const lista=g.filter(x=>(!q||plano(x.t+' '+x.d).includes(q))&&(!glC||x.capas.includes(glC)));
  const filas=lista.map(x=>`<details class="gl"><summary><b>${esc(x.t)}</b>${x.capas.map(c=>`<span class="etq">${esc(nom[c]||c)}</span>`).join('')}${x.ver?'<span class="etq v">VERIFICAR</span>':''}</summary>

const PL_BONOS=['3M','1A','2A','3A','5A','10A','15A','20A','30A'];
const COL_BONOS={ESP:'#f1d58a',FRA:'#6cb4ff',USA:'#5fd0a0',JPN:'#f08a7a',EUR:'#b8a1ff',GBR:'#aab4c8'};
let bonosOff=new Set(['GBR']);
function curvaBonos(paises){
  const W=640,H=270,ml=44,mr=14,mt=12,mb=30;
  const vis=paises.filter(p=>!bonosOff.has(p.id));
  const vals=vis.flatMap(p=>PL_BONOS.map(k=>p.plazos[k]).filter(v=>v!=null));
  if(!vals.length) return '<p class="mini">Activa algún país.</p>';
  const mn=Math.floor(Math.min(...vals)*2-0.5)/2, mx=Math.ceil(Math.max(...vals)*2+0.5)/2;
  const X=i=>ml+i*(W-ml-mr)/(PL_BONOS.length-1), Y=v=>mt+(1-(v-mn)/(mx-mn))*(H-mt-mb);
  let g='';
  for(let v=mn;v<=mx+1e-9;v+=0.5){ g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(148,163,184,.14)"/><text x="${ml-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#93a1bd">${fm(v,1)}</text>`; }
  PL_BONOS.forEach((k,i)=>{ g+=`<text x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#93a1bd">${k.replace('A',' a.').replace('M',' m')}</text>`; });
  vis.forEach(p=>{
    const pts=PL_BONOS.map((k,i)=>p.plazos[k]!=null?[X(i),Y(p.plazos[k]),k,p.plazos[k]]:null).filter(Boolean);
    const c=COL_BONOS[p.id]||'#fff';
    if(pts.length>1) g+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/>`;
    pts.forEach(q=>{ g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.6" fill="${c}"><title>${esc(p.nombre)} · ${q[2]}: ${fm(q[3],2)} % (${fechaCorta(p.fecha)})</title></circle>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:720px" role="img" aria-label="Curvas de rendimientos por plazo">${g}</svg>`;
}
function panelBonos(){

  const orden=['ESP','FRA','USA','JPN','EUR','GBR'].filter(k=>P[k]).map(k=>P[k]);

  const celdas=p=>PL_BONOS.map(k=>`<td class="n ${['3M','3A','15A','20A'].includes(k)?'hm':''}">${p.plazos[k]!=null?fm(p.plazos[k],2):'<span class="neutro">—</span>'}</td>`).join('');
  const filas=orden.map(p=>`<tr><td><span class="pto" style="background:${COL_BONOS[p.id]}"></span>${esc(p.nombre)}</td>${celdas(p)}<td class="n">${dpb(pb(p,'10A'))}</td>
    <td class="hm">${p.hist10&&p.hist10.length>3?spark(p.hist10.map(x=>x[1])):''}</td><td class="n hm">${fechaCorta(p.fecha)}</td><td><span class="nivel ${p.nivel==='P'?'P':'S'}" title="${esc(p.fuente)}">${p.nivel}</span></td></tr>`).join('');
  const chips=orden.map(p=>`<button class="chip ${bonosOff.has(p.id)?'':'on'}" data-bono="${p.id}"><span class="pto" style="background:${COL_BONOS[p.id]}"></span>${esc(p.nombre)}</button>`).join('');
  const m=b.mensual10||{}, de=m.DE;
  const mfilas=['DE','ES','FR','IT'].filter(k=>m[k]).map(k=>{ const x=m[k], sp=de&&k!=='DE'?(x.valor-de.valor)*100:null, spa=de&&k!=='DE'?(x.valor_ant-de.valor_ant)*100:null;
    return `<tr><td>${esc(x.nombre)}</td><td class="n"><b>${fm(x.valor,2)} %</b></td><td class="n">${fm(x.valor_ant,2)} %</td><td class="n">${k==='DE'?'<span class="neutro">referencia</span>':'+'+fm(sp,0)+' pb'}</td><td class="n hm">${k==='DE'?'':'+'+fm(spa,0)+' pb'}</td>
     <td class="hm">${k==='DE'?'':`<span class="barra" style="width:${Math.max(2,sp/1.4).toFixed(0)}px;background:${COL_BONOS[{ES:'ESP',FR:'FRA',IT:'ESP'}[k]]||'#d4a84b'}"></span>`}</td></tr>`;}).join('');
  const us=P.USA, es=P.ESP, fr=P.FRA, jp=P.JPN;
  const k=(p,l,pl)=>p&&p.plazos[pl]!=null?`<div class="kpi"><div class="v">${fm(p.plazos[pl],2)} %</div><div class="e">${l} · ${fechaCorta(p.fecha)}</div></div>`:'';
  return `<div class="panel vidrio"><h2>Bonos y letras: rendimientos por plazo</h2>
  <p class="que">Cuánto paga cada Estado por endeudarse a distintos plazos (de 3 meses a 30 años) · fuentes oficiales abiertas · <span class="nivel P">P</span> primaria</p>
  <div class="kpis">${k(es,'España, bono a 10 años','10A')}${k(fr,'Francia, TEC 10','10A')}${k(us,'EE. UU., 10 años','10A')}${k(us,'EE. UU., 30 años','30A')}${k(jp,'Japón, 10 años','10A')}${k(jp,'Japón, 30 años','30A')}</div>
  <div class="aviso"><b>Cómo leerlo:</b> el rendimiento es lo que cobra quien compra el bono si lo mantiene hasta el final: sube cuando el precio baja. Una curva «hacia arriba» (más a más plazo) es lo normal; si los plazos cortos pagan más que los largos se dice que está «invertida». <b>Las curvas de cada país no son idénticas en método</b> (vencimiento constante en EE. UU., operaciones de mercado en España, «par» en Reino Unido, emisores AAA en la zona euro), así que comparan bien la forma y menos bien el decimal. Informativo, sin recomendaciones.</div>
  <div class="gl-barra">${chips}</div>
  ${curvaBonos(orden)}
  <table><thead><tr><th>País / curva</th>${PL_BONOS.map(k=>`<th class="${['3M','3A','15A','20A'].includes(k)?'hm':''}">${k.replace('A',' a.').replace('M',' m')}</th>`).join('')}<th title="Cambio del 10 años frente al dato anterior, en puntos básicos (1 pb = 0,01 %)">10 a. vs ayer</th><th class="hm">10 a., 22 días</th><th class="hm">Fecha</th><th>Nivel</th></tr></thead><tbody>${filas}</tbody></table>
  <p class="pie">Fuentes (pasa el ratón por la P): ${orden.map(p=>`<a style="color:#f1d58a" href="${esc(p.url||'#')}" target="_blank" rel="noopener">${esc(p.nombre)}</a>`).join(' · ')}. Leído el ${esc(D.leido)}. España: letras a 3 meses y 1 año y bonos a 3, 5, 10 y 15 años (el Banco de España no publica 30 años). Francia: solo el índice TEC 10 (la AFT bloquea la descarga automática: se actualiza a mano en explorador/bonos-manual.json, leído el ${esc((b.paises.find(p=>p.id==='FRA')||{}).fecha||'—')}). Reino Unido oculto por defecto (curva «par»).</p></div>
  <div class="panel vidrio"><h2>Zona euro: cuánto más paga cada país que Alemania</h2>
  <p class="que">Bono a 10 años, media mensual, BCE <span class="nivel P">P</span> · el diferencial («prima de riesgo») mide la desconfianza relativa frente al país de referencia</p>
  <table><thead><tr><th>País</th><th>${esc(fechaCorta((m.DE||{}).mes)||'mes')}</th><th>${esc(fechaCorta((m.DE||{}).mes_ant)||'mes ant.')}</th><th>Diferencial vs Alemania</th><th class="hm">Mes anterior</th><th class="hm"></th></tr></thead><tbody>${mfilas}</tbody></table>
  <p class="pie">${esc(b.nota_mensual||'')} Dato diario: España y Francia arriba; Italia y Alemania no tienen aún una serie diaria oficial abierta comprobada (en la cola de research). Un diferencial mayor no significa por sí solo impago: depende de la deuda, el déficit y el crecimiento.</p></div>
  <div class="aviso"><b>Huecos, marcados:</b> China (rendimientos de los bonos del Estado): sin fuente oficial abierta leída; Italia y Alemania a diario; 30 años de España, Francia e Italia. Están en la cola de research (research/COLA-DEUDA-BONOS.md).</div>`;
}

  <p class="que">Cuánta deuda de Estados tiene cada banco europeo, por país emisor · ${esc(b.fuente)} · corte ${fechaCorta(b.periodo)} · <span class="nivel P">P</span> primaria</p>
  <div class="kpis">${ks(L.length,'Bancos en esta vista (de '+b.bancos.length+')')}${ks(mmE(tot)+' mil M€','Exposición soberana total de la vista')}${ks(mmE(tp('ES'))+' mil M€','Deuda de España en estos bancos')}${ks(mmE(tp('FR'))+' · '+mmE(tp('IT')),'Francia · Italia (mil M€)')}${ks(mmE(tp('JP'))+' · '+mmE(tp('US')),'Japón · EE. UU. (mil M€)')}</div>
  <div class="aviso"><b>Cómo leerlo:</b> el importe es el valor contable bruto de lo que el banco tiene frente a cada Estado en su balance (bonos y también préstamos), al mayor nivel de consolidación: incluye la deuda que los bancos del grupo compran en sus países de actividad (por ejemplo, filiales en Latinoamérica). «× CET1» compara esa deuda con el capital de máxima calidad del banco: <b>no es lo que perdería</b>, sino cuánto pesa esa cartera frente a su colchón de capital. «% del propio país» es la parte que corresponde al país de la sede (el llamado sesgo doméstico). «Deuda que emite» es lo que el propio banco debe a quienes le compraron sus bonos, cédulas o deuda subordinada (está en su pasivo; no es deuda del Estado). Corte de ${fechaCorta(b.periodo)}. ${esc(b.nota)} Informativo, sin recomendaciones.</div>
  <div class="gl-barra">${chips}<input id="banq" type="search" placeholder="Buscar banco…" value="${esc(banQ)}">
   <select id="banord"><option value="total"${banOrden==='total'?' selected':''}>Ordenar por deuda total</option><option value="cet1"${banOrden==='cet1'?' selected':''}>Ordenar por × CET1</option><option value="emitidos"${banOrden==='emitidos'?' selected':''}>Ordenar por deuda que emite</option><option value="nacional"${banOrden==='nacional'?' selected':''}>Ordenar por % del propio país</option><option value="nombre"${banOrden==='nombre'?' selected':''}>Ordenar por nombre</option></select></div>
  <table><thead><tr><th>Banco (pulsa para ver el detalle)</th><th>País</th><th title="Miles de millones de euros">Deuda soberana (mil M€)</th><th title="Deuda soberana dividida entre el capital CET1">× CET1</th><th class="hm">% de su activo</th><th class="hm" title="Parte de la deuda soberana que es del país de su sede">% del propio país</th><th class="hm" title="Bonos, cédulas y deuda subordinada que ha emitido el propio banco (valor contable, en su pasivo)">Deuda que emite (mil M€)</th><th class="hm">Mayores emisores soberanos (mil M€)</th></tr></thead><tbody>${filas}</tbody></table>
  ${L.length>25?`<p class="mini"><button class="chip" id="bantodos">${banTodos?'Mostrar solo los 25 primeros':'Mostrar los '+L.length+' bancos'}</button></p>`:''}
  <p class="pie">Fuente: <a style="color:#f1d58a" href="${esc(b.url)}" target="_blank" rel="noopener">EBA, ejercicio de transparencia de la UE 2025</a> (tablas de soberanos y de capital). Importes en ${esc(b.unidad)}; aquí en miles de millones. Datos de la propia EBA a partir de los informes supervisores de cada banco.</p></div>`;
}

function panelReservas(){
  const r=D.reservas; if(!r) return '<div class="aviso">No hay datos de reservas.</div>';
  const c=r.cofer, o=r.oro;
  const pp=(a,b)=> (a==null||b==null)?'<span class="neutro">—</span>':`<span class="${Math.abs(a-b)<0.05?'neutro':a>b?'sube':'baja'}">${a>b?'+':''}${fm(a-b,2)} pp</span>`;
  const cf=c.monedas.filter(m=>m[1]!=null).map(m=>`<tr><td>${esc(m[0])}</td><td class="n"><b>${fm(m[1],2)} %</b></td><td class="n">${fm(m[2],2)} %</td><td class="n">${pp(m[1],m[2])}</td><td class="hm"><span class="barra" style="width:${(m[1]*3.4).toFixed(0)}px"></span></td></tr>`).join('');
  const ks=o.kpis.map(k=>`<div class="kpi"><div class="v">${esc(k[0])}</div><div class="e">${esc(k[1])}</div></div>`).join('');
  const of=o.filas.map(f=>`<tr><td>${esc(f[0])}</td><td class="n ${f[1].startsWith('−')?'baja':'sube'}"><b>${esc(f[1])}</b></td><td class="tag">${esc(f[2])}</td></tr>`).join('');
  const bloque=(t)=>`<h2 style="margin-top:14px;font-size:14px">${esc(t.titulo)}</h2><table><thead><tr><th>Quién</th><th>Qué consta</th><th class="hm">Fecha</th><th>Nivel</th></tr></thead><tbody>${t.filas.map(f=>`<tr><td>${esc(f[0])}</td><td style="white-space:normal;text-align:left">${esc(f[1])}</td><td class="tag hm">${esc(f[2])}</td><td><span class="nivel ${f[3]}">${f[3]}</span> <a style="color:#f1d58a" href="${esc(f[4])}" target="_blank" rel="noopener">fuente</a></td></tr>`).join('')}</tbody></table>`;
  return `<div class="panel vidrio"><h2>Quién compra y quién vende deuda y reservas</h2>
  <p class="que">Reservas de los Estados, oro y balances de los bancos centrales · fuentes oficiales · leído el ${esc(r.leido)} · la deuda de EE. UU. por país está en la pestaña «Deuda de EE. UU.»</p>
  <div class="aviso"><b>Cómo leerlo:</b> las reservas oficiales son lo que los bancos centrales guardan para respaldar su moneda; el cambio de la cuota de una moneda puede deberse al tipo de cambio y no a compras o ventas. ${r.avisos.map(esc).join(' ')} Informativo, sin recomendaciones.</div>
  <h2 style="margin-top:6px;font-size:14px">${esc(c.titulo)}</h2><p class="que">${esc(c.periodo)} frente a ${esc(c.anterior)} · total ${esc(c.total)} · <span class="nivel P">P</span> <a style="color:#f1d58a" href="${esc(c.fuente)}" target="_blank" rel="noopener">${esc(c.fecha)}</a></p>
  <table><thead><tr><th>Moneda</th><th>Cuota ahora</th><th>Antes</th><th>Cambio</th><th class="hm"></th></tr></thead><tbody>${cf}</tbody></table><p class="pie">${esc(c.nota)}</p>
  <h2 style="margin-top:14px;font-size:14px">${esc(o.titulo)}</h2><div class="kpis">${ks}</div>
  <table><thead><tr><th>Banco central</th><th>Compra (+) o venta (−) en el 2.º trimestre</th><th>Nota</th></tr></thead><tbody>${of}</tbody></table><p class="pie"><span class="nivel P">P</span> <a style="color:#f1d58a" href="${esc(o.fuente)}" target="_blank" rel="noopener">${esc(o.fecha)}</a>. ${esc(o.nota)}</p>
  ${bloque(r.bancos_centrales)}${bloque(r.reservas)}</div>`;
}

const PEST=[['tic','Deuda de EE. UU.',panelTIC],['deuda','Deuda pública',panelDeuda],['bonos','Bonos y curvas',panelBonos],['bancos','Deuda por banco',panelBancos],['reservas','Reservas y bancos centrales',panelReservas],['stable','Stablecoins',panelStable],['tipos','Tipos de interés',panelTipos],['rwa','Mercado y RWA',panelMercadoRWA],['glo','Glosario',panelGlosario]];
let act=PEST[0][0];
function pinta(){
  document.getElementById('pest').innerHTML=PEST.map(p=>`<button class="chip ${p[0]===act?'on':''}" data-k="${p[0]}">${p[1]}</button>`).join('')+'<span class="mini" style="align-self:center;margin-left:8px">Próximos: deuda por país · CBDC y redes</span>';
  document.getElementById('cont').innerHTML=PEST.find(p=>p[0]===act)[2]();
  document.querySelectorAll('[data-banpais]').forEach(b=>b.onclick=()=>{banPais=b.dataset.banpais; banTodos=false; banSel=null; pinta();});
  document.querySelectorAll('tr[data-lei]').forEach(r=>r.onclick=()=>{banSel=banSel===r.dataset.lei?null:r.dataset.lei; pinta();});
  const bq=document.getElementById('banq'); if(bq) bq.oninput=()=>{banQ=bq.value; banSel=null; const pos=bq.selectionStart; pinta(); const n=document.getElementById('banq'); n.focus(); n.setSelectionRange(pos,pos);};
  const bo=document.getElementById('banord'); if(bo) bo.onchange=()=>{banOrden=bo.value; pinta();};
  const bt=document.getElementById('bantodos'); if(bt) bt.onclick=()=>{banTodos=!banTodos; pinta();};
  document.querySelectorAll('[data-bono]').forEach(b=>b.onclick=()=>{const k=b.dataset.bono; bonosOff.has(k)?bonosOff.delete(k):bonosOff.add(k); pinta();});
  const q=document.getElementById('glq'), c=document.getElementById('glc');
  if(q){ q.oninput=()=>{glQ=q.value; const pos=q.selectionStart; pinta(); const n=document.getElementById('glq'); n.focus(); n.setSelectionRange(pos,pos);}; }
  if(c){ c.onchange=()=>{glC=c.value; pinta();}; }
  document.querySelectorAll('#pest .chip').forEach(b=>b.onclick=()=>{act=b.dataset.k;pinta();});
}
pinta();
</script></body></html>
