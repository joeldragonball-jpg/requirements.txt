ul{margin:4px 0;padding-left:18px}li{margin:2px 0}
dl{margin:4px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}dt{color:var(--tx2)}dd{margin:0}
a{color:var(--ac)}
.nota-v{color:var(--tx2);font-size:14px;margin:4px 0}
.que{color:var(--tx2);font-size:14.5px;margin:2px 0 6px}
details.bl{margin-bottom:clamp(4px,.5vw,10px)}details.bl>summary{cursor:pointer;font-weight:600;padding:4px 0}.ms{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(88px,.9fr) minmax(110px,1.2fr) minmax(86px,.8fr);gap:10px;align-items:center;padding:7px 10px;margin:2px 0;border:1px solid var(--lin);border-radius:8px;background:var(--panel);list-style:none}details.bl>summary.ms::-webkit-details-marker{display:none}.ms:hover{background:#1b2640;border-color:var(--ac)}details[open]>summary.ms{background:#1b2640;border-color:var(--ac)}.ms .nm{font-weight:700;color:var(--tx);letter-spacing:.01em}.ms .nm::before{content:'▸  ';color:var(--ac)}details[open]>summary.ms .nm::before{content:'▾  '}.ms .im{font-weight:700;color:#f1d58a;text-align:right;white-space:nowrap}.ms .im small{color:var(--tx2);font-weight:400}.ms .pc{position:relative;height:20px;background:var(--nul);border-radius:5px;overflow:hidden}.ms .pc i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#27578f,var(--ac))}.ms .pc b{position:relative;padding-left:7px;font-size:.85em;color:#fff;line-height:20px}.ms .hb{color:var(--tx2);font-size:.86em;text-align:right;white-space:nowrap}.ms .hb em{font-style:normal;color:var(--tx);font-weight:600}.pb{display:inline-block;position:relative;min-width:110px;height:18px;background:var(--nul);border-radius:4px;overflow:hidden;vertical-align:middle}.pb i{position:absolute;top:0;bottom:0;left:0;background:#27578f}.pb b{position:relative;padding-left:6px;font-size:.88em;line-height:18px}@media(max-width:700px){.ms{grid-template-columns:1fr 1fr}.ms .nm{grid-column:1/-1}}
.barrita{display:inline-block;height:9px;background:var(--ac);border-radius:2px;vertical-align:middle}

.masonry{display:block}
.mbanda{display:flex;gap:var(--gap);align-items:flex-start;margin-bottom:clamp(5px,.6vw,10px)}
.mcol:empty{display:none}.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:clamp(5px,.6vw,10px)}

.masonry>details.bl{margin-bottom:clamp(5px,.6vw,10px)}
.rej{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,clamp(280px,30vw,420px)),1fr));gap:var(--gap);align-items:start}

/* ---- v4: pulido y movimiento sobrio ---- */
table tr{transition:background-color .15s}
table tr:hover td{background:#1b2640}
table.mat tr:hover td.c{background:inherit}
table.mat td.c:not(.nodato){transition:transform .12s,filter .12s}
table.mat td.c:not(.nodato):hover{filter:brightness(1.25);transform:scale(1.06);position:relative;z-index:1}
.kpi,.tarj,.hecho,.item,.nota,.pill{transition:border-color .15s,background-color .15s,transform .15s}
.kpi:hover,.tarj:hover,.item:hover{border-color:var(--ac);transform:translateY(-1px)}
.hecho:hover,.nota:hover,.ev:hover{background-color:#1b2640}
.pill:hover{border-color:var(--ac);color:var(--tx)}
nav button{transition:background-color .15s,color .15s}nav button:hover:not(.on){color:var(--tx);background:#1b2640}
.nodo{transition:transform .12s}.nodo:hover{transform:translateX(-50%) scale(1.35)}.nodo.noti{border-radius:3px;transform:translateX(-50%) rotate(45deg)}
.vista.ent{animation:ent .28s ease-out}
.vista.fx .caja,.vista.fx .vacias,.vista.fx .pills{animation:sube .5s ease-out both}
.vista.fx>.caja:nth-child(2),.vista.fx>.cols2>.caja:nth-child(2),.vista.fx>.cols3>.caja:nth-child(2){animation-delay:.08s}
.vista.fx>.caja:nth-child(3),.vista.fx>.cols3>.caja:nth-child(3){animation-delay:.16s}
.vista.fx>.caja:nth-child(n+4){animation-delay:.22s}
.vista.fx .kpi,.vista.fx .tarj{animation:sube .45s ease-out both}
.vista.fx .kpi:nth-child(2){animation-delay:.04s}.vista.fx .kpi:nth-child(3){animation-delay:.08s}.vista.fx .kpi:nth-child(4){animation-delay:.12s}.vista.fx .kpi:nth-child(n+5){animation-delay:.16s}
.vista.fx .ev,.vista.fx .hecho,.vista.fx .item,.vista.fx .nota{animation:sube .45s ease-out both}
.vista.fx .nodo{animation:pop .45s ease-out both .15s}
.vista.fx table.mat td.c{animation:ent .6s ease-out both}
.vista.fx .barrita{transform-origin:left;animation:ancho .8s ease-out both .2s}
.vista.fx .bars div{transform-origin:bottom;animation:alto .7s ease-out both .2s}
.vista.fx svg.sp polyline{stroke-dasharray:1;stroke-dashoffset:1;animation:dibuja 1s ease-out forwards .2s}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.2)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes ent{from{opacity:0}to{opacity:1}}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ancho{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes alto{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dibuja{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const COL=['#c0504d','#c8923a','#bdb04a','#3f9aa8','#3aa56f','#2fcf85'];
const HOY=new Date();const HOYS=HOY.toISOString().slice(0,10);
const dias=f=>Math.floor((HOY-new Date(f+'T00:00:00'))/864e5);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const cert=f=>f==='P'?'🛡':(f==='S'?'◐':'△');
const bcl=n=>n==='P'?'P':(n&&n[0]==='S'?'S':'V');
const num=(x,d=1)=>x==null||isNaN(x)?'—':Number(x).toLocaleString('es-ES',{maximumFractionDigits:d,minimumFractionDigits:d>1&&Math.abs(x)<100?Math.min(d,2):0});
const usd=x=>x==null?'—':'$'+(Math.abs(x)>=1e12?num(x/1e12,2)+' billones':Math.abs(x)>=1e9?num(x/1e9,1)+' mil millones':Math.abs(x)>=1e6?num(x/1e6,0)+' millones':num(x,0));
const TABS=[['resumen','Resumen'],['capas','Capas'],['tiempo','Línea de tiempo'],['calendario','Calendario'],['matriz','Matriz país × tema'],['noticias','Noticias'],['voces','Voces'],['paises','Países'],['espana','España'],['paneles','Paneles de datos']];
let R,D,V,P,CAL,FMI,VAL,BAN,RES,X,modo='sem',selMov=null,selCapa=null,selCelda=null,tab='resumen',listo=false;

/* ---------- utilidades de pintado ---------- */
/* subida en verde y bajada en rojo, siempre y con flecha (también bonos, tipos, TIC, stablecoins, índices y ETF); un cambio cero queda gris */
function cambio(v,suf='%',d=1){
  if(v==null||isNaN(v))return el('span','igual','—');
  v=Number(v.toFixed(d));
  const s=el('span',v===0?'igual':v>0?'sube':'baja');
  s.textContent=(v>0?'▲ +':v<0?'▼ ':'= ')+num(v,d)+' '+suf;return s}
function spark(arr,w=90,h=22,col='#5aa9e6'){
  const a=arr.filter(v=>v!=null);if(a.length<2)return el('span');
  const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;
  const pts=a.map((v,i)=>(i/(a.length-1)*(w-4)+2).toFixed(1)+','+(h-3-(v-mn)/r*(h-6)).toFixed(1)).join(' ');
  const ns='http://www.w3.org/2000/svg';const s=document.createElementNS(ns,'svg');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('class','sp');
  const p=document.createElementNS(ns,'polyline');p.setAttribute('points',pts);p.setAttribute('pathLength','1');p.setAttribute('fill','none');p.setAttribute('stroke',col);p.setAttribute('stroke-width','1.6');s.append(p);
  const t=document.createElementNS(ns,'title');t.textContent='mín '+num(mn,2)+' · máx '+num(mx,2);s.append(t);return s}
function barra(p,col){const b=el('span','barrita');b.style.width=Math.max(2,Math.min(100,p))+'px';if(col)b.style.background=col;return b}
function pbar(v){const s=el('span','pb'),i=el('i');i.style.width=Math.min(100,Math.max(0,v))+'%';s.append(i,el('b',null,v.toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})+' %'));return s}
function tabla(cols,filas){
  const t=el('table');const h=el('tr');
  for(const c of cols)h.append(el('th',c.n?'n':'',c.t));t.append(h);
  for(const f of filas){const r=el('tr');
    for(const c of cols){const td=el('td',c.n?'n':'');const v=c.f?c.f(f):f[c.k];
      if(v instanceof Node)td.append(v);else td.textContent=v==null?'—':v;r.append(td)}
    t.append(r)}
  return t}
function kpi(v,t,cam){const k=el('div','kpi');const b=el('b');if(v instanceof Node)b.append(v);else b.textContent=v;k.append(b,el('span',null,t));if(cam)k.append(cam);return k}
/* cuando subir es malo (paro, deuda, defunciones) la flecha va en rojo: se intercambian las clases de color de cambio() */
function inv(n){if(n&&n.classList){if(n.classList.contains('sube'))n.classList.replace('sube','baja');else if(n.classList.contains('baja'))n.classList.replace('baja','sube')}return n}
function kpis(l){const g=el('div','kpis');for(const x of l)if(x)g.append(kpi(...x));return g}
function nivelBadge(n){return el('span','badge '+bcl(n),n||'?')}
function chips(l){const s=el('span');for(const x of l||[])s.append(el('span','chip',x));return s}
function bloque(tit,que,pie,cont,abierto=true){
  const d=el('details','bl');d.open=abierto;d.append(el('summary',null,tit));
  if(que)d.append(el('div','que',que));d.append(cont);
  if(pie){const p=el('div','nota-v');if(pie.nivel)p.append(nivelBadge(pie.nivel));p.append(document.createTextNode(' '+(pie.t||'')));d.append(p)}return d}
function paisOk(mv){
  const fp=$('fpais').value;if(!fp)return true;
  const nom=R.jurisdicciones.find(j=>j.id===fp).nombre.toLowerCase();
  return (mv.pais||[]).some(p=>{p=p.toLowerCase();return p===nom||nom.includes(p)||p.includes(nom)})}
const certOk=f=>{const c=$('fcert').value;return !c||(c==='P'?f==='P':bcl(f)!=='V')};
const capaNom=id=>(D.capas.find(c=>c.id===id)||{nombre:id}).nombre;
const colEst=e=>(D.estados[e]||{}).color||'#888';
const urlInf=m=>m.informe?(D.base_informes||'')+m.informe:null;
function gen(x){
  if(x==null)return el('span',null,'—');
  if(Array.isArray(x)){const u=el('ul');for(const i of x){const l=el('li');l.append(gen(i));u.append(l)}return u}
  if(typeof x==='object'){const d=el('dl');for(const k in x){d.append(el('dt',null,k),el('dd'));d.lastChild.append(gen(x[k]))}return d}
  return document.createTextNode(String(x))}
function lugar(j,t){const nj=R.jurisdicciones.find(x=>x.id===j),nt=R.temas.find(x=>x.id===t);return (nj?nj.nombre:j)+' · '+(nt?nt.nombre:t)}

/* ---------- carga: los datos los trae la Órbita (mapa.html) en parent.DATOS; este archivo es solo una plantilla ---------- */
function cargar(){
  const G=window.parent&&window.parent.DATOS;
  if(!G||!G.radar){$('estado').textContent='Sin datos: esta plantilla se abre desde la Órbita.';return}
  D=G;R=G.radar;V=G.voces;P=G.paneles;CAL=G.calificaciones;FMI=G.deuda_fmi;VAL=G.valoracion;window.ENL=G.enlaces;BAN=G.bancos;RES=G.reservas;window.RWAM=G.rwa_cadena_manual;window.CBDCB=G.cbdc_blockchains;
  X=G.calendario?{calendario:G.calendario,docs:Object.fromEntries(G.capas.map(c=>[c.id,c.docs]))}:null;
  $('estado').textContent='Datos reales: radar '+R.revisado+' · Órbita '+D.version+(P?' · paneles '+P.leido:'');
  for(const j of R.jurisdicciones){const o=el('option',null,j.nombre);o.value=j.id;$('fpais').append(o)}
  for(const t of R.temas){const o=el('option',null,t.nombre);o.value=t.id;$('ftema').append(o)}
  ['fpais','ftema','fcert','fcambio'].forEach(i=>$(i).onchange=pintarTodo);
  $('dsem').onclick=()=>{modo='sem';$('dsem').className='on';$('ddat').className='';pintarTodo()};
  $('ddat').onclick=()=>{modo='dat';$('ddat').className='on';$('dsem').className='';pintarTodo()};
  listo=true;ir(tab)}
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,vistos=new Set();
function ir(id){tab=id;if(!listo)return;for(const [i] of TABS){$('v-'+i).classList.toggle('on',i===id)}
  const sec=$('v-'+id);sec.classList.remove('ent','fx');void sec.offsetWidth;const primera=!vistos.has(id);
  if(!RM){sec.classList.add('ent');if(primera){sec.classList.add('fx');clearTimeout(sec.tfx);sec.tfx=setTimeout(()=>sec.classList.remove('fx'),1800)}}
  pintarTodo();if(primera){vistos.add(id);contar(sec)}}
/* las cifras grandes cuentan hacia arriba una sola vez, la primera vez que se ve cada pestaña */
function contar(sec){
  if(RM)return;
  sec.querySelectorAll('.kpi b,.cifra').forEach(e=>{
    if(e.children.length)return;const t=e.textContent;const m=t.match(/\d[\d.]*(?:,\d+)?/);if(!m)return;
    const dec=m[0].includes(',')?m[0].split(',')[1].length:0;const fin=parseFloat(m[0].replace(/\./g,'').replace(',','.'));if(!isFinite(fin)||fin===0)return;
    const pre=t.slice(0,m.index),suf=t.slice(m.index+m[0].length),t0=performance.now();
    const paso=ahora=>{const k=Math.min(1,(ahora-t0)/800),v=fin*(1-Math.pow(1-k,3));
      e.textContent=k<1?pre+v.toLocaleString('es-ES',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf:t;if(k<1)requestAnimationFrame(paso)};
    requestAnimationFrame(paso)})}
function pintarTodo(){({resumen:pResumen,capas:pCapas,tiempo:pTiempo,calendario:pCalendario,matriz:pMatriz,noticias:pNoticias,voces:pVoces,paises:pPaises,espana:pEspana,paneles:pPaneles})[tab]()}

/* ---------- bloques de datos reutilizables (Capas y Paneles) ---------- */
const PL=['3M','6M','1A','2A','3A','5A','10A','15A','20A','30A'];
const plazo=k=>{const n=parseInt(k);return k.endsWith('M')?n+' meses':n===1?'1 año':n+' años'};
function nBonos(ids){
  const ps=P.bonos.paises.filter(p=>!ids||ids.includes(p.id));
  const usados=PL.filter(k=>ps.some(p=>p.plazos&&p.plazos[k]!=null));
  const cols=[{t:'País (dato de)',f:p=>{const s=el('span');s.append(el('b',null,p.nombre),el('span','cambio',p.fecha),nivelBadge(p.nivel));return s}}];
  for(const k of usados)cols.push({t:plazo(k),n:1,f:p=>{if(p.plazos[k]==null)return '—';const s=el('span');s.append(document.createTextNode(num(p.plazos[k],2)+' %'));
    if(p.prev&&p.prev[k]!=null){const d=(p.plazos[k]-p.prev[k])*100;const c=cambio(d,'pb',0);c.classList.add('cambio');s.append(c)}return s}});
  cols.push({t:'A 10 años, últimas semanas',f:p=>p.hist10&&p.hist10.length>1?spark(p.hist10.map(x=>x[1]),110,26):'—'});
  const w=el('div');w.append(tabla(cols,ps));
  const m=P.bonos.mensual10;
  if(m&&m.DE&&!ids){
    w.append(el('h3',null,'Diferencial de los bonos a 10 años frente a Alemania (media mensual del BCE, '+m.DE.mes+')'));
    w.append(tabla([{t:'País',f:r=>r.nombre},{t:'Rendimiento a 10 años',n:1,f:r=>num(r.valor,2)+' %'},{t:'Mes anterior',n:1,f:r=>num(r.valor_ant,2)+' %'},{t:'Diferencial con Alemania',n:1,f:r=>r===m.DE?'—':num((r.valor-m.DE.valor)*100,0)+' puntos básicos'}],Object.values(m)))}
  return w}
function nTipos(){
  return tabla([{t:'País',f:r=>r.pais},{t:'Banco central',f:r=>r.banco},{t:'Tipo oficial (% anual)',n:1,f:r=>r.valor},
    {t:'Último cambio',f:r=>{const s=el('span');s.append(document.createTextNode((r.ultimo_cambio||'—')+' '));if(r.cambio_pb!=null)s.append(cambio(r.cambio_pb,'puntos básicos',0));return s}},
    {t:'Dato de',f:r=>r.dato_de},{t:'¿Coincide con el radar?',f:r=>r.coincide_radar===false?'⚠ el radar dice '+r.radar:r.coincide_radar?'✓ sí':'no está en el radar'}],P.tipos_vivos.paises)}
function nTic(n){
  const t=P.tic;const tot=t.total[0];
  const w=el('div');
  w.append(kpis([['$'+num(tot,0)+' mil millones','Total extranjero en '+t.meses[0],cambio((tot/t.total[12]-1)*100,'% en 12 meses')],['$'+num(t.oficial[0],0)+' mil millones','De ellos, oficiales (bancos centrales y Estados)',cambio((t.oficial[0]/t.oficial[12]-1)*100,'% en 12 meses')]]));
  w.append(tabla([{t:'País (custodia)',f:r=>r.nombre},{t:t.meses[0]+' (mil millones de $)',n:1,f:r=>num(r.serie[0],1)},{t:'% del total',n:1,f:r=>{const s=el('span');s.append(barra(r.serie[0]/tot*100*3),document.createTextNode(' '+num(r.serie[0]/tot*100,1)+' %'));return s}},
    {t:'Frente a hace 6 meses',n:1,f:r=>cambio((r.serie[0]/r.serie[6]-1)*100)},{t:'Frente a hace 12 meses',n:1,f:r=>cambio((r.serie[0]/r.serie[12]-1)*100)},{t:'13 meses',f:r=>spark(r.serie.slice().reverse(),90,24)}],t.paises.slice(0,n||20)));
  return w}
function nStable(n){
  const s=P.stablecoins;const w=el('div');
  w.append(kpis([[usd(s.total),'En circulación ('+s.n_activos+' activos)'],[num(s.top[0].usd/s.total*100,0)+' %','Cuota de '+s.top[0].simbolo],[num((s.top[0].usd+s.top[1].usd)/s.total*100,0)+' %',s.top[0].simbolo+' + '+s.top[1].simbolo]]));
  w.append(tabla([{t:'Stablecoin',f:r=>r.simbolo+' · '+r.nombre},{t:'En circulación',n:1,f:r=>usd(r.usd)},{t:'% del total',n:1,f:r=>{const q=el('span');q.append(barra(r.usd/s.total*100*3),document.createTextNode(' '+num(r.usd/s.total*100,1)+' %'));return q}},{t:'Frente a hace 7 días',n:1,f:r=>cambio(r.cambio_7d,'%',2)},{t:'Frente a hace 30 días',n:1,f:r=>cambio(r.cambio_30d,'%',2)},{t:'Cadenas',n:1,f:r=>r.n_cadenas}],s.top.slice(0,n||15)));
  return w}
function nCadenas(){
  const s=P.stablecoins;const w=el('div','cols2');
  for(const [k,nom] of [['xrpl','XRP Ledger'],['stellar','Stellar']]){const c=s[k];const d=el('div');d.append(el('h3',null,nom+': '+c.n+' stablecoins, '+usd(c.total)));
    d.append(tabla([{t:'Stablecoin',f:r=>r.simbolo},{t:'En circulación',n:1,f:r=>usd(r.usd)},{t:'% de la cadena',n:1,f:r=>num(r.usd/c.total*100,1)+' %'}],c.top.slice(0,6)));w.append(d)}
  const q=P.stablecoins_primarias;
  if(q&&q.monedas){const box=el('div');box.style.gridColumn='1 / -1';box.append(el('h3',null,'Cifra en cadena (fuente primaria [P]) frente a DefiLlama [S]'));
    const ll=m=>(m.cadena==='XRPL'?s.xrpl:s.stellar).top.find(f=>f.simbolo===m.id);
    box.append(tabla([{t:'Moneda',f:m=>m.id+' en '+m.cadena},{t:'En cadena [P]',n:1,f:m=>m.id.startsWith('EUR')?num(m.cantidad/1e6,2)+' millones de €':usd(m.cantidad)},
      {t:'DefiLlama [S]',n:1,f:m=>{const l=ll(m);return l?usd(l.usd):'—'}},
      {t:'Diferencia',n:1,f:m=>{const l=ll(m);return (!l||m.id.startsWith('EUR'))?'no comparable':cambio((l.usd-m.cantidad)/m.cantidad*100,'%',1)}},
      {t:'Método',f:m=>m.metodo}],q.monedas));
    const ce=q.contraste_emisor&&q.contraste_emisor.RLUSD;
    box.append(el('div','nota-v','Leído '+q.leido+'. Direcciones de emisor sacadas de las webs oficiales de Ripple y Circle. '+(ce?'Ripple (transparencia, '+ce.fecha+'): '+usd(ce.total_todas_cadenas)+' de RLUSD en TODAS las cadenas y '+usd(ce.reservas)+' de reservas; el XRPL es solo una parte. ':'')+(q.pendiente_verificar||'')));w.append(box)}
  return w}
function nCbdc(){
  const c=window.CBDCB;const w=el('div');
  const ul=el('ul');for(const x of c.respuesta)ul.append(el('li',null,x));w.append(ul);
  const filt=el('div','pills');let tipo='';
  const cont=el('div');
  const pinta=()=>{cont.textContent='';cont.append(tabla([{t:'País / proyecto',f:f=>f.proyecto},{t:'Tipo',f:f=>f.tipo},{t:'Tecnología',f:f=>f.tecnologia},{t:'Quién participa',f:f=>f.participa},{t:'Estado',f:f=>f.estado},{t:'Fuente',f:f=>f.fuente},{t:'Nivel',f:f=>nivelBadge(f.nivel)}],c.filas.filter(f=>!tipo||f.tipo.split(/[ +(/]/)[0]===tipo)))};
  for(const [k,nom] of [['','Todos']].concat(Object.entries(c.tipos).map(([k,v])=>[k,k+' · '+v]))){const b=el('span','pill'+(k===tipo?' on':''),nom);b.onclick=()=>{tipo=k;[...filt.children].forEach(x=>x.classList.toggle('on',x===b));pinta()};filt.append(b)}
  w.append(filt,cont);pinta();
  w.append(el('h3',null,'Pendiente de verificar'));const l=el('ul');for(const x of c.pendiente)l.append(el('li',null,x));w.append(l);
  w.append(el('div','nota-v',c.nota+' Informe: '+c.informe));return w}
function nRwa(){
  const r=P.rwa;const w=el('div');
  w.append(kpis([[usd(r.total),'Valor bloqueado en '+r.n+' protocolos RWA'],[usd(r.stellar),'De ellos, en Stellar'],[usd(r.xrpl),'De ellos, en el XRPL']]));
  w.append(tabla([{t:'Protocolo',f:x=>x.nombre},{t:'Valor bloqueado',n:1,f:x=>usd(x.usd)},{t:'Frente a hace 7 días',n:1,f:x=>cambio(x.cambio_7d,'%',2)},{t:'Cadenas',f:x=>(x.cadenas||[]).join(', ')}],(r.top||[]).slice(0,12)));
  if(r.por_cadena){w.append(el('h3',null,'Por blockchain (DefiLlama [S], automático: las 10 mayores de '+r.por_cadena.n_cadenas+', más XRPL y Stellar)'));
    w.append(tabla([{t:'#',n:1,f:c=>c.puesto},{t:'Cadena',f:c=>c.cadena},{t:'Valor bloqueado',n:1,f:c=>usd(c.usd)},{t:'% del total',n:1,f:c=>num(c.pct,1)+' %'},{t:'Protocolos',n:1,f:c=>c.n_protocolos}],r.por_cadena.top))}
  if(window.RWAM){const m=window.RWAM;w.append(el('h3',null,'Valor tokenizado por cadena (RWA.xyz [S], manual, leído '+m.leido+')'));
    w.append(tabla([{t:'Cadena',f:c=>c.cadena},{t:'Distribuido',n:1,f:c=>usd(c.distribuido)},{t:'Representado',n:1,f:c=>usd(c.representado)},{t:'Emisores con cifra',f:c=>c.emisores}],m.cadenas));
    w.append(el('div','nota-v',m.nota+' '+m.pendiente))}
  w.append(el('div','nota-v',r.nota));return w}
function nMercado(){
  return kpis((P.mercado.activos||[]).map(a=>[ '$'+num(a.precio,a.precio<10?4:0),a.nombre+' ('+a.simbolo+') · capitalización '+usd(a.capitalizacion),cambio(a.cambio_24h,'% en 24 h',2)]))}
function nIndices(){
  return tabla([{t:'Índice',f:r=>r.nombre},{t:'Zona',f:r=>r.zona},{t:'Valor',n:1,f:r=>num(r.valor,0)},{t:'Frente al día anterior',n:1,f:r=>cambio(r.cambio_1d,'%',2)},{t:'Fecha',f:r=>r.fecha}],P.indices.indices)}
function nFmi(){
  const i26=FMI.anios.indexOf('2026');
  return tabla([{t:'País',f:r=>r.nombre}].concat(FMI.anios.map((a,i)=>({t:'Deuda '+a+(a>'2025'?' (previsión)':''),n:1,f:r=>num(r.deuda[i],1)+' %'}))).concat([{t:'Deuda 2026 sobre el PIB',f:r=>barra(r.deuda[i26]*0.8)},{t:'Saldo público 2026',n:1,f:r=>cambio(r.saldo[i26],'% del PIB',1)}]),FMI.paises.slice().sort((a,b)=>b.deuda[i26]-a.deuda[i26]))}
function nEba(paises,n){
  const filas=[];for(const [pc,nom] of paises)BAN.bancos.filter(x=>x.pais===pc).sort((a,b)=>b.total-a.total).slice(0,n).forEach(x=>filas.push({...x,nom}));
  return tabla([{t:'Banco',f:r=>r.nombre.replace(/, S\.A\.| S\.p\.A\.| SOCIETA' PER AZIONI/gi,'').trim()},{t:'País',f:r=>r.nom||r.pais_nombre},{t:'Deuda soberana en balance ('+BAN.unidad.replace('millones de euros','miles de millones de €')+')',n:1,f:r=>num(r.total/1000,1)},{t:'Capital CET1 %',n:1,f:r=>num(r.cet1,1)}],filas)}
function nEbaTop(n){
  const filas=BAN.bancos.slice().sort((a,b)=>b.total-a.total).slice(0,n);

let capasOff=new Set(),rango='365',buscaTL='',soloRx=false;
function pTiempo(){
  const s=$('v-tiempo');s.textContent='';
  const c=el('div','caja');
  const ctl=el('div','barra');ctl.style.cssText='margin:-12px -12px 10px;border-radius:10px 10px 0 0';
  const sr=el('select');for(const [v,t] of [['todo','Todo el periodo'],['365','Último año'],['90','Últimos 90 días']]){const o=el('option',null,t);o.value=v;if(v===rango)o.selected=true;sr.append(o)}
  sr.onchange=()=>{rango=sr.value;pTiempo()};
  const q=el('input');q.type='text';q.placeholder='Buscar (Pontes, OCC, DTCC…)';q.value=buscaTL;q.oninput=()=>{buscaTL=q.value;clearTimeout(q.t);q.t=setTimeout(pTiempo,250)};
  ctl.append(el('span',null,'Rango'),sr,q);
  const dcp=el('details');dcp.style.cssText='flex-basis:100%';dcp.open=capasOff.size>0;
  const scp=el('summary',null,'Capas visibles: '+(D.capas.length-capasOff.size)+' de '+D.capas.length);scp.style.cursor='pointer';dcp.append(scp);
  const wcp=el('div');wcp.style.cssText='display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px';dcp.append(wcp);
  for(const cp of D.capas){const l=el('label');const k=el('input');k.type='checkbox';k.checked=!capasOff.has(cp.id);k.onchange=()=>{k.checked?capasOff.delete(cp.id):capasOff.add(cp.id);pTiempo()};l.append(k,document.createTextNode(' '+cp.nombre));wcp.append(l)}
  ctl.append(dcp);
  const lrx=el('label');const krx=el('input');krx.type='checkbox';krx.checked=soloRx;krx.onchange=()=>{soloRx=krx.checked;pTiempo()};lrx.append(krx,document.createTextNode(' Solo hechos con reacción de precios'));ctl.append(lrx);
  c.append(ctl);
  if(reac.length)c.append(panelReac());
  else{const nrx=D.movimientos.filter(m=>!reacMotivo(m)).length;const ay=el('div','rx-ayuda');const ic=el('i');ay.append(ic,el('b',null,'📈 '+nrx+' hechos tienen reacción de precios'),document.createTextNode(': los puntos con aro azul. Haz clic en uno y pulsa «Ver reacción» (hasta 3 a la vez) para superponer Brent, bitcoin, stablecoins, etc. alrededor de esa fecha.'));c.append(ay)}
  const g=el('div','grid2');const izq=el('div');
  let ini=new Date(Math.min(...D.movimientos.map(m=>+new Date(m.fecha))));
  if(rango!=='todo'){const x=new Date(HOY);x.setDate(x.getDate()-Number(rango));ini=x}
  const span=HOY-ini;const ruler=el('div','ruler');
  for(let k=0;k<=4;k++)ruler.append(el('span',null,new Date(+ini+span*k/4).toISOString().slice(0,7)));
  izq.append(ruler);
  let tot=0;const vis=[];const bq=buscaTL.trim().toLowerCase();
  for(const cp of D.capas){
    if(capasOff.has(cp.id))continue;
    const ca=el('div','carril');ca.append(el('div','nom',cp.nombre));const eje=el('div','eje');
    for(const mv of D.movimientos){
      if(mv.capa!==cp.id||!paisOk(mv))continue;
      if(bq&&!(mv.actor+' '+mv.texto+' '+(mv.act||[]).join(' ')+' '+(mv.ent||[]).join(' ')).toLowerCase().includes(bq))continue;
      if(soloRx&&reacMotivo(mv))continue;const t=new Date(mv.fecha+'T00:00:00');if(t<ini||t>HOY)continue;tot++;vis.push(mv);
      const n=el('div','nodo');n.style.left=((t-ini)/span*100)+'%';n.style.background=colEst(mv.estado);
      if(selMov===mv)n.classList.add('sel');if(reac.includes(mv))n.classList.add('mk');const rxok=!reacMotivo(mv);if(rxok)n.classList.add('rx');n.title=mv.fecha+' · '+mv.actor+(rxok?' · 📈 con reacción de precios':'');
      if(mv.origen==='noticia')n.classList.add('noti');n.onclick=()=>{selMov=mv;pTiempo()};eje.append(n)}
    ca.append(eje);izq.append(ca)}
  const lg=el('div','leyenda');for(const k in D.estados){const sp=el('span');const i=el('i');i.style.background=D.estados[k].color;sp.append(i,D.estados[k].nombre);lg.append(sp)}
  izq.append(lg,el('div','nota-v',tot+' movimientos visibles de '+D.movimientos.length+'.'));
  const lado=el('div','lado');
  if(!selMov){
    lado.append(el('b',null,'Haz clic en un punto para ver el hecho completo, la fuente y el nivel de certeza.'));
    const cn={};vis.forEach(m=>cn[m.estado]=(cn[m.estado]||0)+1);const ch=el('div','cuentas');
    for(const k in D.estados)if(cn[k]){const x=el('span','chip',D.estados[k].nombre+': '+cn[k]);x.style.borderColor=D.estados[k].color;x.style.background=D.estados[k].color+'2e';ch.append(x)}
    lado.append(ch,el('h3',null,'Lo más reciente en pantalla'));
    for(const m of vis.slice().sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,12)){const d=el('div','hecho clic');d.style.borderLeftColor=colEst(m.estado);d.append(el('b',null,m.fecha+' · '+m.actor+': '),document.createTextNode(m.texto.length>190?m.texto.slice(0,190)+'…':m.texto),botonReac(m));d.onclick=()=>{selMov=m;pTiempo()};lado.append(d)}
    if(!vis.length)lado.append(el('p','nota-v','Ningún movimiento con este rango o filtro; prueba «Todo el periodo».'))}
  else ficha(lado,selMov);
  g.append(izq,lado);c.append(g);s.append(c);
}
function ficha(lado,mv){
  lado.append(el('b',null,mv.fecha+' · '+mv.actor),el('p',null,mv.texto));
  const d=el('dl');
  const add=(k,v)=>{d.append(el('dt',null,k));const dd=el('dd');if(v instanceof Node)dd.append(v);else dd.textContent=v;d.append(dd)};
  add('Capa',capaNom(mv.capa));add('Estado',(D.estados[mv.estado]||{}).nombre||mv.estado);add('XRP/XLM',D.nombra[mv.nombra]||mv.nombra);
  add('Fuente',mv.fuente);add('Países',(mv.pais||[]).join(', ')||'—');add('Entidades',(mv.ent||[]).join(', ')||'—');add('Activos',(mv.act||[]).join(', ')||'—');
  const u=urlInf(mv);if(u){const a=el('a',null,mv.informe.split('/').pop());a.href=u;a.target='_blank';add('Informe',a)}else add('Informe','—');
  if(mv.caduca)add('Caduca',mv.caduca+' · revisión '+(mv.frecuencia||'—'));
  if(mv.url){const a=el('a',null,'Abrir la noticia');a.href=mv.url;a.target='_blank';add('Enlace',a)}
  const mot=reacMotivo(mv),br=el('div');br.append(botonReac(mv));if(mot&&!reac.includes(mv))br.append(el('div','nota-v',mot));
  lado.append(br,d);
}

/* ---------- 3b · «Ver reacción»: precio de varios activos alrededor de 1-3 eventos (explorador/precios_historico.json) ---------- */
let reac=[],reacBase=0,reacGrupo='cripto',reacVent=7;const reacSel={};
const REAC_COL=['#5aa9e6','#ffd166','#2fe08f','#ff6b6b','#b8a1ff','#ff9f43','#9fe7ff'];
const PH=()=>D&&D.precios_historico&&D.precios_historico.series?D.precios_historico:null;
const sumaDias=(f,k)=>{const d=new Date(f+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+k);return d.toISOString().slice(0,10)};
const difDias=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const diaSem=f=>['dom','lun','mar','mié','jue','vie','sáb'][new Date(f+'T00:00:00Z').getUTCDay()];
function reacRango(){const H=PH();let ini='9999',fin='';if(H)for(const k in H.series){const d=H.series[k].datos;if(d&&d.length){if(d[0][0]<ini)ini=d[0][0];if(d[d.length-1][0]>fin)fin=d[d.length-1][0]}}return [ini,fin]}
function reacMotivo(mv){   // null si se puede ver la reacción; si no, el motivo
  if(!PH())return 'Sin precios: falta explorador/precios_historico.json (python scripts/actualizar_precios_historico.py)';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(mv.fecha||''))return 'Fecha no exacta';
  const [ini,fin]=reacRango();
  const hl=new Date(HOY-HOY.getTimezoneOffset()*6e4).toISOString().slice(0,10);   // fecha local (HOYS va en UTC)
  if(mv.fecha>hl)return 'Evento futuro: aún no hay precios';
  if(mv.fecha<=ini)return 'Sin precios antes del '+ini;
  if(mv.fecha>fin)return 'Aún no hay cierre posterior al evento (último cierre: '+fin+')';
  return null}
function botonReac(mv){
  const b=el('button','bt-reac'),on=reac.includes(mv),mot=reacMotivo(mv);
  b.textContent=on?'✓ Marcado (quitar)':'📈 Ver reacción';if(on)b.classList.add('on');
  if(!on&&mot){b.disabled=true;b.title=mot;b.textContent='📈 No disponible'}
  else if(!on&&reac.length>=3){b.disabled=true;b.title='Máximo 3 eventos a la vez: quita uno'}
  else b.title=on?'Quitar este evento del gráfico':'Superponer el precio de varios activos alrededor de esta fecha (máx. 3 eventos)';
  b.onclick=e=>{e.stopPropagation();if(on)reac=reac.filter(x=>x!==mv);else{reac.push(mv);reacBase=reac.length-1;if(reac.length===1)reacGrupo=mv.capa==='energia'?'energia':mv.capa==='stable'?'stable':/stablecoin|usdt|usdc|tether|paridad/i.test(mv.texto)?'stable':reacGrupo}
    reacBase=Math.max(0,Math.min(reacBase,reac.length-1));pTiempo();const p=$('reac-panel');if(p&&!on)p.scrollIntoView({block:'nearest'})};
  return b}
/* una serie alrededor de la fecha E: base = último cierre ANTES de E; v(c) = rebasado a 100 o, en stablecoins, desviación del peg en pb */
function reacSerie(s,E,N,fin){
  const d=s.datos||[],est=s.grupo==='stable';let ib=-1;
  for(let i=0;i<d.length;i++){if(d[i][0]<E)ib=i;else break}
  if(ib<0)return null;
  const base=d[ib][1],v=c=>est?(c-1)*1e4:c/base*100,mov=c=>est?(c-1)*1e4:(c/base-1)*100;
  const pts=d.filter(p=>p[0]>=sumaDias(E,-N)&&p[0]<=sumaDias(E,N)).map(p=>[difDias(E,p[0]),v(p[1]),p[0],p[1]]);
  const en=k=>{const lim=sumaDias(E,k);if(lim>fin)return null;let r=null;for(let i=ib+1;i<d.length&&d[i][0]<=lim;i++)r=d[i];return r?{f:r[0],m:mov(r[1])}:null};
  const pk={};for(const k of [0,1,3,7])pk[k]=en(k);
  let mx=null;for(let i=ib+1;i<d.length&&d[i][0]<=sumaDias(E,N);i++){const m=mov(d[i][1]);if(!mx||Math.abs(m)>Math.abs(mx.m))mx={m,f:d[i][0]}}
  const prim=d[ib+1]?d[ib+1][0]:null;
  return {pts,base:d[ib],prim,pk,mx,est}}
const fmov=(m,est)=>m==null?'—':(m>0?'+':'')+num(m,est||Math.abs(m)>=1?1:2)+(est?' pb':' %');
function panelReac(){
  const H=PH(),c=el('div','reac');c.id='reac-panel';
  if(!H){c.append(el('p','nota-v','Sin precios: ejecuta python scripts/actualizar_precios_historico.py'));return c}
  const fin=reacRango()[1];
  c.append(el('h3',null,'📈 Reacción de precios alrededor de '+(reac.length===1?'1 evento':reac.length+' eventos')));
  // eventos marcados: el elegido es la base (línea continua); los demás, líneas discontinuas
  const pe=el('div','pills');
  reac.forEach((m,j)=>{const p=el('div','pill'+(j===reacBase?' on':''));p.title='Centrar el gráfico en este evento';p.append(el('b',null,'E'+(j+1)+' '),document.createTextNode(m.fecha+' ('+diaSem(m.fecha)+') · '+m.actor+' '));
    const x=el('span',null,'✕');x.title='Quitar';x.style.cssText='margin-left:6px;color:var(--baja)';x.onclick=e=>{e.stopPropagation();reac.splice(j,1);reacBase=Math.max(0,Math.min(reacBase,reac.length-1));pTiempo()};p.append(x);
    p.onclick=()=>{reacBase=j;pTiempo()};pe.append(p)});
  const q=el('div','pill',' Quitar todos');q.onclick=()=>{reac=[];pTiempo()};pe.append(q);c.append(pe);
  const ev=reac[reacBase],E=ev.fecha;
  c.append(el('div','nota-v','Base (E'+(reacBase+1)+'): '+ev.texto.slice(0,220)+(ev.texto.length>220?'…':'')));
  // controles: grupo, activos y ventana
  const ctl=el('div','reac-ctl');
  const sg=el('select');for(const k in H.grupos){const o=el('option',null,H.grupos[k]);o.value=k;if(k===reacGrupo)o.selected=true;sg.append(o)}sg.onchange=()=>{reacGrupo=sg.value;pTiempo()};

function grafReac(filas,E,N,est){

  const ref=est?0:100;lo=Math.min(lo,ref);hi=Math.max(hi,ref);const pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;

  // series

    r.pts.forEach(p=>svg.append(mk('circle',{cx:X(p[0]),cy:Y(p[1]),r:2.4,fill:r.col})))});
  // tooltip: valor y fecha del cierre más cercano (hasta ese día) de cada activo
  const wrap=el('div','reac-graf'),tip=el('div','reac-tip'),guia=mk('line',{y1:mt,y2:Hh-mb,stroke:'#ffffff55','stroke-width':1,visibility:'hidden'});svg.append(guia);

  capa.addEventListener('mousemove',e=>{const bb=svg.getBoundingClientRect(),sx=(e.clientX-bb.left)/bb.width*W;const d=Math.max(-N,Math.min(N,Math.round((sx-ml)/(W-ml-mr)*2*N-N)));
    guia.setAttribute('x1',X(d));guia.setAttribute('x2',X(d));guia.setAttribute('visibility','visible');
    const f=sumaDias(E,d);tip.textContent='';tip.append(el('b',null,diaSem(f)+' '+f+' (día '+(d>0?'+':'')+d+')'));
    filas.forEach(r=>{let p=null;for(const q of r.pts)if(q[0]<=d)p=q;const ln=el('div');ln.style.color=r.col;
      ln.textContent=r.s.nombre+': '+(p?(est?fmov(p[1],true)+' ('+num(p[3],4)+' $)':num(p[1],1)+' ('+fmov(p[1]-100)+') · '+num(p[3],p[3]<10?4:2)+' '+r.s.unidad)+(p[2]!==f?' · cierre del '+p[2]:''):'sin cierre');tip.append(ln)});

function normT(x){return (x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}

function verifNoticia(m){

  if(reg){const con=reg.con?' · '+reg.con:'';
    if(reg.estado==='confirmado')return {cl:'ok',t:'✔ Confirmado'+con};
    if(reg.estado==='desmentido')return {cl:'mal',t:'✖ Desmentido'+con};
    return {cl:'mal',t:'✖ Dudoso'+con}}
  if(m.nivel==='P')return {cl:'ok',t:'✔ Confirmado (fuente primaria)'};
  const imp=m.origen!=='noticia'||(m.nota_bot||0)>=7;
  if(imp&&dias(m.fecha)>7)return {cl:'alerta',t:'◐ Sin contrastar (más de 7 días)'};
  return {cl:'sc',t:'◐ Sin contrastar'};
}
