<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Vistas de la Órbita</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e1420;--panel:#161e2e;--lin:#2a3550;--tx:#e6ebf5;--tx2:#9fb0cf;--ac:#5aa9e6;--nul:#1b2336;--sube:#2fe08f;--baja:#ff6b6b;--fs:clamp(15px,.5vw + 7px,18px);--fs-s:clamp(14px,.5vw + 6.4px,16px);--fs-xs:clamp(13px,.45vw + 5.5px,14.5px);--gap:clamp(6px,.9vw,12px);--pad:clamp(7px,.9vw,12px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.4 system-ui,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
header{padding:8px 20px;border-bottom:1px solid var(--lin)}
h1{font-size:clamp(17px,.6vw + 10px,21px);margin:0 0 2px}h2{font-size:clamp(16px,.5vw + 9px,19px);margin:0 0 clamp(5px,.6vw,8px)}h3{font-size:clamp(13.5px,.4vw + 7px,15.5px);margin:clamp(6px,.8vw,10px) 0 clamp(3px,.4vw,5px);color:var(--ac);text-transform:uppercase;letter-spacing:.03em}
.aviso{color:#e8b64a;font-size:14px}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px var(--pad) 0;background:var(--panel);border-bottom:1px solid var(--lin)}
nav button{border:1px solid var(--lin);border-bottom:none;border-radius:8px 8px 0 0;background:var(--bg);color:var(--tx2);padding:clamp(4px,.5vw,7px) clamp(8px,1vw,14px);font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#06101c;font-weight:600}
.barra{display:flex;gap:clamp(6px,1vw,14px);flex-wrap:wrap;align-items:center;padding:clamp(4px,.5vw,7px) var(--pad);background:var(--panel);border-bottom:1px solid var(--lin);font-size:var(--fs-s);color:var(--tx2)}
select,button,input[type=text]{background:var(--bg);color:var(--tx);border:1px solid var(--lin);border-radius:6px;padding:4px 8px;font:inherit}
button.on{background:var(--ac);color:#06101c}
main{padding:var(--gap) var(--pad);max-width:2400px;margin:0 auto}
section.vista{display:none}section.vista.on{display:block}
.caja{background:var(--panel);border:1px solid var(--lin);border-radius:10px;padding:var(--pad);margin-bottom:var(--gap)}
.caja>h2:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,24vw,520px);gap:var(--gap);align-items:start}@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.lado{position:static;max-height:none}}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,clamp(300px,34vw,520px)),1fr));gap:var(--gap);align-items:start}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,clamp(260px,26vw,380px)),1fr));gap:var(--gap);align-items:start}
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,clamp(220px,19vw,280px)),1fr));gap:var(--gap);align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,clamp(140px,14vw,190px)),1fr));gap:clamp(5px,.6vw,8px);margin:clamp(4px,.5vw,6px) 0}
.kpi{background:var(--bg);border:1px solid var(--lin);border-radius:8px;padding:clamp(5px,.5vw,7px) clamp(7px,.8vw,10px)}
.kpi b{display:block;font-size:clamp(18px,.9vw + 8px,24px)}.kpi span{font-size:var(--fs-xs);color:var(--tx2)}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--lin);padding:clamp(4px,.4vw,7px) clamp(6px,.7vw,10px);font-size:var(--fs-s);text-align:left;vertical-align:top}
th{color:var(--tx2);font-weight:600;background:#121a2a}
td.n,th.n{text-align:right;white-space:nowrap}
.sube,.kpi span.sube{color:var(--sube);font-weight:600}.baja,.kpi span.baja{color:var(--baja);font-weight:600}.igual{color:var(--tx2)}.kpi .sube,.kpi .baja,.kpi .igual{display:block;margin-top:2px}
.cambio{font-size:var(--fs-xs);display:block}
table.mat{table-layout:fixed}table.mat th{text-align:center;vertical-align:middle;font-size:var(--fs-s)}table.mat th.pais{width:clamp(130px,14vw,260px);text-align:left;font-size:var(--fs)}table.mat td.c{height:clamp(38px,2.5vw,48px);text-align:center;padding:0}
table.mat th.pais{position:sticky;left:0;background:var(--panel);color:var(--tx)}
td.c .ch{display:flex;align-items:center;justify-content:center;gap:7px;font-size:var(--fs);height:100%;padding:2px}
.nodato{background:var(--nul);color:#667;border:1px dashed #445}
.v .ch{outline:2px dashed var(--tx2);outline-offset:-4px}
.s .ch{background-image:repeating-linear-gradient(45deg,transparent 0 5px,#ffffff22 5px 7px)}
.punto{width:11px;height:11px;border-radius:50%;background:#ffd24a}
#tip{position:fixed;display:none;max-width:380px;background:#05080f;border:1px solid var(--ac);border-radius:8px;padding:10px;font-size:15px;z-index:9;pointer-events:none}
.leyenda{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--tx2);margin:6px 0}
.leyenda i{display:inline-block;width:14px;height:14px;vertical-align:middle;border-radius:3px;margin-right:3px}
.carril{display:flex;align-items:center;border-bottom:1px solid var(--lin);height:clamp(36px,2.9vw,54px)}.carril:hover{background:#131b2b}
.carril .nom{width:clamp(150px,14vw,280px);padding-right:8px;font-size:14px;color:var(--tx2);flex:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.carril .eje{position:relative;flex:1;height:100%;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),#2a355088 calc(25% - 1px) 25%)}
.nodo{position:absolute;top:50%;margin-top:calc(var(--nd)/-2);--nd:clamp(15px,1.1vw,22px);width:var(--nd);height:var(--nd);border-radius:50%;border:2px solid #0008;cursor:pointer;transform:translateX(-50%)}
.nodo.sel{outline:2px solid #fff}
.ruler{margin-left:clamp(150px,14vw,280px);margin-bottom:4px;display:flex;justify-content:space-between;font-size:13px;color:var(--tx2)}
.lado{line-height:1.5;background:var(--bg);border:1px solid var(--lin);border-radius:8px;padding:10px;font-size:15px;position:sticky;top:8px;max-height:85vh;overflow:auto}
.noticias{display:grid;gap:clamp(12px,1.2vw,22px);align-items:start}.nota .cab{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-bottom:3px;color:var(--tx2);font-size:var(--fs-xs)}.nota .cab b{color:var(--tx)}.nota .txt{font-size:var(--fs)}.nota .pie{margin-top:4px;font-size:var(--fs-xs);color:var(--tx2)}.capa-tag{border:1px solid var(--lin);border-radius:10px;padding:0 8px;font-size:var(--fs-xs)}
.nota{border-left:5px solid;border-radius:6px;padding:8px 12px;margin-bottom:10px;line-height:1.45;background:var(--bg);font-size:14.5px}
.n24{border-color:#ff5d5d;background:rgba(255,93,93,.12)}.n7{border-color:#f0a04a;background:rgba(240,160,74,.1)}.n30{border-color:#8a94a8;background:rgba(138,148,168,.08)}
.ej{background:#3a2d10;color:#ffd98a;padding:1px 6px;border-radius:4px;font-size:13px}
.badge{display:inline-block;border-radius:4px;padding:0 6px;font-size:13.5px;border:1px solid var(--lin);color:var(--tx2);margin-right:4px}
.badge{font-weight:700}.badge.P{border-color:#2fe08f;color:#2fe08f;background:rgba(47,224,143,.14)}.badge.S{border-color:#e8b64a;color:#e8b64a;background:rgba(232,182,74,.14)}.badge.V{border-color:#ff6b6b;color:#ff6b6b;background:rgba(255,107,107,.14)}
.ctag{padding:3px 6px!important;font-size:11.5px;font-weight:800;line-height:1;padding:2px 4px;border-radius:4px;background:rgba(8,12,22,.85);border:1px solid}.ctag.P{color:#2fe08f}.ctag.S{color:#e8b64a}.ctag.V{color:#ff6b6b}
.imp{display:inline-block;border-radius:4px;padding:0 6px;font-size:13px;font-weight:700;border:1px solid var(--lin);color:var(--tx2);margin-right:6px}.imp.alto{background:#ff6b6b;border-color:#ff6b6b;color:#1a0707}.imp.medio{border-color:#e8b64a;color:#e8b64a;background:rgba(232,182,74,.12)}.imp.bajo{opacity:.75}
.ev{--c:#888;border:1px solid var(--lin);border-left:5px solid var(--c);border-radius:6px;padding:clamp(4px,.4vw,6px) clamp(6px,.7vw,10px);font-size:var(--fs-s);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 15%,transparent),transparent 65%),var(--bg);transition:transform .15s,box-shadow .15s}.ev:hover{transform:translateY(-1px);box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.ev.alto{border-left-width:8px;border-color:color-mix(in srgb,var(--c) 60%,var(--lin));background:linear-gradient(90deg,color-mix(in srgb,var(--c) 28%,transparent),transparent 75%),var(--bg);box-shadow:0 0 14px color-mix(in srgb,var(--c) 22%,transparent)}.ev.bajo{opacity:.86}
.ev .tema{font-size:13px;font-weight:700;color:var(--c)}
.punto-tema{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.chip{display:inline-block;border:1px solid var(--lin);border-radius:10px;padding:0 7px;font-size:13.5px;color:var(--tx2);margin:1px 3px 1px 0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{border:1px solid var(--lin);border-radius:16px;padding:4px 11px;cursor:pointer;background:var(--bg);color:var(--tx2);font-size:15px}
.pill.on{color:var(--tx);border-width:2px}
.pill i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.lista{display:grid;gap:clamp(5px,.6vw,8px);grid-template-columns:repeat(auto-fill,minmax(min(100%,clamp(280px,32vw,520px)),1fr));align-items:start}
.item{background:var(--bg);border:1px solid var(--lin);border-radius:8px;padding:clamp(5px,.5vw,7px) clamp(7px,.8vw,10px)}
.hecho{background:var(--bg);border-left:3px solid var(--lin);border-radius:4px;padding:clamp(3px,.35vw,5px) clamp(5px,.6vw,8px);margin-bottom:clamp(3px,.4vw,5px);font-size:var(--fs-s)}
.cab-capa{border-left:5px solid var(--lin)}
.tarj{background:var(--bg);border:1px solid var(--lin);border-radius:8px;padding:8px 10px}
.tarj h4{margin:0 0 4px;font-size:15px}
.cifra{font-size:clamp(20px,1vw + 9px,26px);font-weight:700}
ul{margin:4px 0;padding-left:18px}li{margin:2px 0}
dl{margin:4px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}dt{color:var(--tx2)}dd{margin:0}
a{color:var(--ac)}
.nota-v{color:var(--tx2);font-size:14px;margin:4px 0}
.que{color:var(--tx2);font-size:14.5px;margin:2px 0 6px}
details.bl{margin-bottom:clamp(4px,.5vw,10px)}details.bl>summary{cursor:pointer;font-weight:600;padding:4px 0}
.barrita{display:inline-block;height:9px;background:var(--ac);border-radius:2px;vertical-align:middle}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px}
.bars div{flex:1;background:var(--ac);min-width:6px;position:relative}
.bars small{position:absolute;bottom:-16px;left:0;font-size:11.5px;color:var(--tx2)}
svg.sp{vertical-align:middle}
.masonry{display:block}
.mbanda{display:flex;gap:var(--gap);align-items:flex-start;margin-bottom:clamp(5px,.6vw,10px)}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:clamp(5px,.6vw,10px)}
.masonry>details.bl,.mcol>details.bl,.mcol>.grp{overflow-x:auto;min-width:0}
.masonry>details.bl{margin-bottom:clamp(5px,.6vw,10px)}
.rej{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,clamp(280px,30vw,420px)),1fr));gap:var(--gap);align-items:start}
.ficha{display:block}.ficha .grp{min-width:0}
.ficha h3:first-child{margin-top:0}
.vacias{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 10px;margin-bottom:12px;background:var(--panel);border:1px dashed var(--lin);border-radius:8px;font-size:14.5px;color:var(--tx2)}
.vacias b{color:var(--tx)}
.mes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,clamp(280px,30vw,440px)),1fr));gap:clamp(5px,.5vw,8px) clamp(6px,.8vw,10px);align-items:start;margin-bottom:6px}
.mes .hecho{margin:0}
.alt{border-top:1px dashed var(--lin);margin-top:8px;padding-top:6px}
.alt h4{margin:0 0 4px;font-size:14px;color:var(--tx2);font-weight:600}
.clic{cursor:pointer}
.clic:hover{background:#1c2740}
.cuentas{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
/* ---- v4: pulido y movimiento sobrio ---- */
table tr{transition:background-color .15s}
table tr:hover td{background:#1b2640}
table.mat tr:hover td.c{background:inherit}
table.mat td.c:not(.nodato){transition:transform .12s,filter .12s}
table.mat td.c:not(.nodato):hover{filter:brightness(1.25);transform:scale(1.06);position:relative;z-index:1}
.kpi,.tarj,.hecho,.item,.nota,.pill{transition:border-color .15s,background-color .15s,transform .15s}
.kpi:hover,.tarj:hover,.item:hover{border-color:var(--ac);transform:translateY(-1px)}
.hecho:hover,.nota:hover,.ev:hover{background-color:#1b2640}
.pill:hover{border-color:var(--ac);color:var(--tx)}
nav button{transition:background-color .15s,color .15s}nav button:hover:not(.on){color:var(--tx);background:#1b2640}
.nodo{transition:transform .12s}.nodo:hover{transform:translateX(-50%) scale(1.35)}.nodo.noti{border-radius:3px;transform:translateX(-50%) rotate(45deg)}
.vista.ent{animation:ent .28s ease-out}
.vista.fx .caja,.vista.fx .vacias,.vista.fx .pills{animation:sube .5s ease-out both}
.vista.fx>.caja:nth-child(2),.vista.fx>.cols2>.caja:nth-child(2),.vista.fx>.cols3>.caja:nth-child(2){animation-delay:.08s}
.vista.fx>.caja:nth-child(3),.vista.fx>.cols3>.caja:nth-child(3){animation-delay:.16s}
.vista.fx>.caja:nth-child(n+4){animation-delay:.22s}
.vista.fx .kpi,.vista.fx .tarj{animation:sube .45s ease-out both}
.vista.fx .kpi:nth-child(2){animation-delay:.04s}.vista.fx .kpi:nth-child(3){animation-delay:.08s}.vista.fx .kpi:nth-child(4){animation-delay:.12s}.vista.fx .kpi:nth-child(n+5){animation-delay:.16s}
.vista.fx .ev,.vista.fx .hecho,.vista.fx .item,.vista.fx .nota{animation:sube .45s ease-out both}
.vista.fx .nodo{animation:pop .45s ease-out both .15s}
.vista.fx table.mat td.c{animation:ent .6s ease-out both}
.vista.fx .barrita{transform-origin:left;animation:ancho .8s ease-out both .2s}
.vista.fx .bars div{transform-origin:bottom;animation:alto .7s ease-out both .2s}
.vista.fx svg.sp polyline{stroke-dasharray:1;stroke-dashoffset:1;animation:dibuja 1s ease-out forwards .2s}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.2)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes ent{from{opacity:0}to{opacity:1}}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ancho{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes alto{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dibuja{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="barra">
<label>País <select id="fpais"><option value="">Todos</option></select></label>
<label>Tema <select id="ftema"><option value="">Todos</option></select></label>
<label>Certeza <select id="fcert"><option value="">Todas</option><option value="P">Solo [P]</option><option value="S">[P] y [S]</option></select></label>
<label><input type="checkbox" id="fcambio"> Solo cambios en 30 días (matriz)</label>
<span>Densidad matriz: <button id="dsem" class="on">Semáforo</button><button id="ddat">Datos</button></span>
<span id="estado"></span>
</div>
<main>
<section class="vista" id="v-resumen"></section>
<section class="vista" id="v-capas"></section>
<section class="vista" id="v-tiempo"></section>
<section class="vista" id="v-calendario"></section>
<section class="vista" id="v-matriz"></section>
<section class="vista" id="v-noticias"></section>
<section class="vista" id="v-voces"></section>
<section class="vista" id="v-paneles"></section>
</main>
<div id="tip"></div>
<script>
const $=id=>document.getElementById(id);
const COL=['#c0504d','#c8923a','#bdb04a','#3f9aa8','#3aa56f','#2fcf85'];
const HOY=new Date();const HOYS=HOY.toISOString().slice(0,10);
const dias=f=>Math.floor((HOY-new Date(f+'T00:00:00'))/864e5);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const cert=f=>f==='P'?'🛡':(f==='S'?'◐':'△');
const bcl=n=>n==='P'?'P':(n&&n[0]==='S'?'S':'V');
const num=(x,d=1)=>x==null||isNaN(x)?'—':Number(x).toLocaleString('es-ES',{maximumFractionDigits:d,minimumFractionDigits:d>1&&Math.abs(x)<100?Math.min(d,2):0});
const usd=x=>x==null?'—':'$'+(Math.abs(x)>=1e12?num(x/1e12,2)+' billones':Math.abs(x)>=1e9?num(x/1e9,1)+' mil millones':Math.abs(x)>=1e6?num(x/1e6,0)+' millones':num(x,0));
const TABS=[['resumen','Resumen'],['capas','Capas'],['tiempo','Línea de tiempo'],['calendario','Calendario'],['matriz','Matriz país × tema'],['noticias','Noticias'],['voces','Voces'],['paneles','Paneles de datos']];
let R,D,V,P,CAL,FMI,VAL,BAN,RES,X,modo='sem',selMov=null,selCapa=null,selCelda=null,tab='resumen',listo=false;

/* ---------- utilidades de pintado ---------- */
/* subida en verde y bajada en rojo, siempre y con flecha (también bonos, tipos, TIC, stablecoins, índices y ETF); un cambio cero queda gris */
function cambio(v,suf='%',d=1){
  if(v==null||isNaN(v))return el('span','igual','—');
  v=Number(v.toFixed(d));
  const s=el('span',v===0?'igual':v>0?'sube':'baja');
  s.textContent=(v>0?'▲ +':v<0?'▼ ':'= ')+num(v,d)+' '+suf;return s}
function spark(arr,w=90,h=22,col='#5aa9e6'){
  const a=arr.filter(v=>v!=null);if(a.length<2)return el('span');
  const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;
  const pts=a.map((v,i)=>(i/(a.length-1)*(w-4)+2).toFixed(1)+','+(h-3-(v-mn)/r*(h-6)).toFixed(1)).join(' ');
  const ns='http://www.w3.org/2000/svg';const s=document.createElementNS(ns,'svg');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('class','sp');
  const p=document.createElementNS(ns,'polyline');p.setAttribute('points',pts);p.setAttribute('pathLength','1');p.setAttribute('fill','none');p.setAttribute('stroke',col);p.setAttribute('stroke-width','1.6');s.append(p);
  const t=document.createElementNS(ns,'title');t.textContent='mín '+num(mn,2)+' · máx '+num(mx,2);s.append(t);return s}
function barra(p,col){const b=el('span','barrita');b.style.width=Math.max(2,Math.min(100,p))+'px';if(col)b.style.background=col;return b}
function tabla(cols,filas){
  const t=el('table');const h=el('tr');
  for(const c of cols)h.append(el('th',c.n?'n':'',c.t));t.append(h);
  for(const f of filas){const r=el('tr');
    for(const c of cols){const td=el('td',c.n?'n':'');const v=c.f?c.f(f):f[c.k];
      if(v instanceof Node)td.append(v);else td.textContent=v==null?'—':v;r.append(td)}
    t.append(r)}
  return t}
function kpi(v,t,cam){const k=el('div','kpi');const b=el('b');if(v instanceof Node)b.append(v);else b.textContent=v;k.append(b,el('span',null,t));if(cam)k.append(cam);return k}
function kpis(l){const g=el('div','kpis');for(const x of l)if(x)g.append(kpi(...x));return g}
function nivelBadge(n){return el('span','badge '+bcl(n),n||'?')}
function chips(l){const s=el('span');for(const x of l||[])s.append(el('span','chip',x));return s}
function bloque(tit,que,pie,cont,abierto=true){
  const d=el('details','bl');d.open=abierto;d.append(el('summary',null,tit));
  if(que)d.append(el('div','que',que));d.append(cont);
  if(pie){const p=el('div','nota-v');if(pie.nivel)p.append(nivelBadge(pie.nivel));p.append(document.createTextNode(' '+(pie.t||'')));d.append(p)}return d}
function paisOk(mv){

  izq.append(ruler);

    ca.append(eje);izq.append(ca)}
  const lg=el('div','leyenda');for(const k in D.estados){const sp=el('span');const i=el('i');i.style.background=D.estados[k].color;sp.append(i,D.estados[k].nombre);lg.append(sp)}

  if(!selCelda){
    lado.append(el('b',null,'Haz clic en una celda para ver el hecho completo, lo que falta, la próxima fecha, los hitos y los informes. Pasar el ratón enseña un resumen.'));
    const cs=R.celdas.filter(x=>x.etapa!=null&&(!fp||x.jur===fp));const cn={};cs.forEach(x=>cn[x.etapa]=(cn[x.etapa]||0)+1);
    lado.append(el('h3',null,'Celdas por etapa ('+cs.length+')'));
    for(const k in R.escala){const f=el('div');const sp=el('span','barrita');sp.style.background=COL[k];sp.style.width=Math.max(2,(cn[k]||0)/Math.max(1,cs.length)*200)+'px';f.append(document.createTextNode(k+' '+R.escala[k]+': '+(cn[k]||0)+' '),sp);lado.append(f)}
    lado.append(el('h3',null,'Revisadas más recientemente'));
    for(const x of cs.filter(x=>x.revisado).sort((a,b)=>a.revisado<b.revisado?1:-1).slice(0,6)){
      const j=R.jurisdicciones.find(q=>q.id===x.jur),t=R.temas.find(q=>q.id===x.tema);if(!j||!t)continue;
      const d=el('div','hecho clic');d.style.borderLeftColor=COL[x.etapa];d.append(el('b',null,j.nombre+' · '+t.nombre),el('div','nota-v','Etapa '+x.etapa+' · revisado '+x.revisado));d.onclick=()=>{selCelda=[x,j,t];pMatriz()};lado.append(d)}}
  else{const [x,j,t]=selCelda;lado.append(el('b',null,j.nombre+' · '+t.nombre),el('p',null,x.estado||'Sin dato'));
    const d=el('dl');const add=(k,v)=>{d.append(el('dt',null,k));const dd=el('dd');if(v instanceof Node)dd.append(v);else dd.textContent=v;d.append(dd)};
    add('Etapa',x.etapa==null?'sin dato':x.etapa+' · '+R.escala[x.etapa]);add('Fecha',x.fecha||'—');add('Nivel',x.fuente||'—');add('Revisado',x.revisado||'—');
    add('Próxima',x.proxima?(x.proxima.fecha+': '+x.proxima.que):'—');add('Falta',x.falta||'—');
    if(x.url){const a=el('a',null,x.url);a.href=x.url;a.target='_blank';add('Fuente',a)}
    lado.append(d);
    if(x.hitos&&x.hitos.length){lado.append(el('h3',null,'Hitos'));lado.append(gen(x.hitos))}
    if(x.informes&&x.informes.length){lado.append(el('h3',null,'Informes'));lado.append(gen(x.informes))}}
  g.append(izq,lado);c.append(g);
  c.append(el('div','leyenda','Certeza: etiqueta verde P (liso) = [P] fuente primaria · ámbar S (rayado) = [S] prensa o agregador · roja V (borde discontinuo) = [VERIFICAR] · punto amarillo = revisado en 30 días · gris = sin research.'));
  if(R.huecos&&R.huecos.length){c.append(el('h3',null,'Huecos conocidos (zonas sin cubrir)'));c.append(tabla([{t:'Zona',f:h=>h.zona},{t:'Nota',f:h=>h.nota}],R.huecos))}
  s.append(c);
}
function tip(ev,x,j,t){
  const e=$('tip');e.textContent='';e.append(el('b',null,j.nombre+' · '+t.nombre));
  for(const [k,v] of [['Etapa',x.etapa==null?'sin dato':x.etapa+' · '+R.escala[x.etapa]],['Hecho',(x.estado||'').length>240?x.estado.slice(0,240)+'…':x.estado],['Fecha',(x.fecha||'—')+' · nivel '+x.fuente]]){
    const d=el('div');d.append(el('b',null,k+': '),document.createTextNode(v));e.append(d)}
  e.style.display='block';e.style.left=Math.min(ev.clientX+14,innerWidth-400)+'px';e.style.top=Math.min(ev.clientY+14,innerHeight-200)+'px';
}

/* ---------- 6 · Noticias ---------- */
function pNoticias(){
  const s=$('v-noticias');s.textContent='';
  const c=el('div','caja');c.append(el('h2',null,'Noticias con caducidad (24 h · 7 días · 30 días)'));
  const g={n24:[],n7:[],n30:[],arch:[]};
  for(const m of D.movimientos.filter(paisOk)){const a=dias(m.fecha);if(a<=1)g.n24.push(m);else if(a<=7)g.n7.push(m);else if(a<=30)g.n30.push(m);else g.arch.push(m)}
  const nNot=D.movimientos.filter(m=>m.origen==='noticia').length;
  c.append(el('div','nota-v','Hoy es '+HOYS+'. '+nNot+' noticias vigentes llegan del bot (nota ≥ 7) con caducidad; el resto son hechos del research. Lo de más de 30 días pasa al archivo ('+g.arch.length+' ahora).'));
  const cols=el('div','noticias');
  const tit={n24:'Últimas 24 h',n7:'Hasta 7 días',n30:'Hasta 30 días'};
  cols.style.gridTemplateColumns=['n24','n7','n30'].map(k=>g[k].length?'minmax(0,1fr)':'minmax(190px,.5fr)').join(' ');
  const ultM=D.movimientos.filter(paisOk).sort((a,b)=>a.fecha<b.fecha?1:-1)[0];
  for(const k of ['n24','n7','n30']){
    const col=el('div');col.append(el('h3',null,tit[k]+' ('+g[k].length+')'));
    if(!g[k].length){col.append(el('div','nota n30','Nada en este tramo.'));if(ultM)col.append(el('div','nota-v','Lo último registrado: '+ultM.fecha+' · '+ultM.actor+' ('+dias(ultM.fecha)+' días).'))}
    for(const m of g[k].sort((a,b)=>a.fecha<b.fecha?1:-1)){
      const n=el('div','nota '+k);
      const cab=el('div','cab');cab.append(el('b',null,m.fecha),el('span','capa-tag',capaNom(m.capa)));
      if(m.nivel)cab.append(el('span','badge '+m.nivel,m.nivel==='P'?'[P] oficial':m.nivel==='S'?'[S] prensa':'[VERIFICAR]'));
      if(m.caduca)cab.append(el('span',null,'caduca '+m.caduca));
      n.append(cab,el('div','txt',m.texto));
      const pie=el('div','pie');pie.append(document.createTextNode(m.actor));
      if(m.url){pie.append(document.createTextNode(' · '));const a=el('a',null,'abrir noticia');a.href=m.url;a.target='_blank';pie.append(a)}
      n.append(pie);col.append(n)}
    cols.append(col)}
  c.append(cols);
  const cc={};g.arch.forEach(m=>cc[m.capa]=(cc[m.capa]||0)+1);
  const rs=el('div','cuentas');rs.append(el('b',null,'Archivo por capa: '));for(const k in cc)rs.append(el('span','chip',capaNom(k)+': '+cc[k]));c.append(rs);
  const det=el('details');det.append(el('summary',null,'Archivo (más de 30 días): '+g.arch.length));
  det.append(tabla([{t:'Fecha',f:m=>m.fecha},{t:'Capa',f:m=>capaNom(m.capa)},{t:'Actor',f:m=>m.actor},{t:'Hecho',f:m=>m.texto}],g.arch.sort((a,b)=>a.fecha<b.fecha?1:-1)));
  c.append(det);s.append(c);
}

/* ---------- 7 · Voces ---------- */
let vNivel='',vConf='',vBusca='',vCapa='';
function pVoces(){
  const s=$('v-voces');s.textContent='';
  if(!V){s.textContent='No se pudo leer voces.json';return}
  const c=el('div','caja');c.append(el('h2',null,'Voces: declaraciones de personas e instituciones ('+V.voces.length+')'));
  c.append(el('div','nota-v',V.aviso));
  const f=el('div','barra');f.style.margin='8px -12px';
  const sn=el('select');sn.append(Object.assign(el('option',null,'Todos los niveles'),{value:''}));for(const k in V.niveles){const o=el('option',null,k+' · '+V.niveles[k][0]);o.value=k;sn.append(o)}sn.value=vNivel;sn.onchange=()=>{vNivel=sn.value;pVoces()};
  const sc=el('select');sc.append(Object.assign(el('option',null,'Toda confirmación'),{value:''}));for(const k in V.confirmaciones){const o=el('option',null,V.confirmaciones[k][0]);o.value=k;sc.append(o)}sc.value=vConf;sc.onchange=()=>{vConf=sc.value;pVoces()};
  const sk=el('select');sk.append(Object.assign(el('option',null,'Todas las capas'),{value:''}));for(const k of D.capas){const o=el('option',null,k.nombre);o.value=k.id;sk.append(o)}sk.value=vCapa;sk.onchange=()=>{vCapa=sk.value;pVoces()};
  const q=el('input');q.type='text';q.placeholder='Buscar…';q.value=vBusca;q.oninput=()=>{vBusca=q.value;clearTimeout(q.t);q.t=setTimeout(pVoces,250)};
  f.append(sn,sc,sk,q);c.append(f);
  const l=V.voces.filter(v=>(!vNivel||v.nivel===vNivel)&&(!vConf||v.conf===vConf)&&(!vCapa||(v.capas||[]).includes(vCapa))&&(!vBusca||(v.quien+' '+v.texto).toLowerCase().includes(vBusca.toLowerCase())));
  const cnt={};for(const v of l)cnt[v.conf]=(cnt[v.conf]||0)+1;
  c.append(el('div','nota-v',l.length+' voces · '+Object.keys(cnt).map(k=>V.confirmaciones[k][0]+' '+cnt[k]).join(' · ')));
  if(!l.length){const a=el('div','alt');a.append(el('h4',null,'Ninguna voz con estos filtros. Las más recientes de las '+V.voces.length+':'));
    for(const v of V.voces.slice().sort((a,b)=>a.cuando<b.cuando?1:-1).slice(0,3)){const d=el('div','hecho');d.append(el('b',null,v.quien+' · '+v.cuando+': '),document.createTextNode(v.texto));a.append(d)}c.append(a)}
  const ls=el('div','lista');
  for(const v of l.sort((a,b)=>a.cuando<b.cuando?1:-1)){
    const it=el('div','item');
    const h=el('div');const bn=el('span','badge',V.niveles[v.nivel][0]),cn=V.niveles[v.nivel][1];bn.style.color=cn;bn.style.borderColor=cn;bn.style.background=cn+'24';const cf=V.confirmaciones[v.conf],bc=el('span','badge',cf?cf[0]:v.conf);if(cf){bc.style.color=cf[1];bc.style.borderColor=cf[1];bc.style.background=cf[1]+'24'}it.style.borderLeft='4px solid '+cn;h.append(bn,bc,el('b',null,v.quien+' · '+v.cuando));
    it.append(h,el('div',null,v.texto));
    const m=el('small');
    const partes=[];if(v.plazo&&v.plazo.prometido)partes.push('Plazo: '+v.plazo.prometido+' ('+v.plazo.estado+') '+(v.plazo.resultado||''));if(v.usos&&v.usos.length)partes.push('Usos: '+v.usos.join(', '));if(v.redes&&v.redes.length)partes.push('Redes: '+v.redes.join(', '));
    m.textContent=partes.join(' · ');it.append(m);
    if(v.fuente&&v.fuente.url){const a=el('a',null,' · '+(v.fuente.n||'fuente'));a.href=v.fuente.url;a.target='_blank';it.append(a)}
    ls.append(it)}
  c.append(ls);s.append(c);
}

/* ---------- 8 · Paneles de datos ---------- */
function pPaneles(){
  const s=$('v-paneles');s.textContent='';
  const c=el('div','caja');c.append(el('h2',null,'Paneles de datos: cada bloque dice qué mide, en qué unidad, de dónde sale y cuándo se leyó'));
  const pie=(b,t)=>({nivel:b.nivel,t:t+' · leído '+(b.leido||(P&&P.leido))});
  const mz=masonry();
  const add=b=>{if(/^(Bonos|Cartera|Valoraci|Bancos europeos|Reservas|Deuda p|Calificaciones|Gasto)/.test(b.firstChild.textContent))b.classList.add('ancho');mz.append(b)};
  if(P){
    add(bloque('Bonos del Estado: rendimiento a cada plazo','Es el % anual que paga cada bono según su vencimiento (3 meses, 1 año, 10 años…). Si el rendimiento sube, el precio del bono baja. En pequeño, el cambio frente al día anterior en puntos básicos (100 pb = 1 punto). Las curvas no se calculan igual en cada país.',{nivel:'P',t:'Tesoro de EE. UU., Banco de Japón, BCE, Tesoro de España, AFT de Francia · leído '+P.bonos.leido},nBonos()));
    add(bloque('Tipos oficiales de los bancos centrales','El tipo con el que cada banco central presta al sistema: lo que más mueve el coste del dinero. «pb» = puntos básicos (25 pb = 0,25 puntos).',pie(P.tipos_vivos,'Bancos centrales'),nTipos()));
    add(bloque('Tipos de otros bancos centrales (BIS)',null,pie(P.tipos_bis,'BIS'),tabla([{t:'País',f:r=>r.pais},{t:'Banco central',f:r=>r.banco},{t:'Tipo oficial (% anual)',n:1,f:r=>r.valor},{t:'Dato de',f:r=>r.dato_de}],P.tipos_bis.paises)));
    add(bloque('Deuda de EE. UU. en manos extranjeras','Cuánta deuda del Tesoro de EE. UU. custodia cada país (no es el propietario final, e incluye cambios de valor: una bajada no es necesariamente una venta). Miles de millones de dólares.',pie(P.tic,'Tesoro de EE. UU., tabla TIC'),nTic()));
    add(bloque('Stablecoins: las mayores','Monedas digitales ligadas a una divisa (casi todas al dólar). «En circulación» es el valor emitido hoy.',pie(P.stablecoins,'DefiLlama, agregador'),nStable()));
    add(bloque('Stablecoins en el XRPL y en Stellar',null,pie(P.stablecoins,'DefiLlama'),nCadenas()));
    add(bloque('Protocolos RWA en DeFi','Activos del mundo real (bonos, fondos…) llevados a cadena. Ojo: es el valor bloqueado en DeFi, NO el total tokenizado.',pie(P.rwa,'DefiLlama'),nRwa()));
    add(bloque('Precios de XRP, XLM, BTC y ETH',null,pie(P.mercado,'CoinGecko'),nMercado()));
    add(bloque('Bolsas',null,pie(P.indices,'Yahoo Finance'),nIndices()));
    add(bloque('Cartera de seguimiento (ETF y valores)',null,pie(P.watchlist,'Yahoo Finance'),nWatch(),false));
    add(bloque('Liquidez: cantidad de dinero en la economía','M2 (EE. UU., Japón, China) y M3 (zona euro): cuánto dinero hay y a qué ritmo crece. Es contexto, no una señal por sí sola.',pie(P.liquidez,'FRED y BCE; Japón y China a mano'),nLiquidez()));
    add(bloque('Estrecho de Ormuz: tráfico de buques','Cuántos buques cruzan el estrecho por donde pasa buena parte del petróleo. Una caída fuerte indica cierre o bloqueo.',pie(P.ormuz,'IMF PortWatch'),nOrmuz()));
    add(bloque('Gasto en defensa','Porcentaje del PIB que cada país dedica a defensa, frente a hace 10 años.',pie(P.defensa,'Banco Mundial'),nDefensa(),false));
  }
  if(CAL)add(bloque('Calificaciones soberanas','Nota de solvencia que dan las agencias a cada país.',{nivel:'P',t:'Agencias y tesoros · leído '+CAL.leido},nCalif()));
  if(FMI)add(bloque('Deuda pública sobre el PIB (FMI)','Deuda total del gobierno como % del PIB; 2026 y años siguientes son previsiones.',{nivel:'P',t:FMI.edicion+' · leído '+FMI.leido},nFmi()));
  if(RES)add(bloque('Reservas de divisas, oro y balances de bancos centrales',null,{nivel:'P',t:'FMI, World Gold Council, bancos centrales · leído '+RES.leido},nReservas(),false));
  if(VAL)add(bloque('Valoración de 18 valores (PER, EV/EBITDA, caja libre)',VAL.aviso,{t:'Cálculo propio con datos de las empresas · '+VAL.generado.slice(0,10)},nVal(),false));
  if(BAN)add(bloque('Bancos europeos: deuda soberana en su balance (EBA)','Lo que cada banco tiene en bonos de Estados; el capital CET1 es su colchón de máxima calidad. Los 15 mayores de '+BAN.bancos.length+'.',{nivel:BAN.nivel,t:'EBA, corte '+BAN.periodo},nEbaTop(15),false));
  c.append(mz);s.append(c);
}
let nc0=ncols(),tRz;addEventListener('resize',()=>{clearTimeout(tRz);tRz=setTimeout(()=>{if(listo&&ncols()!==nc0){nc0=ncols();pintarTodo()}},200)});
cargar();
