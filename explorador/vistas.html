let reac=[],reacBase=0,reacGrupo='cripto',reacVent=7;const reacSel={};

const PH=()=>D&&D.precios_historico&&D.precios_historico.series?D.precios_historico:null;

function reacRango(){const H=PH();let ini='9999',fin='';if(H)for(const k in H.series){const d=H.series[k].datos;if(d&&d.length){if(d[0][0]<ini)ini=d[0][0];if(d[d.length-1][0]>fin)fin=d[d.length-1][0]}}return [ini,fin]}
function reacMotivo(mv){   // null si se puede ver la reacción; si no, el motivo
  if(!PH())return 'Sin precios: falta explorador/precios_historico.json (python scripts/actualizar_precios_historico.py)';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(mv.fecha||''))return 'Fecha no exacta';
  const [ini,fin]=reacRango();
  const hl=new Date(HOY-HOY.getTimezoneOffset()*6e4).toISOString().slice(0,10);   // fecha local (HOYS va en UTC)
  if(mv.fecha>hl)return 'Evento futuro: aún no hay precios';
  if(mv.fecha<=ini)return 'Sin precios antes del '+ini;
  if(mv.fecha>fin)return 'Aún no hay cierre posterior al evento (último cierre: '+fin+')';
  return null}

function normT(x){return (x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
/* El TIPO de fuente (primaria/prensa) no es la verificación. Primaria = confirmada sola; el resto, según eventos/verificados.json. */
function verifNoticia(m){
  const reg=(D.verificados||[]).find(v=>(!v.fecha||v.fecha===m.fecha)&&v.contiene&&normT(m.texto).includes(normT(v.contiene)));
  if(reg){const con=reg.con?' · '+reg.con:'';
    if(reg.estado==='confirmado')return {cl:'ok',t:'✔ Confirmado'+con};
    if(reg.estado==='matizado')return {cl:'ok',t:'✔ Confirmado con matiz'+con};   /* el hecho es cierto; la cifra, la hora o el contrato difieren entre fuentes */
    if(reg.estado==='desmentido')return {cl:'mal',t:'✖ Desmentido'+con};
    return {cl:'mal',t:'✖ Dudoso (abierto hasta que otra fuente lo confirme o lo desmienta)'+con}}
  if(m.nivel==='P')return {cl:'ok',t:'✔ Confirmado (fuente primaria)'};
  const imp=m.origen!=='noticia'||(m.nota_bot||0)>=7;
  if(imp&&dias(m.fecha)>7)return {cl:'alerta',t:'◐ Sin contrastar (más de 7 días)'};
  return {cl:'sc',t:'◐ Sin contrastar'};
}

/* ---------- Países: política (C58) + indicadores (C59) + estabilidad (C61), todo por país, solo cifras publicadas ---------- */
let grupoPa='UE',subEs='eco',paisSel='';
const NOMI={ipc:'IPC',paro:'Paro',paro_juvenil:'Paro juvenil',pib:'PIB',deuda:'Deuda pública',deficit:'Déficit',pobreza:'Pobreza',gini:'Gini',salario_minimo:'Salario mínimo',balanza_corriente:'Balanza por cuenta corriente',poblacion:'Población',electricidad_pc:'Electricidad por habitante',gasto_defensa:'Gasto en defensa'};

function nfp(v,u){if(v==null)return '—';const n=Number(v).toLocaleString('es-ES',{maximumFractionDigits:2}),m=/^([$£€¥])\s*(.*)$/.exec(u||'');return m?m[1]+n+(m[2]?' '+m[2]:''):n+(u?' '+u:'')}
/* Países: secciones plegables; cada cifra en tres líneas: valor (con color y flecha), año/fecha y «antes» */
const BUENO_SUBE_N=/esperanza|gasto sanitario|gasto público en educación|banda ancha|médicos|camas|control de la corrupción|estabilidad política|imperio de la ley/i;
const MALO_SUBE_N=/mortalidad|homicidios|empleo vulnerable|sobrecarga|ratio de dependencia/i;
const SUELTA_UNID=/ (% |por |suscripciones|años|hijos|\$|estimación|personas).*$/;
const cortaUnid=(v,u)=>nfp(v,u).replace(SUELTA_UNID,m=>/^ %/.test(m)?' %':'');
function tendGen(nombre,valor,ant,antf,clave){if(valor==null||ant==null)return null;const d=valor-ant;
  if(Math.abs(d)<0.005*Math.max(1,Math.abs(ant)))return{c:'#ffffff',f:'●',t:'sin cambio frente a '+(antf||'el dato anterior')};
  let signo=null;if(clave)signo=NEUTRO_PA[clave]?null:BUENO_SUBE[clave]?1:-1;else if(BUENO_SUBE_N.test(nombre))signo=1;else if(MALO_SUBE_N.test(nombre))signo=-1;
  const col=signo==null?'#ffffff':((d>0)===(signo>0))?'#4fe3a1':'#ff6b7d';
  return{c:col,f:d>0?'▲':'▼',t:(signo==null?'cambia':col==='#4fe3a1'?'mejora':'empeora')+' ('+(d>0?'+':'')+d.toLocaleString('es-ES',{maximumFractionDigits:2})+' frente a '+(antf||'el dato anterior')+')'}}

  c.appendChild(v);
  /* C129: fecha y valor anterior en UNA línea (antes eran dos de 12 px); la fecha del anterior va al pasar el ratón */

  if(ant!=null&&antf)c.title+=' · anterior: '+antf

const UNID_FILA={ipc:'% anual, último mes',paro:'% de la población activa',paro_juvenil:'% de activos menores de 25',pib:'% anual, en volumen',deuda:'% del PIB',deficit:'% del PIB',pobreza:'% de la población',gini:'0 = igualdad, 100 = desigualdad',salario_minimo:'euros o moneda local',balanza_corriente:'% del PIB (negativo = déficit exterior)',poblacion:'millones de habitantes',electricidad_pc:'kWh por habitante y año',gasto_defensa:'% del PIB'};

const NOMH={ipc:'IPC',paro:'Paro',paro_juvenil:'Paro juvenil',pib:'PIB',deuda:'Deuda pública',deficit:'Déficit (− = déficit)',pobreza:'Pobreza o exclusión',pobreza_infantil:'Pobreza infantil',gini:'Gini'};
/* contexto común a todos los países: se cita si se solapa con el mandato; no explica por sí solo ningún cambio */
const EXTERNOS=[['2020-03','2021-12','pandemia de COVID-19'],['2022-02','2023-06','guerra de Ucrania y crisis de la energía'],['2022-07','2023-09','subidas rápidas de tipos del BCE y la Fed'],['2025-04','2026-12','aranceles de EE. UU.']];
const finPer=p=>/^\d{4}$/.test(p)?p+'-12':/Q(\d)$/.test(p)?p.slice(0,4)+'-'+String(+p.slice(-1)*3).padStart(2,'0'):p.slice(0,7);

const iniPer=p=>/^\d{4}$/.test(p)?p+'-01':/Q(\d)$/.test(p)?p.slice(0,4)+'-'+String(+p.slice(-1)*3-2).padStart(2,'0'):p.slice(0,7);

function bloqueHistoria(pid,ids){

  const ult=k=>{const s=S[k];return [s.v[s.v.length-1],s.p[s.p.length-1]]};
  const ext=(k,f)=>{const s=S[k];let i=0;s.v.forEach((v,j)=>{if(f(v,s.v[i]))i=j});return [s.v[i],s.p[i]]};
  const cel=(k,x)=>x?fmtH(k,x[0])+' ('+x[1]+')':'—';

    {t:'Hace 2 años',n:1,f:k=>cel(k,enSerie(S[k],perAtras(ult(k)[1],2)))},

    {t:'Evolución',f:k=>spark(S[k].v,120,28)}],filas);

  const dh=document.createElement('details');dh.open=true;dh.style.marginTop='12px';dh.append(el('summary','','Historia: último dato frente a hace 2 y 5 años, y máximo y mínimo de la serie'));
  const env=el('div');env.style.overflowX='auto';env.append(t);dh.append(env,el('p','nota-v',(H.nota||'')+' «Hace 2/5 años» = mismo mes, trimestre o año; «—» si ese periodo no está publicado.'));w.append(dh);

/* C136 · un mandato = tarjetas pequeñas (una por indicador), con el mismo estilo que Noticias y Voces: cifra grande, periodo, hito y contraste */
function bloqueMandato(mm,actual,pid,ids,S,filas,H){
  const ym=mm.desde.slice(0,7),yh=mm.hasta?mm.hasta.slice(0,7):null;
  const hoy=(D.calendario&&D.calendario.hoy)||new Date().toISOString().slice(0,10);
  const dm=document.createElement('details');dm.open=actual;dm.style.marginTop='12px';
  dm.append(el('summary','',(actual?'Durante el mandato de ':'Mandato anterior: ')+mm.quien+' ('+mm.cargo+', '+ym+(yh?' a '+yh:' hasta hoy')+')'));
  const cab=el('p','nota-v');cab.append(nivelBadge(mm.nivel),document.createTextNode(' Inicio: '+mm.desde+(yh?' · fin: '+mm.hasta:'')+(mm.previo?' · '+mm.previo:'')+(mm.nota?' · '+mm.nota:'')+' '));
  if(mm.fuente){const a=el('a',null,'fuente');a.href=mm.fuente;a.target='_blank';a.rel='noopener';cab.append(a)}dm.append(cab);
  if(actual){const meses=(+hoy.slice(0,4)-+mm.desde.slice(0,4))*12+(+hoy.slice(5,7)-+mm.desde.slice(5,7));
    if(meses<24)dm.append(el('p','aviso-s','⚠ Mandato de menos de 2 años ('+meses+' meses): muchos indicadores anuales aún no tienen dato posterior al inicio y los cambios dicen poco todavía.'))}
  const g=el('div','mand-g');
  for(const k of filas){const s=S[k],t=el('div','nota mnd'),c=el('div','cab');c.append(el('b',null,NOMH[k]));t.append(c);
    let ini=antesDe(s,ym),aprox=false;
    if(!ini&&(iniPer(s.p[0])>=ym||(/^\d{4}$/.test(s.p[0])&&s.p[0]===ym.slice(0,4)))&&(!yh||iniPer(s.p[0])<=yh)){ini=[s.v[0],s.p[0]];aprox=true}
    let fin=null;if(yh){s.p.forEach((p,i)=>{if(finPer(p)<=yh)fin=[s.v[i],p]})}else fin=[s.v[s.v.length-1],s.p[s.p.length-1]];
    if(!ini||!fin||iniPer(fin[1])<ym){t.append(el('div','txt','Sin dato publicado dentro de este mandato (serie '+s.desde+' a '+s.hasta+').'));g.append(t);continue}
    const d=Math.round((fin[0]-ini[0])*10)/10;
    const chip=el('span','mnd-d',(d>0?'▲ +':d<0?'▼ −':'= ')+num(Math.abs(d),1)+unidH(k));c.append(chip);
    const big=el('div','mnd-g',fmtH(k,ini[0])+' → '+fmtH(k,fin[0]));t.append(big);
    t.append(el('div','nota-v',ini[1]+(aprox?' (primer dato de la serie)':'')+' a '+fin[1]));
    const iMx=s.v.indexOf(Math.max(...s.v)),iMn=s.v.indexOf(Math.min(...s.v)),rg=s.desde.slice(0,4)+'-'+s.hasta.slice(0,4);
    const dentro=p=>finPer(p)>=ym&&(!yh||finPer(p)<=yh);
    const hit=[];if(dentro(s.p[iMx]))hit.push('máximo de la serie '+rg+' en '+s.p[iMx]+' ('+fmtH(k,s.v[iMx])+')');if(dentro(s.p[iMn]))hit.push('mínimo de la serie '+rg+' en '+s.p[iMn]+' ('+fmtH(k,s.v[iMn])+')');
    if(hit.length)t.append(el('div','hito','★ '+hit.join(' · ')));
    const otros=ids.filter(x=>x!==pid).map(x=>{const o=(H.paises[x]||{})[k];if(!o)return null;const a=enSerie(o,ini[1]),b=enSerie(o,fin[1]);return a&&b?b[0]-a[0]:null}).filter(x=>x!=null).sort((a,b)=>a-b);
    if(otros.length>=2){const md=otros.length%2?otros[(otros.length-1)/2]:(otros[otros.length/2-1]+otros[otros.length/2])/2;const r=Math.round(md*10)/10;
      t.append(el('div','nota-v','Los otros '+otros.length+' países del grupo, en los mismos periodos: '+(r>0?'+':r<0?'−':'')+punto(num(Math.abs(r),1)+unidH(k))))}
    g.append(t)}
  dm.append(g);
  const solapa=EXTERNOS.filter(([a,b])=>b>=ym&&a<=(yh||hoy.slice(0,7))).map(x=>x[2]+' ('+x[0]+' a '+x[1]+')');

  const orden=(k,b)=>{const t=(b.querySelector('summary')||{}).textContent||'',i=(ORD[k]||[]).findIndex(r=>r.test(t));return i<0?999:i};
  const EXPL=[[/^Economía de España/,"Una fila por cada serie viva del INE (Instituto Nacional de Estadística): precios (IPC = índice de precios de consumo, la inflación), PIB (producto interior bruto: lo que produce el país en un periodo), paro según la EPA (Encuesta de Población Activa) y costes laborales. «Último dato» va en % (tasas) o en M€ (millones de euros) cuando es un importe, como el PIB corriente; «Cambio» compara con el periodo anterior en p.p. (puntos porcentuales: la resta entre dos porcentajes) o en % si es un importe. «Avance» y «provisional» quieren decir que el INE puede corregirlo. No explica por qué sube o baja ni compara con otros países."],[/^Ingresos y gasto de todas las administraciones/,"Cuentas de todas las administraciones públicas juntas (Estado, comunidades, ayuntamientos y Seguridad Social) según Eurostat (la oficina estadística de la UE): ingresos, gastos y sus partidas. «M€» = millones de euros del último año disponible; «% del PIB» lo mide frente al tamaño de la economía; el euro por habitante, cuando aparece, va a precios constantes (sin inflación). No es el presupuesto del Estado ni de un solo año, y no dice si el dinero está bien gastado."],[/zona euro y EE\. UU\./,"Compara España con la zona euro (los 20 países que usan el euro, «EA20») y EE. UU. en 2019 y 2025. Todo va en % del PIB: gasto público, ingresos públicos, inversión, intereses y deuda; así se pueden comparar países de distinto tamaño. Un % mayor no es «mejor» ni «peor» por sí solo: refleja cuánto pesa lo público en cada economía. La deuda es lo acumulado; el resto son flujos de un año."],[/Agencia Tributaria/,"Lo recaudado por la AEAT (Agencia Estatal de Administración Tributaria), con su valor y unidad en cada fila (M€ = millones de euros, % = variación). Usa criterio de caja (lo realmente ingresado), por eso no coincide con Eurostat, que cuenta por devengo (cuando nace el impuesto) y añade cotizaciones y entes locales. Recaudar más no dice por sí solo si suben los tipos o crece la economía: la fila de «medidas» separa parte del efecto."],[/^Recaudación récord/,"Pone juntas dos cifras que suelen citarse por separado: lo que ingresa Hacienda (impuestos) y lo que se invierte en infraestructuras. Las filas traen su unidad (M€ = millones de euros o %) y su año; la recaudación es parcial (enero-septiembre) y la inversión es anual: no son directamente comparables. HECHO es lo medido; la relación entre ambas es una lectura, no una causa demostrada."],[/AIReF/,"La AIReF (Autoridad Independiente de Responsabilidad Fiscal) vigila las cuentas públicas. Esta tabla recoge sus previsiones (déficit y deuda en % del PIB; el déficit es lo que se gasta de más cada año, la deuda es lo acumulado). Son estimaciones a futuro, no datos observados, y pueden cambiar con cada informe."],[/Deuda del Estado \(Tesoro/,"Deuda del Estado según el Tesoro Público: saldo en M€ (millones de euros), vida media en años y reparto por tipo de título (letras, bonos, obligaciones). Es deuda nominal solo del Estado, así que no coincide con la deuda PDE (método europeo de Maastricht), que suma a todas las administraciones y sale como % del PIB. Cuánto se debe no dice si es sostenible."],[/^Deuda de las comunidades autónomas \(PDE/,"Cuánto deben las comunidades autónomas (CCAA) según el Banco de España con el criterio PDE (Protocolo de Déficit Excesivo, el método europeo para medir deuda pública). Cifras en M€ (millones de euros); «% de las comunidades» es la parte de cada una sobre el total de las comunidades, y las dos últimas columnas comparan con el trimestre y el año anterior. Es deuda acumulada, no el déficit de un año, y no se ajusta por población (eso lo hace el comparador de comunidades en «Presupuesto y gasto»)."],[/^Intereses de la deuda y aportación/,"Dos gastos que no son un servicio concreto: lo que cuesta endeudarse (intereses) y lo que España aporta a la Unión Europea. Cada fila trae su valor con unidad (M€ = millones de euros o % del PIB), el año, el nivel de la fuente y el enlace. Los intereses de todas las administraciones y los del Estado son cifras distintas: lee la nota de cada fila."],[/^Intereses de la deuda e infraestructuras/,"Compara lo que pagan las administraciones en intereses con lo que invierten y con lo que conservan en infraestructuras. Cifras en M€ (millones de euros) por año, con su fuente y nivel en cada fila. Que los intereses superen o no a la inversión es un dato; atribuir causas o decir qué debería pesar más es opinión."],[/Dinero al exterior/,"Dinero que España envía fuera (como la AOD, ayuda oficial al desarrollo, y aportaciones a organismos) y el que vuelve (como fondos europeos). Cada fila lleva su valor con unidad (M€ = millones de euros), año y nivel de fuente; los avances de prensa o de un ministerio pueden revisarse. No hace el balance neto, así que no restes unas filas a otras."],[/Rescate bancario/,"Cuánto dinero público se destinó al rescate bancario (2009-2017) y cuánto se ha recuperado. Cifras en M€ (millones de euros). Cada fuente cuenta un perímetro distinto (FROB, FGDEC, Tribunal de Cuentas), por eso las filas no se suman: son estimaciones del mismo episodio. Varias son nivel S (secundarias), pendientes de verificar."],[/^Pensiones y Seguridad Social/,"Pensiones y Seguridad Social (la caja que paga pensiones y prestaciones): cada fila trae su valor con su unidad. Ojo, mezcla cantidades (n.º de pensiones o de afiliados) con importes (€ al mes o M€): mira la unidad antes de comparar. «Pensión media» es el promedio de todo el sistema, no lo que cobra una persona concreta."],[/^Energía en España/,"Datos de energía en España, cada uno con su unidad (por ejemplo M€, €/MWh o %), año y nivel de la fuente. Mezcla cantidades con precios y porcentajes, así que no se suman entre sí."],[/^Presupuesto del Estado por ministerio/,"Una fila plegable por ministerio o partida, de más a menos gasto (obligaciones reconocidas de 2025, en M€ = millones de euros). A la derecha: % del gasto total del Estado y euros por habitante (€/hab.). Dentro, cada «capítulo» es un tipo de gasto (personal, intereses, inversiones, transferencias…) y la tabla trae su leyenda. Son solo cuentas del Estado: no incluyen a las comunidades ni a los ayuntamientos, y 2024 y 2025 no son siempre comparables si cambió la estructura de ministerios."],[/^Cómo leer el presupuesto del Estado/,"Guía de los bloques de presupuesto. El presupuesto se mide en M€ (millones de euros) y se reparte en secciones (ministerios y partidas fuera de ellos, como la deuda). «Crédito inicial» es lo aprobado, «definitivo» lo que queda tras modificaciones y «obligaciones reconocidas» lo que realmente se ha comprometido a pagar (la cifra más útil). Es el Estado, no toda la administración; el presupuesto propio de la Seguridad Social va aparte. IGAE = Intervención General de la Administración del Estado, que publica la ejecución."],[/^Quién gasta cada cosa/,"Reparte el gasto público por función (sanidad, educación, defensa, etc.; clasificación COFOG de la ONU) entre Estado, comunidades autónomas, ayuntamientos y Seguridad Social. Cifras en M€ (millones de euros) de 2024, según Eurostat; cada columna es un nivel de administración. Sirve para ver quién paga qué, no para saber si se gasta bien ni cuánto recibe cada persona."],[/^Presupuesto consolidado/,"Presupuesto de la ley de 2023 «consolidado» (Estado, organismos y Seguridad Social juntos, sin contar dos veces lo que se transfieren entre sí), repartido por políticas de gasto. Importe en M€ (millones de euros) y % del total. Es el presupuesto aprobado en 2023, no el gasto realizado ni el de 2025."],[/^Ejecución por políticas/,"Lo gastado por política de gasto (áreas como pensiones, sanidad o defensa) del presupuesto del Estado. Cifras en M€ (millones de euros): crédito inicial (aprobado), definitivo (tras modificaciones) y obligaciones reconocidas (lo comprometido) de 2024 y 2025, y la variación. Una política puede repartirse entre ministerios, y solo cuenta el Estado."],[/^Programas concretos/,"Partidas exactas del presupuesto del Estado de 2025 para temas de los que se habla mucho: igualdad, IMV (Ingreso Mínimo Vital), becas, inmigración, cooperación, dependencia… Cifras en M€ (millones de euros); cada programa lleva su código oficial y los mismos tramos que el resto (inicial, definitivo, obligaciones). No es todo lo que se gasta en ese tema: comunidades y ayuntamientos suman aparte."],[/aislar/,"Temas por los que se pregunta pero que no tienen partida propia o cuya cifra no se publica por separado. Aquí no se inventa nada: cada fila dice qué hay y qué no, con su fuente. «Sin cifra» significa que no se conoce, no que sea cero."],[/^Fuera de los ministerios: Seguridad Social/,"La Seguridad Social (pensiones y prestaciones) tiene su presupuesto aparte de los ministerios. Cada fila da un dato con su valor y unidad (M€ = millones de euros, % o n.º de personas), año, nivel de la fuente y enlace. Las cotizaciones son lo que pagan trabajadores y empresas; las transferencias, lo que pone el Estado. No dice si el sistema es sostenible: eso es opinión."],[/^Fuera de los ministerios: Casa Real/,"Organismos con presupuesto propio dentro del Estado (Casa Real, Cortes, tribunales, reguladores, RTVE, agencias). Importes de 2025 en M€ (millones de euros) de obligaciones reconocidas, % del gasto total del Estado y euros por habitante. «Sin dato leído» = no se ha podido leer, no que sea cero."],[/^Altos cargos y personal eventual/,"Por sección del presupuesto: lo que cuestan en 2025 los altos cargos (art. 10) y el personal eventual (art. 11, asesores de libre designación), en M€ (millones de euros). «Personal total (cap. 1)» es todo el gasto de personal de la sección y YA los incluye: no se suman. «Empleados» es un número de personas (Registro Central de Personal, enero 2026), no un importe; «Coste medio» = capítulo 1 entre empleados, en miles de euros por persona; «n/c» = no comparable. La fila TOTAL suma las filas."],[/^Personal público: cuántos/,"Cuántas personas trabajan para las administraciones. Dos fuentes miden cosas distintas y no se suman: el Registro Central de Personal cuenta efectivos (n.º de personas, con su % y tipo de contrato: funcionario de carrera, laboral u otro) y la EPA pregunta a hogares y da miles de ocupados en el sector público. Sirve para ver órdenes de magnitud, no para decir si son pocos o muchos."],[/^Personal público: cuánto cuesta/,"Lo que cuestan los sueldos públicos (remuneración de asalariados: sueldos más cotizaciones) por nivel de administración, en M€ (millones de euros) de 2025 y 2024, con su % del gasto de ese nivel y euros por habitante. Abajo, el reparto por función en 2024. Es coste total, no el sueldo de una persona; para el coste por persona de cada ministerio, mira «Altos cargos y personal eventual»."],[/^Personal público: comparación/,"Gasto en sueldos públicos como % del PIB (2024 y 2019) para varios países de la UE, según Eurostat. Mide cuánto pesa en cada economía, no cuántos empleados públicos hay ni cuánto cobran. Un % alto puede reflejar que el Estado presta servicios directamente (sanidad, educación) en vez de contratar empresas, no ineficacia."],[/^Cargos políticos/,"Intenta sumar lo que cuesta la política con lo publicado, en M€ (millones de euros) de 2025 y por habitante en €. «No incluye» enumera lo que falta, así que la suma es un mínimo, no el total. El número de cargos son personas; los sueldos, importes con su unidad. Cargos políticos no es lo mismo que funcionarios: ver «Personal público»."],[/^Empresas públicas/,"Cuentas de las principales empresas y entidades públicas, leídas de la web de cada una (2025). M€ = millones de euros. Cifra de negocio = lo que ingresan por su actividad; resultado neto = beneficio (+) o pérdida (−) del ejercicio; «no leída» = no encontrada, no cero. Los criterios contables difieren entre entidades: no las sumes sin mirar la nota. SEPI = Sociedad Estatal de Participaciones Industriales, el holding del Estado."]     intro.append(el('p',null,'Cómo leerlo: no hay cifras ni sumas aquí, solo casos (n.º) y fechas. La lista no es exhaustiva ni indica gravedad o importancia, y que un caso no aparezca no significa nada. Siglas: TSJCV = Tribunal Superior de Justicia de la Comunidad Valenciana; EPPO = Fiscalía Europea; CIAF = Comisión de Investigación de Accidentes Ferroviarios; suplicatorio = petición al Parlamento para poder procesar a quien tiene inmunidad; ejecutoria = fase en que se hace cumplir una sentencia; aforamiento = derecho a ser juzgado por un tribunal superior. Los importes en € son los que cita la nota oficial.'));
    const g=el('div','rej jus-grid');
    for(const cs of JU.casos){
      const hs=(cs.hechos_judiciales||[]).slice().sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||''));
      const t=el('div','tarj jus-card'+(hs.length?'':' jus-sin'));
      t.append(el('h4',null,cs.nombre));
      const ch=el('div','jus-chips');ch.append(el('span','jus-chip '+(hs.length?'ok':'no'),hs.length?'Con hechos oficiales':'Sin comprobar'));ch.append(el('span','jus-chip',cs.tribunal));if(cs.tipo)ch.append(el('span','jus-chip',cs.tipo));t.append(ch);
      t.append(el('p','jus-fase','Fase: '+cs.fase));
      if(cs.gobierno_epoca||cs.responsables){const q=el('p','jus-quien');if(cs.responsables){q.append(el('b',null,'Cargo implicado: '));q.append(document.createTextNode(cs.responsables+'. '))}if(cs.gobierno_epoca){q.append(el('b',null,'Gobierno en ese momento: '));q.append(document.createTextNode(cs.gobierno_epoca))}t.append(q)}
      if(!hs.length)t.append(el('p','jus-tx','Todavía no hay ningún hecho de fuente oficial leído para este caso [VERIFICAR].'));
      const hecho=h=>{const q=el('div','jus-hecho');q.append(el('b',null,fch(h.fecha)));q.append(el('p',null,h.texto+' '));
        if(/^https?:/.test(h.fuente||'')){const a=el('a',null,'Ver nota oficial');a.href=h.fuente;a.target='_blank';a.rel='noopener';q.lastChild.append(a)}return q};
      const cont=el('div','jus-hechos');
      if(hs.length>6){t.classList.add('jus-ancha');for(const h of hs)cont.append(hecho(h));t.append(cont)}
      else{for(const h of hs.slice(0,3))cont.append(hecho(h));t.append(cont);
        if(hs.length>3){const dt=el('details','jus-mas');dt.append(el('summary',null,'Ver '+(hs.length-3)+' hechos más'));for(const h of hs.slice(3))dt.append(hecho(h));t.append(dt)}}
      if((cs.filtraciones_prensa||[]).length){const q=el('div','jus-prensa');q.append(el('b',null,'Prensa (no oficial)'));const u=el('ul');for(const x of cs.filtraciones_prensa)u.append(el('li',null,typeof x==='string'?x:(x.texto||JSON.stringify(x))));q.append(u);t.append(q)}
      if((cs.opinion||[]).length){const q=el('div','jus-prensa');q.append(el('b',null,'Opinión'));const u=el('ul');for(const x of cs.opinion)u.append(el('li',null,typeof x==='string'?x:(x.texto||JSON.stringify(x))));q.append(u);t.append(q)}
      if((cs.pendiente||[]).length){const q=el('div','jus-pend');q.append(el('b',null,'Falta por comprobar'));const u=el('ul');for(const x of cs.pendiente)u.append(el('li',null,x));q.append(u);t.append(q)}
      g.append(t)}
    const wj=el('div');wj.append(intro,g);
    add(bloque('Justicia · casos en curso',null,{nivel:'P',t:'Poder Judicial (notas de prensa) · presunción de inocencia: una investigación no es una condena'},wj,true));
  }
  const nav=el('div');nav.style.cssText='margin:10px 0;display:flex;gap:8px;flex-wrap:wrap';
  let panel=null;
  TEMAS.forEach(([k,nom])=>{
    const lista=BL.filter(b=>b._t===k).sort((x,y)=>orden(k,x)-orden(k,y)),mzk=masonry();lista.forEach(b=>mzk.append(b));
    const bt=el('button','chip',nom+' · '+lista.length);bt.style.cssText='cursor:pointer;padding:6px 16px';
    if(k===subEs){bt.style.background='var(--oro,#d4a84b)';bt.style.color='#1a1405';panel=el('div');const kv=kpis(RES[k]);kv.classList.add('vivo');panel.append(kv,mzk)}
    bt.onclick=()=>{subEs=k;pEspana()};nav.append(bt)});
  c.append(nav,panel);s.append(c);
}

/* desplegables con datos: siempre abiertos al pintar; los de explicación («Cómo se lee», «En qué se basa») siguen plegados */
(function(){const ab=n=>{if(n.nodeType!==1)return;if(n.matches('details:not(.mas)')&&!n.dataset.auto){n.open=true;n.dataset.auto='1'}n.querySelectorAll('details:not(.mas):not([data-auto])').forEach(d=>{d.open=true;d.dataset.auto='1'})};
new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(ab))).observe(document.body,{childList:true,subtree:true});ab(document.body)})();
